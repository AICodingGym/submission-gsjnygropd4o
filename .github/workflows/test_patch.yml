name: SWE-bench Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-22.04
    timeout-minutes: 240
    env:
      INSTANCE_ID: "scikit-learn__scikit-learn-25747"
      REPO: "scikit-learn/scikit-learn"
      VERSION: "1.3"
      BASE_COMMIT: "2c867b8f822eb7a684f0d5c4359e4426e1c9cfe0"
      ENV_SETUP_COMMIT: "1e8a5b833d1b58f3ab84099c4582239af854b23a"
      TEST_CMD: 'pytest -rA'
      TEST_FILES: 'sklearn/utils/tests/test_set_output.py'
      CONDA_ENV: "testbed"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          fetch-tags: false

      - name: Setup Miniconda
        uses: conda-incubator/setup-miniconda@v3
        with:
          auto-activate-base: false
          miniforge-variant: Miniforge3
          python-version: "3.9"

      - name: Git Safe Directory
        shell: "bash -l {0}"
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Create Conda Environment
        shell: "bash -l {0}"
        run: |
          set -euo pipefail
          source "$(conda info --base)/etc/profile.d/conda.sh"
          if [ "$ENV_SETUP_COMMIT" != "$BASE_COMMIT" ]; then
            if ! git cat-file -e "$ENV_SETUP_COMMIT^{commit}" 2>/dev/null; then
              echo "ENV_SETUP_COMMIT not found locally, fetching from upstream..."
              git fetch --depth=1 "https://github.com/$REPO.git" "$ENV_SETUP_COMMIT" || true
            fi
            if git cat-file -e "$ENV_SETUP_COMMIT^{commit}" 2>/dev/null; then
              git checkout "$ENV_SETUP_COMMIT"
            else
              echo "ENV_SETUP_COMMIT still missing; skipping checkout"
            fi
          fi
          cat <<'ENV_EOF' > /tmp/environment.yml
          name: testbed
          channels:
            - defaults
            - conda-forge
          dependencies:
            - _libgcc_mutex=0.1=conda_forge
            - _openmp_mutex=4.5=2_gnu
            - blas=1.0=openblas
            - bottleneck=1.4.2=py39ha9d4c09_0
            - brotli=1.0.9=h5eee18b_8
            - brotli-bin=1.0.9=h5eee18b_8
            - bzip2=1.0.8=h5eee18b_6
            - c-ares=1.19.1=h5eee18b_0
            - ca-certificates=2024.9.24=h06a4308_0
            - contourpy=1.0.5=py39hdb19cb5_0
            - cycler=0.11.0=pyhd3eb1b0_0
            - cyrus-sasl=2.1.28=h52b45da_1
            - cython=3.0.10=py39h5eee18b_0
            - dbus=1.13.18=hb2f20db_0
            - exceptiongroup=1.2.0=py39h06a4308_0
            - expat=2.6.3=h6a678d5_0
            - fontconfig=2.14.1=h55d465d_3
            - fonttools=4.51.0=py39h5eee18b_0
            - freetype=2.12.1=h4a9f257_0
            - glib=2.78.4=h6a678d5_0
            - glib-tools=2.78.4=h6a678d5_0
            - gst-plugins-base=1.14.1=h6a678d5_1
            - gstreamer=1.14.1=h5eee18b_1
            - icu=73.1=h6a678d5_0
            - iniconfig=1.1.1=pyhd3eb1b0_0
            - joblib=1.4.2=py39h06a4308_0
            - jpeg=9e=h5eee18b_3
            - kiwisolver=1.4.4=py39h6a678d5_0
            - krb5=1.20.1=h143b758_1
            - lcms2=2.12=h3be6417_0
            - ld_impl_linux-64=2.40=h12ee557_0
            - lerc=3.0=h295c915_0
            - libabseil=20240116.2=cxx17_h6a678d5_0
            - libbrotlicommon=1.0.9=h5eee18b_8
            - libbrotlidec=1.0.9=h5eee18b_8
            - libbrotlienc=1.0.9=h5eee18b_8
            - libclang=14.0.6=default_hc6dbbc7_1
            - libclang13=14.0.6=default_he11475f_1
            - libcups=2.4.2=h2d74bed_1
            - libcurl=8.9.1=h251f7ec_0
            - libdeflate=1.17=h5eee18b_1
            - libedit=3.1.20230828=h5eee18b_0
            - libev=4.33=h7f8727e_1
            - libffi=3.4.4=h6a678d5_1
            - libgcc=14.2.0=h77fa898_1
            - libgcc-ng=14.2.0=h69a702a_1
            - libgfortran-ng=7.5.0=ha8ba4b0_17
            - libgfortran4=7.5.0=ha8ba4b0_17
            - libgfortran5=14.2.0=hd5240d6_1
            - libglib=2.78.4=hdc74915_0
            - libgomp=14.2.0=h77fa898_1
            - libiconv=1.16=h5eee18b_3
            - libllvm14=14.0.6=hecde1de_4
            - libnghttp2=1.57.0=h2d74bed_0
            - libopenblas=0.3.21=h043d6bf_0
            - libpng=1.6.39=h5eee18b_0
            - libpq=17.0=hdbd6064_0
            - libprotobuf=4.25.3=he621ea3_0
            - libssh2=1.11.0=h251f7ec_0
