name: SWE-bench Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-22.04
    timeout-minutes: 240
    env:
      INSTANCE_ID: "sphinx-doc__sphinx-9461"
      REPO: "sphinx-doc/sphinx"
      VERSION: "4.2"
      BASE_COMMIT: "939c7bb7ff7c53a4d27df067cea637540f0e1dad"
      ENV_SETUP_COMMIT: "336605b8e4b14c5da9f4d872fb730dc6894edb77"
      TEST_CMD: 'tox --current-env -epy39 -v --'
      TEST_FILES: 'tests/roots/test-ext-autodoc/target/properties.py tests/test_domain_py.py tests/test_ext_autodoc_autoclass.py tests/test_ext_autodoc_autoproperty.py'
      CONDA_ENV: "testbed"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          fetch-tags: false

      - name: Setup Miniconda
        uses: conda-incubator/setup-miniconda@v3
        with:
          auto-activate-base: false
          miniforge-variant: Miniforge3
          python-version: "3.9"

      - name: Git Safe Directory
        shell: "bash -l {0}"
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Create Conda Environment
        shell: "bash -l {0}"
        run: |
          set -euo pipefail
          source "$(conda info --base)/etc/profile.d/conda.sh"
          if [ "$ENV_SETUP_COMMIT" != "$BASE_COMMIT" ]; then
            if ! git cat-file -e "$ENV_SETUP_COMMIT^{commit}" 2>/dev/null; then
              echo "ENV_SETUP_COMMIT not found locally, fetching from upstream..."
              git fetch --depth=1 "https://github.com/$REPO.git" "$ENV_SETUP_COMMIT" || true
            fi
            if git cat-file -e "$ENV_SETUP_COMMIT^{commit}" 2>/dev/null; then
              git checkout "$ENV_SETUP_COMMIT"
            else
              echo "ENV_SETUP_COMMIT still missing; skipping checkout"
            fi
          fi
          cat <<'ENV_EOF' > /tmp/environment.yml
          name: testbed
          channels:
            - defaults
            - conda-forge
          dependencies:
            - _libgcc_mutex=0.1=main
            - _openmp_mutex=5.1=1_gnu
            - ca-certificates=2024.9.24=h06a4308_0
            - ld_impl_linux-64=2.40=h12ee557_0
            - libffi=3.4.4=h6a678d5_1
            - libgcc-ng=11.2.0=h1234567_1
            - libgomp=11.2.0=h1234567_1
            - libstdcxx-ng=11.2.0=h1234567_1
            - ncurses=6.4=h6a678d5_0
            - openssl=3.0.15=h5eee18b_0
            - pip=24.2=py39h06a4308_0
            - python=3.9.20=he870216_1
            - readline=8.2=h5eee18b_0
            - setuptools=75.1.0=py39h06a4308_0
            - sqlite=3.45.3=h5eee18b_0
            - tk=8.6.14=h39e8969_0
            - tzdata=2024b=h04d1e81_0
            - wheel=0.44.0=py39h06a4308_0
            - xz=5.4.6=h5eee18b_1
            - zlib=1.2.13=h5eee18b_1
            - pip:
                - alabaster==0.7.11
                - babel==2.16.0
                - cachetools==5.5.0
                - certifi==2024.8.30
                - chardet==5.2.0
                - charset-normalizer==3.4.0
                - colorama==0.4.6
                - coverage==7.6.4
                - cython==3.0.11
                - distlib==0.3.9
                - docutils==0.17.1
                - exceptiongroup==1.2.2
                - filelock==3.16.1
                - html5lib==1.1
                - idna==3.10
                - imagesize==1.4.1
                - iniconfig==2.0.0
                - jinja2==2.11.3
                - markupsafe==2.0.1
                - packaging==24.1
                - platformdirs==4.3.6
                - pluggy==1.5.0
                - pygments==2.18.0
                - pyproject-api==1.8.0
                - pytest==8.3.3
                - pytest-cov==5.0.0
                - requests==2.32.3
                - six==1.16.0
                - snowballstemmer==2.2.0
                - tomli==2.0.2
                - tox==4.16.0
                - tox-current-env==0.0.11
                - urllib3==2.2.3
                - virtualenv==20.26.6
                - webencodings==0.5.1
          ENV_EOF
          conda env create --file /tmp/environment.yml
          conda activate "$CONDA_ENV"
          rm /tmp/environment.yml
          python -m pip install tox==4.16.0 tox-current-env==0.0.11 Jinja2==3.0.3

      - name: Checkout Trigger Commit
        shell: "bash -l {0}"
        run: |
          set -euo pipefail
          if ! git cat-file -e "$BASE_COMMIT^{commit}" 2>/dev/null; then
            git fetch --depth=1 "https://github.com/$REPO.git" "$BASE_COMMIT" || true
          fi
          if ! git cat-file -e "$GITHUB_SHA^{commit}" 2>/dev/null; then
            git fetch --depth=1 "https://github.com/$REPO.git" "$GITHUB_SHA" || true
          fi
          git checkout "$GITHUB_SHA"

      - name: Install Repo
        shell: "bash -l {0}"
        run: |
          set -euo pipefail
          source "$(conda info --base)/etc/profile.d/conda.sh"
          conda activate "$CONDA_ENV"
          git fetch --tags "https://github.com/$REPO.git" || true
          TARGET_TIMESTAMP=$(git show -s --format=%ci "$BASE_COMMIT")
          git tag -l | while read tag; do TAG_COMMIT=$(git rev-list -n 1 "$tag"); TAG_TIME=$(git show -s --format=%ci "$TAG_COMMIT"); if [[ "$TAG_TIME" > "$TARGET_TIMESTAMP" ]]; then git tag -d "$tag"; fi; done
          sed -i 's/pytest/pytest -rA/' tox.ini
          sed -i 's/Jinja2>=2.3/Jinja2<3.0/' setup.py
          sed -i 's/sphinxcontrib-applehelp/sphinxcontrib-applehelp<=1.0.7/' setup.py
          sed -i 's/sphinxcontrib-devhelp/sphinxcontrib-devhelp<=1.0.5/' setup.py
          sed -i 's/sphinxcontrib-qthelp/sphinxcontrib-qthelp<=1.0.6/' setup.py
          sed -i 's/alabaster>=0.7,<0.8/alabaster>=0.7,<0.7.12/' setup.py
          sed -i "s/'packaging',/'packaging', 'markupsafe<=2.0.1',/" setup.py
          sed -i 's/sphinxcontrib-htmlhelp>=2.0.0/sphinxcontrib-htmlhelp>=2.0.0,<=2.0.4/' setup.py
          sed -i 's/sphinxcontrib-serializinghtml>=1.1.5/sphinxcontrib-serializinghtml>=1.1.5,<=1.1.9/' setup.py
          python -m pip install -e .[test]

      - name: Apply Test Patch
        shell: "bash -l {0}"
        run: |
          set -euo pipefail
          git apply --verbose --reject - <<'PATCH_EOF'
          diff --git a/tests/roots/test-ext-autodoc/target/properties.py b/tests/roots/test-ext-autodoc/target/properties.py
          --- a/tests/roots/test-ext-autodoc/target/properties.py
          +++ b/tests/roots/test-ext-autodoc/target/properties.py
          @@ -2,5 +2,10 @@ class Foo:
               """docstring"""
           
               @property
          -    def prop(self) -> int:
          +    def prop1(self) -> int:
          +        """docstring"""
          +
          +    @classmethod
          +    @property
          +    def prop2(self) -> int:
                   """docstring"""
          diff --git a/tests/test_domain_py.py b/tests/test_domain_py.py
          --- a/tests/test_domain_py.py
          +++ b/tests/test_domain_py.py
          @@ -813,8 +813,12 @@ def test_pyattribute(app):
           def test_pyproperty(app):
               text = (".. py:class:: Class\n"
                       "\n"
          -            "   .. py:property:: prop\n"
          +            "   .. py:property:: prop1\n"
                       "      :abstractmethod:\n"
          +            "      :type: str\n"
          +            "\n"
          +            "   .. py:property:: prop2\n"
          +            "      :classmethod:\n"
                       "      :type: str\n")
               domain = app.env.get_domain('py')
               doctree = restructuredtext.parse(app, text)
          @@ -822,15 +826,25 @@ def test_pyproperty(app):
                                     [desc, ([desc_signature, ([desc_annotation, "class "],
                                                               [desc_name, "Class"])],
                                             [desc_content, (addnodes.index,
          +                                                  desc,
          +                                                  addnodes.index,
                                                             desc)])]))
               assert_node(doctree[1][1][0], addnodes.index,
          -                entries=[('single', 'prop (Class property)', 'Class.prop', '', None)])
          +                entries=[('single', 'prop1 (Class property)', 'Class.prop1', '', None)])
               assert_node(doctree[1][1][1], ([desc_signature, ([desc_annotation, "abstract property "],
          -                                                     [desc_name, "prop"],
          +                                                     [desc_name, "prop1"],
          +                                                     [desc_annotation, ": str"])],
          +                                   [desc_content, ()]))
          +    assert_node(doctree[1][1][2], addnodes.index,
          +                entries=[('single', 'prop2 (Class property)', 'Class.prop2', '', None)])
          +    assert_node(doctree[1][1][3], ([desc_signature, ([desc_annotation, "class property "],
          +                                                     [desc_name, "prop2"],
                                                                [desc_annotation, ": str"])],
                                              [desc_content, ()]))
          -    assert 'Class.prop' in domain.objects
          -    assert domain.objects['Class.prop'] == ('index', 'Class.prop', 'property', False)
          +    assert 'Class.prop1' in domain.objects
          +    assert domain.objects['Class.prop1'] == ('index', 'Class.prop1', 'property', False)
          +    assert 'Class.prop2' in domain.objects
          +    assert domain.objects['Class.prop2'] == ('index', 'Class.prop2', 'property', False)
           
           
           def test_pydecorator_signature(app):
          diff --git a/tests/test_ext_autodoc_autoclass.py b/tests/test_ext_autodoc_autoclass.py
          --- a/tests/test_ext_autodoc_autoclass.py
          +++ b/tests/test_ext_autodoc_autoclass.py
          @@ -212,12 +212,20 @@ def test_properties(app):
                   '   docstring',
                   '',
                   '',
          -        '   .. py:property:: Foo.prop',
          +        '   .. py:property:: Foo.prop1',
                   '      :module: target.properties',
                   '      :type: int',
                   '',
                   '      docstring',
                   '',
          +        '',
          +        '   .. py:property:: Foo.prop2',
          +        '      :module: target.properties',
          +        '      :classmethod:',
          +        '      :type: int',
          +        '',
          +        '      docstring',
          +        '',
               ]
           
           
          diff --git a/tests/test_ext_autodoc_autoproperty.py b/tests/test_ext_autodoc_autoproperty.py
          --- a/tests/test_ext_autodoc_autoproperty.py
          +++ b/tests/test_ext_autodoc_autoproperty.py
          @@ -16,13 +16,28 @@
           
           @pytest.mark.sphinx('html', testroot='ext-autodoc')
           def test_properties(app):
          -    actual = do_autodoc(app, 'property', 'target.properties.Foo.prop')
          +    actual = do_autodoc(app, 'property', 'target.properties.Foo.prop1')
               assert list(actual) == [
                   '',
          -        '.. py:property:: Foo.prop',
          +        '.. py:property:: Foo.prop1',
                   '   :module: target.properties',
                   '   :type: int',
                   '',
                   '   docstring',
                   '',
               ]
          +
          +
          +@pytest.mark.sphinx('html', testroot='ext-autodoc')
          +def test_class_properties(app):
          +    actual = do_autodoc(app, 'property', 'target.properties.Foo.prop2')
          +    assert list(actual) == [
          +        '',
          +        '.. py:property:: Foo.prop2',
          +        '   :module: target.properties',
          +        '   :classmethod:',
          +        '   :type: int',
          +        '',
          +        '   docstring',
          +        '',
          +    ]
          PATCH_EOF

      - name: Run Tests
        shell: "bash -l {0}"
        run: |
          set -euo pipefail
          source "$(conda info --base)/etc/profile.d/conda.sh"
          conda activate "$CONDA_ENV"
          FAIL_TO_PASS_PATH=/tmp/fail_to_pass.json
          PASS_TO_PASS_PATH=/tmp/pass_to_pass.json
          TEST_DIRECTIVES_PATH=/tmp/test_directives.json
          TEST_RESULTS_PATH=/tmp/test_results.txt
          cat <<'FAIL_EOF' > "$FAIL_TO_PASS_PATH"
          ["tests/test_domain_py.py::test_pyproperty", "tests/test_ext_autodoc_autoclass.py::test_properties", "tests/test_ext_autodoc_autoproperty.py::test_class_properties"]
          FAIL_EOF
          cat <<'PASS_EOF' > "$PASS_TO_PASS_PATH"
          ["tests/test_domain_py.py::test_function_signatures", "tests/test_domain_py.py::test_domain_py_xrefs", "tests/test_domain_py.py::test_domain_py_xrefs_abbreviations", "tests/test_domain_py.py::test_domain_py_objects", "tests/test_domain_py.py::test_resolve_xref_for_properties", "tests/test_domain_py.py::test_domain_py_find_obj", "tests/test_domain_py.py::test_domain_py_canonical", "tests/test_domain_py.py::test_get_full_qualified_name", "tests/test_domain_py.py::test_parse_annotation", "tests/test_domain_py.py::test_pyfunction_signature", "tests/test_domain_py.py::test_pyfunction_signature_full", "tests/test_domain_py.py::test_pyfunction_signature_full_py38", "tests/test_domain_py.py::test_pyfunction_with_number_literals", "tests/test_domain_py.py::test_pyfunction_with_union_type_operator", "tests/test_domain_py.py::test_optional_pyfunction_signature", "tests/test_domain_py.py::test_pyexception_signature", "tests/test_domain_py.py::test_pydata_signature", "tests/test_domain_py.py::test_pydata_signature_old", "tests/test_domain_py.py::test_pydata_with_union_type_operator", "tests/test_domain_py.py::test_pyobject_prefix", "tests/test_domain_py.py::test_pydata", "tests/test_domain_py.py::test_pyfunction", "tests/test_domain_py.py::test_pyclass_options", "tests/test_domain_py.py::test_pymethod_options", "tests/test_domain_py.py::test_pyclassmethod", "tests/test_domain_py.py::test_pystaticmethod", "tests/test_domain_py.py::test_pyattribute", "tests/test_domain_py.py::test_pydecorator_signature", "tests/test_domain_py.py::test_pydecoratormethod_signature", "tests/test_domain_py.py::test_canonical", "tests/test_domain_py.py::test_canonical_definition_overrides", "tests/test_domain_py.py::test_canonical_definition_skip", "tests/test_domain_py.py::test_canonical_duplicated", "tests/test_domain_py.py::test_info_field_list", "tests/test_domain_py.py::test_info_field_list_piped_type", "tests/test_domain_py.py::test_info_field_list_var", "tests/test_domain_py.py::test_module_index", "tests/test_domain_py.py::test_module_index_submodule", "tests/test_domain_py.py::test_module_index_not_collapsed", "tests/test_domain_py.py::test_modindex_common_prefix", "tests/test_domain_py.py::test_noindexentry", "tests/test_domain_py.py::test_python_python_use_unqualified_type_names", "tests/test_domain_py.py::test_python_python_use_unqualified_type_names_disabled", "tests/test_domain_py.py::test_warn_missing_reference", "tests/test_ext_autodoc_autoclass.py::test_classes", "tests/test_ext_autodoc_autoclass.py::test_instance_variable", "tests/test_ext_autodoc_autoclass.py::test_inherited_instance_variable", "tests/test_ext_autodoc_autoclass.py::test_uninitialized_attributes", "tests/test_ext_autodoc_autoclass.py::test_undocumented_uninitialized_attributes", "tests/test_ext_autodoc_autoclass.py::test_decorators", "tests/test_ext_autodoc_autoclass.py::test_slots_attribute", "tests/test_ext_autodoc_autoclass.py::test_show_inheritance_for_subclass_of_generic_type", "tests/test_ext_autodoc_autoclass.py::test_autodoc_process_bases", "tests/test_ext_autodoc_autoclass.py::test_class_doc_from_class", "tests/test_ext_autodoc_autoclass.py::test_class_doc_from_init", "tests/test_ext_autodoc_autoclass.py::test_class_doc_from_both", "tests/test_ext_autodoc_autoclass.py::test_class_alias", "tests/test_ext_autodoc_autoclass.py::test_class_alias_having_doccomment", "tests/test_ext_autodoc_autoproperty.py::test_properties"]
          PASS_EOF
          cat <<'DIR_EOF' > "$TEST_DIRECTIVES_PATH"
          ["tests/roots/test-ext-autodoc/target/properties.py", "tests/test_domain_py.py", "tests/test_ext_autodoc_autoclass.py", "tests/test_ext_autodoc_autoproperty.py"]
          DIR_EOF
          export FAIL_TO_PASS_PATH PASS_TO_PASS_PATH TEST_DIRECTIVES_PATH TEST_RESULTS_PATH
          set +e
          python -c 'import textwrap; code = "import json\nimport os\nimport re\nimport shlex\nimport subprocess\nimport sys\n\ndef _load(key):\n    path = os.environ.get(\"{}_PATH\".format(key))\n    if path and os.path.exists(path):\n        with open(path, \"r\", encoding=\"utf-8\") as handle:\n            raw = handle.read()\n    else:\n        raw = os.environ.get(key, \"[]\")\n    try:\n        return json.loads(raw)\n    except Exception:\n        return []\n\ntest_cmd = os.environ[\"TEST_CMD\"]\nresults_path = os.environ.get(\"TEST_RESULTS_PATH\", \"/tmp/test_results.txt\")\nlog_parts = []\n\ndef log(message):\n    print(message, flush=True)\n    log_parts.append(message + \"\\n\")\n\ndef run_tests(label, tests):\n    if not tests:\n        print(\"No tests for {}\".format(label))\n        return True\n    cmd = \" \".join([test_cmd] + [shlex.quote(t) for t in tests])\n    print(\"Running {}: {}\".format(label, cmd), flush=True)\n    result = subprocess.run(\n        cmd,\n        shell=True,\n        stdout=subprocess.PIPE,\n        stderr=subprocess.PIPE,\n        universal_newlines=True,\n    )\n    stdout = result.stdout or \"\"\n    stderr = result.stderr or \"\"\n    if stdout:\n        print(stdout, end=\"\" if stdout.endswith(\"\\n\") else \"\\n\")\n    if stderr:\n        print(stderr, end=\"\" if stderr.endswith(\"\\n\") else \"\\n\", file=sys.stderr)\n    if stdout:\n        log_parts.append(stdout)\n    if stderr:\n        log_parts.append(stderr)\n    return result.returncode == 0\n\ndef _as_list(value):\n    if isinstance(value, list):\n        return value\n    if isinstance(value, str):\n        return [value]\n    return []\n\ndef _has_unbalanced_brackets(value):\n    depth = 0\n    escaped = False\n    for ch in value:\n        if escaped:\n            escaped = False\n            continue\n        if ch == \"\\\\\":\n            escaped = True\n            continue\n        if ch == \"[\":\n            depth += 1\n        elif ch == \"]\":\n            depth -= 1\n            if depth < 0:\n                return True\n    return depth != 0\n\ndef _has_space_outside_brackets(value):\n    depth = 0\n    for ch in value:\n        if ch == \"[\":\n            depth += 1\n        elif ch == \"]\":\n            depth = max(depth - 1, 0)\n        elif ch.isspace() and depth == 0:\n            return True\n    return False\n\ndef _looks_like_test_id(value):\n    return any(x in value for x in (\"::\", \"/\", \".py\"))\n\ndef _merge_bracket_fragments(labels):\n    merged = []\n    buffer = None\n    for raw in labels:\n        if not isinstance(raw, str):\n            continue\n        value = raw.strip()\n        if not value:\n            continue\n        if buffer is not None:\n            if _looks_like_test_id(value):\n                log(\"Deferring bracket-fragmented test for repair: {}\".format(repr(buffer)))\n                merged.append(buffer)\n                buffer = None\n                # Treat current value as a new candidate.\n            else:\n                buffer = buffer + \" \" + value\n                if not _has_unbalanced_brackets(buffer):\n                    merged.append(buffer)\n                    buffer = None\n                continue\n        if _has_unbalanced_brackets(value):\n            buffer = value\n            continue\n        merged.append(value)\n    if buffer is not None:\n        log(\"Deferring bracket-fragmented test for repair: {}\".format(repr(buffer)))\n        merged.append(buffer)\n    return merged\n\ndef normalize_labels(labels):\n    labels = _as_list(labels)\n    normalized = []\n    for label in labels:\n        if not isinstance(label, str):\n            continue\n        value = label.strip()\n        if not value:\n            continue\n        m = re.match(r\"^([^\\s]+)\\s+\\(([^)]+)\\)$\", value)\n        if m:\n            test_name, path = m.group(1), m.group(2).strip()\n            if re.search(r\"[\\\\/]\", path) or path.endswith(\".py\"):\n                normalized.append(\"{}::{}\".format(path, test_name))\n            else:\n                normalized.append(\"{}.{}\".format(path, test_name))\n        else:\n            normalized.append(value)\n    return normalized\n\ndef prefilter_tests(label, tests):\n    tests = _merge_bracket_fragments(_as_list(tests))\n    valid = []\n    skipped = []\n    for test in tests:\n        if not isinstance(test, str):\n            continue\n        value = test.strip()\n        if not value:\n            continue\n        if _has_unbalanced_brackets(value):\n            repaired = value + \"]\"\n            if not _has_unbalanced_brackets(repaired) and not _has_space_outside_brackets(repaired):\n                log(\"Repairing unbalanced brackets for {}: {} -> {}\".format(label, repr(value), repr(repaired)))\n                value = repaired\n            else:\n                fallback = value.split(\"[\", 1)[0].strip() if \"[\" in value else \"\"\n                if fallback and not _has_space_outside_brackets(fallback):\n                    log(\"Falling back to parent test for {}: {} -> {}\".format(label, repr(value), repr(fallback)))\n                    value = fallback\n                else:\n                    skipped.append(value)\n                    continue\n        if _has_space_outside_brackets(value):\n            skipped.append(value)\n            continue\n        valid.append(value)\n    if skipped:\n        skipped_str = \", \".join(repr(x) for x in skipped)\n        log(\"Skipping {} non-test entries: {}\".format(label, skipped_str))\n    return valid\n\ndef looks_qualified(labels):\n    return any(isinstance(l, str) and any(x in l for x in (\"::\", \"/\", \".\")) for l in labels)\n\nfail_to_pass = prefilter_tests(\n    \"FAIL_TO_PASS\",\n    normalize_labels(_load(\"FAIL_TO_PASS\")),\n)\npass_to_pass = prefilter_tests(\n    \"PASS_TO_PASS\",\n    normalize_labels(_load(\"PASS_TO_PASS\")),\n)\ntest_directives = prefilter_tests(\"TEST_DIRECTIVES\", _load(\"TEST_DIRECTIVES\"))\n\nuse_fail_pass = (fail_to_pass or pass_to_pass) and (\n    \"pytest\" in test_cmd or \"py.test\" in test_cmd or looks_qualified(fail_to_pass + pass_to_pass)\n)\n\nexit_code = 0\ntry:\n    if use_fail_pass:\n        if not run_tests(\"FAIL_TO_PASS\", fail_to_pass):\n            exit_code = 1\n        elif not run_tests(\"PASS_TO_PASS\", pass_to_pass):\n            exit_code = 1\n    else:\n        if not run_tests(\"TEST_DIRECTIVES\", test_directives):\n            exit_code = 1\nfinally:\n    try:\n        with open(results_path, \"w\", encoding=\"utf-8\") as handle:\n            handle.write(\"\".join(log_parts))\n    except Exception as exc:\n        print(\"Failed to write test results:\", exc)\nsys.exit(exit_code)"; exec(textwrap.dedent(code))'
          TEST_EXIT=$?
          echo "TEST_EXIT=$TEST_EXIT"
          export TEST_EXIT
          python -c 'import textwrap; code = "import json\nimport os\nimport sys\nimport urllib.request\n\nurl = os.environ.get(\n    \"WEBHOOK_URL\",\n    \"https://aicodinggym.com/api/webhooks/github\",\n)\ncommit_id = os.environ.get(\"GITHUB_SHA\", \"\")\nbranch_name = os.environ.get(\"GITHUB_REF_NAME\", \"\")\ntest_exit = int(os.environ.get(\"TEST_EXIT\", \"1\"))\nstatus = \"COMPLETED\" if test_exit == 0 else \"FAILED\"\npassed = test_exit == 0\npassed_tests = 1 if passed else 0\ntotal_tests = 1\nfailed_tests = 0 if passed else 1\nresults_path = os.environ.get(\"TEST_RESULTS_PATH\", \"/tmp/test_results.txt\")\ndetails = \"\"\nif os.path.exists(results_path):\n    try:\n        with open(results_path, \"r\", encoding=\"utf-8\") as handle:\n            details = handle.read()\n    except Exception as exc:\n        print(\"Webhook: failed to load test logs:\", exc)\n\nif not url or not commit_id or not branch_name:\n    print(\"Webhook: missing url/commit/branch; skipping.\")\n    sys.exit(0)\npayload = {\n    \"commit_id\": commit_id,\n    \"branch_name\": branch_name,\n    \"status\": status,\n    \"passed\": passed,\n    \"passed_tests\": passed_tests,\n    \"total_tests\": total_tests,\n    \"failed_tests\": failed_tests,\n    \"details\": details,\n}\ndata = json.dumps(payload).encode(\"utf-8\")\nreq = urllib.request.Request(\n    url, data=data,\n    headers={\"Content-Type\": \"application/json\"},\n    method=\"POST\",\n)\ntry:\n    with urllib.request.urlopen(req, timeout=10) as resp:\n        body = resp.read().decode(\"utf-8\")\n        print(\"Webhook response:\", body)\nexcept Exception as exc:\n    print(\"Webhook failed:\", exc)"; exec(textwrap.dedent(code))'
          exit "$TEST_EXIT"
