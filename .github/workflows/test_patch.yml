      INSTANCE_ID: "pydata__xarray-6599"
      REPO: "pydata/xarray"
      VERSION: "2022.03"
      BASE_COMMIT: "6bb2b855498b5c68d7cca8cceb710365d58e6048"
      ENV_SETUP_COMMIT: "d7931f9014a26e712ff5f30c4082cf0261f045d3"
      TEST_CMD: 'pytest -rA'
      TEST_FILES: 'xarray/tests/test_computation.py'
      CONDA_ENV: "testbed"
