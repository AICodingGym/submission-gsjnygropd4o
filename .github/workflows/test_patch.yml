name: SWE-bench Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-22.04
    timeout-minutes: 240
    env:
      INSTANCE_ID: "django__django-15022"
      REPO: "django/django"
      VERSION: "4.1"
      BASE_COMMIT: "e1d673c373a7d032060872b690a92fc95496612e"
      ENV_SETUP_COMMIT: "647480166bfe7532e8c471fef0146e3a17e6c0c9"
      TEST_CMD: './tests/runtests.py --verbosity 2 --settings=test_sqlite --parallel 1'
      TEST_FILES: 'tests/admin_changelist/admin.py tests/admin_changelist/tests.py'
      CONDA_ENV: "testbed"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          fetch-tags: false

      - name: Setup Miniconda
        uses: conda-incubator/setup-miniconda@v3
        with:
          auto-activate-base: false
          miniforge-variant: Miniforge3
          python-version: "3.9"

      - name: Git Safe Directory
        shell: "bash -l {0}"
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Create Conda Environment
        shell: "bash -l {0}"
        run: |
          set -euo pipefail
          source "$(conda info --base)/etc/profile.d/conda.sh"
          if [ "$ENV_SETUP_COMMIT" != "$BASE_COMMIT" ]; then
            if ! git cat-file -e "$ENV_SETUP_COMMIT^{commit}" 2>/dev/null; then
              echo "ENV_SETUP_COMMIT not found locally, fetching from upstream..."
              git fetch --depth=1 "https://github.com/$REPO.git" "$ENV_SETUP_COMMIT" || true
            fi
            if git cat-file -e "$ENV_SETUP_COMMIT^{commit}" 2>/dev/null; then
              git checkout "$ENV_SETUP_COMMIT"
            else
              echo "ENV_SETUP_COMMIT still missing; skipping checkout"
            fi
          fi
          cat <<'ENV_EOF' > /tmp/environment.yml
          name: testbed
          channels:
            - defaults
            - conda-forge
          dependencies:
            - _libgcc_mutex=0.1=main
            - _openmp_mutex=5.1=1_gnu
            - ca-certificates=2024.9.24=h06a4308_0
            - ld_impl_linux-64=2.40=h12ee557_0
            - libffi=3.4.4=h6a678d5_1
            - libgcc-ng=11.2.0=h1234567_1
            - libgomp=11.2.0=h1234567_1
            - libstdcxx-ng=11.2.0=h1234567_1
            - ncurses=6.4=h6a678d5_0
            - openssl=3.0.15=h5eee18b_0
            - pip=24.2=py39h06a4308_0
            - python=3.9.20=he870216_1
            - readline=8.2=h5eee18b_0
            - setuptools=75.1.0=py39h06a4308_0
            - sqlite=3.45.3=h5eee18b_0
            - tk=8.6.14=h39e8969_0
            - wheel=0.44.0=py39h06a4308_0
            - xz=5.4.6=h5eee18b_1
            - zlib=1.2.13=h5eee18b_1
            - pip:
                - aiohappyeyeballs==2.4.3
                - aiohttp==3.10.9
                - aiosignal==1.3.1
                - aiosmtpd==1.4.6
                - argon2-cffi==23.1.0
                - argon2-cffi-bindings==21.2.0
                - asgiref==3.8.1
                - async-timeout==4.0.3
                - atpublic==5.0
                - attrs==24.2.0
                - bcrypt==4.2.0
                - black==24.10.0
                - certifi==2024.8.30
                - cffi==1.17.1
                - charset-normalizer==3.4.0
                - click==8.1.7
                - docutils==0.21.2
                - exceptiongroup==1.2.2
                - frozenlist==1.4.1
                - geoip2==4.8.0
                - h11==0.14.0
                - idna==3.10
                - jinja2==3.1.4
                - markupsafe==3.0.1
                - maxminddb==2.6.2
                - multidict==6.1.0
                - mypy-extensions==1.0.0
                - numpy==2.0.2
                - outcome==1.3.0.post0
                - packaging==24.1
                - pathspec==0.12.1
                - pillow==10.4.0
                - platformdirs==4.3.6
                - propcache==0.2.0
                - pycparser==2.22
                - pylibmc==1.6.3
                - pymemcache==4.0.0
                - pysocks==1.7.1
                - pytz==2024.2
                - pywatchman==2.0.0
                - pyyaml==6.0.2
                - redis==5.1.1
                - requests==2.32.3
                - selenium==4.25.0
                - sniffio==1.3.1
                - sortedcontainers==2.4.0
                - sqlparse==0.5.1
                - tblib==3.0.0
                - tomli==2.0.2
                - trio==0.26.2
                - trio-websocket==0.11.1
                - typing-extensions==4.12.2
                - tzdata==2024.2
                - urllib3==2.2.3
                - websocket-client==1.8.0
                - wsproto==1.2.0
                - yarl==1.14.0
          ENV_EOF
          conda env create --file /tmp/environment.yml
          conda activate "$CONDA_ENV"
          rm /tmp/environment.yml

      - name: Checkout Trigger Commit
        shell: "bash -l {0}"
        run: |
          set -euo pipefail
          if ! git cat-file -e "$BASE_COMMIT^{commit}" 2>/dev/null; then
            git fetch --depth=1 "https://github.com/$REPO.git" "$BASE_COMMIT" || true
          fi
          if ! git cat-file -e "$GITHUB_SHA^{commit}" 2>/dev/null; then
            git fetch --depth=1 "https://github.com/$REPO.git" "$GITHUB_SHA" || true
          fi
          git checkout "$GITHUB_SHA"

      - name: Install Repo
        shell: "bash -l {0}"
        run: |
          set -euo pipefail
          source "$(conda info --base)/etc/profile.d/conda.sh"
          conda activate "$CONDA_ENV"
          git fetch --tags "https://github.com/$REPO.git" || true
          TARGET_TIMESTAMP=$(git show -s --format=%ci "$BASE_COMMIT")
          git tag -l | while read tag; do TAG_COMMIT=$(git rev-list -n 1 "$tag"); TAG_TIME=$(git show -s --format=%ci "$TAG_COMMIT"); if [[ "$TAG_TIME" > "$TARGET_TIMESTAMP" ]]; then git tag -d "$tag"; fi; done
          python -m pip install -e .

      - name: Apply Test Patch
        shell: "bash -l {0}"
        run: |
          set -euo pipefail
          git apply --verbose --reject - <<'PATCH_EOF'
          diff --git a/tests/admin_changelist/admin.py b/tests/admin_changelist/admin.py
          --- a/tests/admin_changelist/admin.py
          +++ b/tests/admin_changelist/admin.py
          @@ -36,6 +36,12 @@ class ParentAdmin(admin.ModelAdmin):
               list_select_related = ['child']
           
           
          +class ParentAdminTwoSearchFields(admin.ModelAdmin):
          +    list_filter = ['child__name']
          +    search_fields = ['child__name', 'child__age']
          +    list_select_related = ['child']
          +
          +
           class ChildAdmin(admin.ModelAdmin):
               list_display = ['name', 'parent']
               list_per_page = 10
          diff --git a/tests/admin_changelist/tests.py b/tests/admin_changelist/tests.py
          --- a/tests/admin_changelist/tests.py
          +++ b/tests/admin_changelist/tests.py
          @@ -30,8 +30,8 @@
               DynamicListDisplayLinksChildAdmin, DynamicListFilterChildAdmin,
               DynamicSearchFieldsChildAdmin, EmptyValueChildAdmin, EventAdmin,
               FilteredChildAdmin, GroupAdmin, InvitationAdmin,
          -    NoListDisplayLinksParentAdmin, ParentAdmin, QuartetAdmin, SwallowAdmin,
          -    site as custom_site,
          +    NoListDisplayLinksParentAdmin, ParentAdmin, ParentAdminTwoSearchFields,
          +    QuartetAdmin, SwallowAdmin, site as custom_site,
           )
           from .models import (
               Band, CharPK, Child, ChordsBand, ChordsMusician, Concert, CustomIdUser,
          @@ -153,6 +153,42 @@ def get_list_select_related(self, request):
                   cl = ia.get_changelist_instance(request)
                   self.assertEqual(cl.queryset.query.select_related, {'player': {}, 'band': {}})
           
          +    def test_many_search_terms(self):
          +        parent = Parent.objects.create(name='Mary')
          +        Child.objects.create(parent=parent, name='Danielle')
          +        Child.objects.create(parent=parent, name='Daniel')
          +
          +        m = ParentAdmin(Parent, custom_site)
          +        request = self.factory.get('/parent/', data={SEARCH_VAR: 'daniel ' * 80})
          +        request.user = self.superuser
          +
          +        cl = m.get_changelist_instance(request)
          +        with CaptureQueriesContext(connection) as context:
          +            object_count = cl.queryset.count()
          +        self.assertEqual(object_count, 1)
          +        self.assertEqual(context.captured_queries[0]['sql'].count('JOIN'), 1)
          +
          +    def test_related_field_multiple_search_terms(self):
          +        """
          +        Searches over multi-valued relationships return rows from related
          +        models only when all searched fields match that row.
          +        """
          +        parent = Parent.objects.create(name='Mary')
          +        Child.objects.create(parent=parent, name='Danielle', age=18)
          +        Child.objects.create(parent=parent, name='Daniel', age=19)
          +
          +        m = ParentAdminTwoSearchFields(Parent, custom_site)
          +
          +        request = self.factory.get('/parent/', data={SEARCH_VAR: 'danielle 19'})
          +        request.user = self.superuser
          +        cl = m.get_changelist_instance(request)
          +        self.assertEqual(cl.queryset.count(), 0)
          +
          +        request = self.factory.get('/parent/', data={SEARCH_VAR: 'daniel 19'})
          +        request.user = self.superuser
          +        cl = m.get_changelist_instance(request)
          +        self.assertEqual(cl.queryset.count(), 1)
          +
               def test_result_list_empty_changelist_value(self):
                   """
                   Regression test for #14982: EMPTY_CHANGELIST_VALUE should be honored
          @@ -555,7 +591,7 @@ def test_multiple_search_fields(self):
                       ('Finlayson', 1),
                       ('Finlayson Hype', 0),
                       ('Jonathan Finlayson Duo', 1),
          -            ('Mary Jonathan Duo', 1),
          +            ('Mary Jonathan Duo', 0),
                       ('Oscar Finlayson Duo', 0),
                   ):
                       with self.subTest(search_string=search_string):
          PATCH_EOF

      - name: Run Tests
        shell: "bash -l {0}"
        run: |
          set -euo pipefail
          source "$(conda info --base)/etc/profile.d/conda.sh"
          conda activate "$CONDA_ENV"
          FAIL_TO_PASS_PATH=/tmp/fail_to_pass.json
          PASS_TO_PASS_PATH=/tmp/pass_to_pass.json
          TEST_DIRECTIVES_PATH=/tmp/test_directives.json
          TEST_RESULTS_PATH=/tmp/test_results.txt
          cat <<'FAIL_EOF' > "$FAIL_TO_PASS_PATH"
          ["test_many_search_terms (admin_changelist.tests.ChangeListTests)", "All rows containing each of the searched words are returned, where each", "Searches over multi-valued relationships return rows from related"]
          FAIL_EOF
          cat <<'PASS_EOF' > "$PASS_TO_PASS_PATH"
          ["{% get_admin_log %} works if the user model's primary key isn't named", "test_missing_args (admin_changelist.tests.GetAdminLogTests)", "{% get_admin_log %} works without specifying a user.", "test_non_integer_limit (admin_changelist.tests.GetAdminLogTests)", "test_without_as (admin_changelist.tests.GetAdminLogTests)", "test_without_for_user (admin_changelist.tests.GetAdminLogTests)", "test_builtin_lookup_in_search_fields (admin_changelist.tests.ChangeListTests)", "test_changelist_search_form_validation (admin_changelist.tests.ChangeListTests)", "list_editable edits use a filtered queryset to limit memory usage.", "test_clear_all_filters_link (admin_changelist.tests.ChangeListTests)", "test_clear_all_filters_link_callable_filter (admin_changelist.tests.ChangeListTests)", "Regression test for #13196: output of functions should be  localized", "test_custom_lookup_in_search_fields (admin_changelist.tests.ChangeListTests)", "test_custom_lookup_with_pk_shortcut (admin_changelist.tests.ChangeListTests)", "test_custom_paginator (admin_changelist.tests.ChangeListTests)", "The primary key is used in the ordering of the changelist's results to", "Regression tests for #14206: dynamic list_display support.", "Regression tests for #16257: dynamic list_display_links support.", "Regression tests for ticket #17646: dynamic list_filter support.", "test_dynamic_search_fields (admin_changelist.tests.ChangeListTests)", "test_get_edited_object_ids (admin_changelist.tests.ChangeListTests)", "test_get_list_editable_queryset (admin_changelist.tests.ChangeListTests)", "test_get_list_editable_queryset_with_regex_chars_in_prefix (admin_changelist.tests.ChangeListTests)", "test_get_select_related_custom_method (admin_changelist.tests.ChangeListTests)", "Simultaneous edits of list_editable fields on the changelist by", "test_no_clear_all_filters_link (admin_changelist.tests.ChangeListTests)", "Regression test for #13902: When using a ManyToMany in list_filter,", "When using a ManyToMany in search_fields at the second level behind a", "Regressions tests for #15819: If a field listed in list_filters is a", "Regressions tests for #15819: If a field listed in search_fields", "When using a ManyToMany in list_filter at the second level behind a", "If a ManyToManyField is in list_filter but isn't in any lookup params,", "#15185 -- Allow no links from the 'change list' view grid.", "When ModelAdmin.has_add_permission() returns False, the object-tools", "Regression tests for #12893: Pagination in admins changelist doesn't", "Regression tests for ticket #15653: ensure the number of pages", "test_pk_in_search_fields (admin_changelist.tests.ChangeListTests)", "test_repr (admin_changelist.tests.ChangeListTests)", "Regression test for #14312: list_editable with pagination", "Regression tests for #11791: Inclusion tag result_list generates a", "Regression test for #14982: EMPTY_CHANGELIST_VALUE should be honored", "Inclusion tag result_list generates a table when with default", "Empty value display can be set in ModelAdmin or individual fields.", "Empty value display can be set on AdminSite.", "test_search_help_text (admin_changelist.tests.ChangeListTests)", "test_select_related_as_empty_tuple (admin_changelist.tests.ChangeListTests)", "test_select_related_as_tuple (admin_changelist.tests.ChangeListTests)", "Regression test for #10348: ChangeList.get_queryset() shouldn't", "test_select_related_preserved_when_multi_valued_in_search_fields (admin_changelist.tests.ChangeListTests)", "test_show_all (admin_changelist.tests.ChangeListTests)", "test_spanning_relations_with_custom_lookup_in_search_fields (admin_changelist.tests.ChangeListTests)", "test_specified_ordering_by_f_expression (admin_changelist.tests.ChangeListTests)", "test_specified_ordering_by_f_expression_without_asc_desc (admin_changelist.tests.ChangeListTests)", "test_total_ordering_optimization (admin_changelist.tests.ChangeListTests)", "test_total_ordering_optimization_meta_constraints (admin_change