name: SWE-bench Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-22.04
    timeout-minutes: 240
    env:
      INSTANCE_ID: "django__django-11299"
      REPO: "django/django"
      VERSION: "3.0"
      BASE_COMMIT: "6866c91b638de5368c18713fa851bfe56253ea55"
      ENV_SETUP_COMMIT: "419a78300f7cd27611196e1e464d50fd0385ff27"
      TEST_CMD: './tests/runtests.py --verbosity 2 --settings=test_sqlite --parallel 1'
      TEST_FILES: 'tests/migrations/test_operations.py tests/queries/test_query.py'
      CONDA_ENV: "testbed"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          fetch-tags: false

      - name: Setup Miniconda
        uses: conda-incubator/setup-miniconda@v3
        with:
          auto-activate-base: false
          miniforge-variant: Miniforge3
          python-version: "3.6"

      - name: Git Safe Directory
        shell: "bash -l {0}"
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Create Conda Environment
        shell: "bash -l {0}"
        run: |
          set -euo pipefail
          source "$(conda info --base)/etc/profile.d/conda.sh"
          if [ "$ENV_SETUP_COMMIT" != "$BASE_COMMIT" ]; then
            if ! git cat-file -e "$ENV_SETUP_COMMIT^{commit}" 2>/dev/null; then
              echo "ENV_SETUP_COMMIT not found locally, fetching from upstream..."
              git fetch --depth=1 "https://github.com/$REPO.git" "$ENV_SETUP_COMMIT" || true
            fi
            if git cat-file -e "$ENV_SETUP_COMMIT^{commit}" 2>/dev/null; then
              git checkout "$ENV_SETUP_COMMIT"
            else
              echo "ENV_SETUP_COMMIT still missing; skipping checkout"
            fi
          fi
          cat <<'ENV_EOF' > /tmp/environment.yml
          name: testbed
          channels:
            - defaults
            - conda-forge
          dependencies:
            - _libgcc_mutex=0.1=main
            - _openmp_mutex=5.1=1_gnu
            - ca-certificates=2024.9.24=h06a4308_0
            - certifi=2021.5.30=py36h06a4308_0
            - ld_impl_linux-64=2.40=h12ee557_0
            - libffi=3.3=he6710b0_2
            - libgcc-ng=11.2.0=h1234567_1
            - libgomp=11.2.0=h1234567_1
            - libstdcxx-ng=11.2.0=h1234567_1
            - ncurses=6.4=h6a678d5_0
            - openssl=1.1.1w=h7f8727e_0
            - pip=21.2.2=py36h06a4308_0
            - python=3.6.13=h12debd9_1
            - readline=8.2=h5eee18b_0
            - setuptools=58.0.4=py36h06a4308_0
            - sqlite=3.45.3=h5eee18b_0
            - tk=8.6.14=h39e8969_0
            - wheel=0.37.1=pyhd3eb1b0_0
            - xz=5.4.6=h5eee18b_1
            - zlib=1.2.13=h5eee18b_1
            - pip:
                - aiohttp==3.8.6
                - aiosignal==1.2.0
                - argon2-cffi==21.3.0
                - argon2-cffi-bindings==21.2.0
                - asgiref==3.4.1
                - async-timeout==4.0.2
                - asynctest==0.13.0
                - attrs==22.2.0
                - bcrypt==4.0.1
                - cffi==1.15.1
                - charset-normalizer==2.0.12
                - dataclasses==0.8
                - docutils==0.18.1
                - frozenlist==1.2.0
                - geoip2==4.6.0
                - idna==3.10
                - idna-ssl==1.1.0
                - jinja2==3.0.3
                - markupsafe==2.0.1
                - maxminddb==2.2.0
                - multidict==5.2.0
                - numpy==1.19.5
                - pillow==8.4.0
                - pycparser==2.21
                - pylibmc==1.6.3
                - python-memcached==1.62
                - pytz==2024.2
                - pywatchman==1.4.1
                - pyyaml==6.0.1
                - requests==2.27.1
                - selenium==3.141.0
                - sqlparse==0.4.4
                - tblib==1.7.0
                - typing-extensions==4.1.1
                - urllib3==1.26.20
                - yarl==1.7.2
          ENV_EOF
          conda env create --file /tmp/environment.yml
          conda activate "$CONDA_ENV"
          rm /tmp/environment.yml

      - name: Checkout Trigger Commit
        shell: "bash -l {0}"
        run: |
          set -euo pipefail
          if ! git cat-file -e "$BASE_COMMIT^{commit}" 2>/dev/null; then
            git fetch --depth=1 "https://github.com/$REPO.git" "$BASE_COMMIT" || true
          fi
          if ! git cat-file -e "$GITHUB_SHA^{commit}" 2>/dev/null; then
            git fetch --depth=1 "https://github.com/$REPO.git" "$GITHUB_SHA" || true
          fi
          git checkout "$GITHUB_SHA"

      - name: Install Repo
        shell: "bash -l {0}"
        run: |
          set -euo pipefail
          source "$(conda info --base)/etc/profile.d/conda.sh"
          conda activate "$CONDA_ENV"
          git fetch --tags "https://github.com/$REPO.git" || true
          TARGET_TIMESTAMP=$(git show -s --format=%ci "$BASE_COMMIT")
          git tag -l | while read tag; do TAG_COMMIT=$(git rev-list -n 1 "$tag"); TAG_TIME=$(git show -s --format=%ci "$TAG_COMMIT"); if [[ "$TAG_TIME" > "$TARGET_TIMESTAMP" ]]; then git tag -d "$tag"; fi; done
          python -m pip install -e .

      - name: Apply Test Patch
        shell: "bash -l {0}"
        run: |
          set -euo pipefail
          git apply --verbose --reject - <<'PATCH_EOF'
          diff --git a/tests/migrations/test_operations.py b/tests/migrations/test_operations.py
          --- a/tests/migrations/test_operations.py
          +++ b/tests/migrations/test_operations.py
          @@ -1898,6 +1898,29 @@ def test_add_constraint_percent_escaping(self):
                   author = Author.objects.create(name='Albert', rebate='10%')
                   self.assertEqual(Author.objects.get(), author)
           
          +    @skipUnlessDBFeature('supports_table_check_constraints')
          +    def test_add_or_constraint(self):
          +        app_label = 'test_addorconstraint'
          +        constraint_name = 'add_constraint_or'
          +        from_state = self.set_up_test_model(app_label)
          +        check = models.Q(pink__gt=2, weight__gt=2) | models.Q(weight__lt=0)
          +        constraint = models.CheckConstraint(check=check, name=constraint_name)
          +        operation = migrations.AddConstraint('Pony', constraint)
          +        to_state = from_state.clone()
          +        operation.state_forwards(app_label, to_state)
          +        with connection.schema_editor() as editor:
          +            operation.database_forwards(app_label, editor, from_state, to_state)
          +        Pony = to_state.apps.get_model(app_label, 'Pony')
          +        with self.assertRaises(IntegrityError), transaction.atomic():
          +            Pony.objects.create(pink=2, weight=3.0)
          +        with self.assertRaises(IntegrityError), transaction.atomic():
          +            Pony.objects.create(pink=3, weight=1.0)
          +        Pony.objects.bulk_create([
          +            Pony(pink=3, weight=-1.0),
          +            Pony(pink=1, weight=-1.0),
          +            Pony(pink=3, weight=3.0),
          +        ])
          +
               @skipUnlessDBFeature('supports_table_check_constraints')
               def test_remove_constraint(self):
                   project_state = self.set_up_test_model("test_removeconstraint", constraints=[
          diff --git a/tests/queries/test_query.py b/tests/queries/test_query.py
          --- a/tests/queries/test_query.py
          +++ b/tests/queries/test_query.py
          @@ -23,6 +23,21 @@ def test_simple_query(self):
                   self.assertEqual(lookup.rhs, 2)
                   self.assertEqual(lookup.lhs.target, Author._meta.get_field('num'))
           
          +    def test_simplecol_query(self):
          +        query = Query(Author)
          +        where = query.build_where(Q(num__gt=2, name__isnull=False) | Q(num__lt=F('id')))
          +
          +        name_isnull_lookup, num_gt_lookup = where.children[0].children
          +        self.assertIsInstance(num_gt_lookup, GreaterThan)
          +        self.assertIsInstance(num_gt_lookup.lhs, SimpleCol)
          +        self.assertIsInstance(name_isnull_lookup, IsNull)
          +        self.assertIsInstance(name_isnull_lookup.lhs, SimpleCol)
          +
          +        num_lt_lookup = where.children[1]
          +        self.assertIsInstance(num_lt_lookup, LessThan)
          +        self.assertIsInstance(num_lt_lookup.rhs, SimpleCol)
          +        self.assertIsInstance(num_lt_lookup.lhs, SimpleCol)
          +
               def test_complex_query(self):
                   query = Query(Author)
                   where = query.build_where(Q(num__gt=2) | Q(num__lt=0))
          PATCH_EOF

      - name: Run Tests
        shell: "bash -l {0}"
        run: |
          set -euo pipefail
          source "$(conda info --base)/etc/profile.d/conda.sh"
          conda activate "$CONDA_ENV"
          sed -i '/en_US.UTF-8/s/^# //g' /etc/locale.gen && locale-gen
          export LANG=en_US.UTF-8
          export LANGUAGE=en_US:en
          export LC_ALL=en_US.UTF-8
          FAIL_TO_PASS_PATH=/tmp/fail_to_pass.json
          PASS_TO_PASS_PATH=/tmp/pass_to_pass.json
          TEST_DIRECTIVES_PATH=/tmp/test_directives.json
          TEST_RESULTS_PATH=/tmp/test_results.txt
          cat <<'FAIL_EOF' > "$FAIL_TO_PASS_PATH"
          ["test_simplecol_query (queries.test_query.TestQuery)"]
          FAIL_EOF
          cat <<'PASS_EOF' > "$PASS_TO_PASS_PATH"
          ["test_reference_field_by_through_fields (migrations.test_operations.FieldOperationTests)", "test_references_field_by_from_fields (migrations.test_operations.FieldOperationTests)", "test_references_field_by_name (migrations.test_operations.FieldOperationTests)", "test_references_field_by_remote_field_model (migrations.test_operations.FieldOperationTests)", "test_references_field_by_through (migrations.test_operations.FieldOperationTests)", "test_references_field_by_to_fields (migrations.test_operations.FieldOperationTests)", "test_references_model (migrations.test_operations.FieldOperationTests)", "test_references_model_mixin (migrations.test_operations.TestCreateModel)", "test_complex_query (queries.test_query.TestQuery)", "test_foreign_key (queries.test_query.TestQuery)", "test_foreign_key_exclusive (queries.test_query.TestQuery)", "test_foreign_key_f (queries.test_query.TestQuery)", "test_multiple_fields (queries.test_query.TestQuery)", "test_negated_nullable (queries.test_query.TestQuery)", "test_simple_query (queries.test_query.TestQuery)", "test_add_field_ignore_swapped (migrations.test_operations.SwappableOperationTests)", "test_create_ignore_swapped (migrations.test_operations.SwappableOperationTests)", "test_delete_ignore_swapped (migrations.test_operations.SwappableOperationTests)", "test_indexes_ignore_swapped (migrations.test_operations.SwappableOperationTests)", "test_add_binaryfield (migrations.test_operations.OperationTests)", "test_add_charfield (migrations.test_operations.OperationTests)", "test_add_constraint (migrations.test_operations.OperationTests)", "test_add_constraint_percent_escaping (migrations.test_operations.OperationTests)", "test_add_field (migrations.test_operations.OperationTests)", "test_add_field_m2m (migrations.test_operations.OperationTests)", "test_add_field_preserve_default (migrations.test_operations.OperationTests)", "test_add_index (migrations.test_operations.OperationTests)", "test_add_index_state_forwards (migrat