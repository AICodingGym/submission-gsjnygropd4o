          +                               (False, True, False)],
          +                         dtype=dtype)
          +    assert np.all(t['a']['z'].mask == [False, False])
          +    assert np.all(t['a']['x'].mask == [False, True])
          +    assert np.all(t['a']['y'].mask == [True, False])
          +    assert isinstance(t['a'], MaskedColumn)
