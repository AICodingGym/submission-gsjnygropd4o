name: SWE-bench Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-22.04
    timeout-minutes: 240
    env:
      INSTANCE_ID: "django__django-16493"
      REPO: "django/django"
      VERSION: "5.0"
      BASE_COMMIT: "e3a4cee081cf60650b8824f0646383b79cb110e7"
      ENV_SETUP_COMMIT: "4a72da71001f154ea60906a2f74898d32b7322a7"
      TEST_CMD: './tests/runtests.py --verbosity 2 --settings=test_sqlite --parallel 1'
      TEST_FILES: 'tests/file_storage/models.py tests/file_storage/tests.py'
      CONDA_ENV: "testbed"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          fetch-tags: false

      - name: Setup Miniconda
        uses: conda-incubator/setup-miniconda@v3
        with:
          auto-activate-base: false
          miniforge-variant: Miniforge3
          python-version: "3.11"

      - name: Git Safe Directory
        shell: "bash -l {0}"
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Create Conda Environment
        shell: "bash -l {0}"
        run: |
          set -euo pipefail
          source "$(conda info --base)/etc/profile.d/conda.sh"
          if [ "$ENV_SETUP_COMMIT" != "$BASE_COMMIT" ]; then
            if ! git cat-file -e "$ENV_SETUP_COMMIT^{commit}" 2>/dev/null; then
              echo "ENV_SETUP_COMMIT not found locally, fetching from upstream..."
              git fetch --depth=1 "https://github.com/$REPO.git" "$ENV_SETUP_COMMIT" || true
            fi
            if git cat-file -e "$ENV_SETUP_COMMIT^{commit}" 2>/dev/null; then
              git checkout "$ENV_SETUP_COMMIT"
            else
              echo "ENV_SETUP_COMMIT still missing; skipping checkout"
            fi
          fi
          cat <<'ENV_EOF' > /tmp/environment.yml
          name: testbed
          channels:
            - defaults
            - conda-forge
          dependencies:
            - _libgcc_mutex=0.1=main
            - _openmp_mutex=5.1=1_gnu
            - bzip2=1.0.8=h5eee18b_6
            - ca-certificates=2024.9.24=h06a4308_0
            - ld_impl_linux-64=2.40=h12ee557_0
            - libffi=3.4.4=h6a678d5_1
            - libgcc-ng=11.2.0=h1234567_1
            - libgomp=11.2.0=h1234567_1
            - libstdcxx-ng=11.2.0=h1234567_1
            - libuuid=1.41.5=h5eee18b_0
            - ncurses=6.4=h6a678d5_0
            - openssl=3.0.15=h5eee18b_0
            - pip=24.2=py311h06a4308_0
            - python=3.11.10=he870216_0
            - readline=8.2=h5eee18b_0
            - setuptools=75.1.0=py311h06a4308_0
            - sqlite=3.45.3=h5eee18b_0
            - tk=8.6.14=h39e8969_0
            - wheel=0.44.0=py311h06a4308_0
            - xz=5.4.6=h5eee18b_1
            - zlib=1.2.13=h5eee18b_1
            - pip:
                - aiohappyeyeballs==2.4.3
                - aiohttp==3.10.9
                - aiosignal==1.3.1
                - aiosmtpd==1.4.6
                - argon2-cffi==23.1.0
                - argon2-cffi-bindings==21.2.0
                - asgiref==3.8.1
                - atpublic==5.0
                - attrs==24.2.0
                - bcrypt==4.2.0
                - black==24.10.0
                - certifi==2024.8.30
                - cffi==1.17.1
                - charset-normalizer==3.4.0
                - click==8.1.7
                - docutils==0.21.2
                - frozenlist==1.4.1
                - geoip2==4.8.0
                - h11==0.14.0
                - idna==3.10
                - jinja2==3.1.4
                - markupsafe==3.0.1
                - maxminddb==2.6.2
                - multidict==6.1.0
                - mypy-extensions==1.0.0
                - numpy==2.1.2
                - outcome==1.3.0.post0
                - packaging==24.1
                - pathspec==0.12.1
                - pillow==10.4.0
                - platformdirs==4.3.6
                - propcache==0.2.0
                - pycparser==2.22
                - pylibmc==1.6.3
                - pymemcache==4.0.0
                - pysocks==1.7.1
                - pywatchman==2.0.0
                - pyyaml==6.0.2
                - redis==5.1.1
                - requests==2.32.3
                - selenium==4.25.0
                - sniffio==1.3.1
                - sortedcontainers==2.4.0
                - sqlparse==0.5.1
                - tblib==3.0.0
                - trio==0.26.2
                - trio-websocket==0.11.1
                - typing-extensions==4.12.2
                - tzdata==2024.2
                - urllib3==2.2.3
                - websocket-client==1.8.0
                - wsproto==1.2.0
                - yarl==1.14.0
          ENV_EOF
          conda env create --file /tmp/environment.yml
          conda activate "$CONDA_ENV"
          rm /tmp/environment.yml

      - name: Checkout Trigger Commit
        shell: "bash -l {0}"
        run: |
          set -euo pipefail
          if ! git cat-file -e "$BASE_COMMIT^{commit}" 2>/dev/null; then
            git fetch --depth=1 "https://github.com/$REPO.git" "$BASE_COMMIT" || true
          fi
          if ! git cat-file -e "$GITHUB_SHA^{commit}" 2>/dev/null; then
            git fetch --depth=1 "https://github.com/$REPO.git" "$GITHUB_SHA" || true
          fi
          git checkout "$GITHUB_SHA"

      - name: Install Repo
        shell: "bash -l {0}"
        run: |
          set -euo pipefail
          source "$(conda info --base)/etc/profile.d/conda.sh"
          conda activate "$CONDA_ENV"
          git fetch --tags "https://github.com/$REPO.git" || true
          TARGET_TIMESTAMP=$(git show -s --format=%ci "$BASE_COMMIT")
          git tag -l | while read tag; do TAG_COMMIT=$(git rev-list -n 1 "$tag"); TAG_TIME=$(git show -s --format=%ci "$TAG_COMMIT"); if [[ "$TAG_TIME" > "$TARGET_TIMESTAMP" ]]; then git tag -d "$tag"; fi; done
          python -m pip install -e .

      - name: Apply Test Patch
        shell: "bash -l {0}"
        run: |
          set -euo pipefail
          git apply --verbose --reject - <<'PATCH_EOF'
          diff --git a/tests/file_storage/models.py b/tests/file_storage/models.py
          --- a/tests/file_storage/models.py
          +++ b/tests/file_storage/models.py
          @@ -9,7 +9,7 @@
           import tempfile
           from pathlib import Path
           
          -from django.core.files.storage import FileSystemStorage
          +from django.core.files.storage import FileSystemStorage, default_storage
           from django.db import models
           
           
          @@ -27,6 +27,10 @@ def callable_storage():
               return temp_storage
           
           
          +def callable_default_storage():
          +    return default_storage
          +
          +
           class CallableStorage(FileSystemStorage):
               def __call__(self):
                   # no-op implementation.
          @@ -62,6 +66,9 @@ def pathlib_upload_to(self, filename):
               storage_callable_class = models.FileField(
                   storage=CallableStorage, upload_to="storage_callable_class"
               )
          +    storage_callable_default = models.FileField(
          +        storage=callable_default_storage, upload_to="storage_callable_default"
          +    )
               default = models.FileField(
                   storage=temp_storage, upload_to="tests", default="tests/default.txt"
               )
          diff --git a/tests/file_storage/tests.py b/tests/file_storage/tests.py
          --- a/tests/file_storage/tests.py
          +++ b/tests/file_storage/tests.py
          @@ -41,7 +41,13 @@
           from django.utils._os import symlinks_supported
           from django.utils.deprecation import RemovedInDjango51Warning
           
          -from .models import Storage, callable_storage, temp_storage, temp_storage_location
          +from .models import (
          +    Storage,
          +    callable_default_storage,
          +    callable_storage,
          +    temp_storage,
          +    temp_storage_location,
          +)
           
           FILE_SUFFIX_REGEX = "[A-Za-z0-9]{7}"
           
          @@ -1018,6 +1024,15 @@ def test_deconstruction(self):
                   storage = kwargs["storage"]
                   self.assertIs(storage, callable_storage)
           
          +    def test_deconstruction_storage_callable_default(self):
          +        """
          +        A callable that returns default_storage is not omitted when
          +        deconstructing.
          +        """
          +        obj = Storage()
          +        *_, kwargs = obj._meta.get_field("storage_callable_default").deconstruct()
          +        self.assertIs(kwargs["storage"], callable_default_storage)
          +
           
           # Tests for a race condition on file saving (#4948).
           # This is written in such a way that it'll always pass on platforms
          PATCH_EOF

      - name: Run Tests
        shell: "bash -l {0}"
        run: |
          set -euo pipefail
          source "$(conda info --base)/etc/profile.d/conda.sh"
          conda activate "$CONDA_ENV"
          FAIL_TO_PASS_PATH=/tmp/fail_to_pass.json
          PASS_TO_PASS_PATH=/tmp/pass_to_pass.json
          TEST_DIRECTIVES_PATH=/tmp/test_directives.json
          TEST_RESULTS_PATH=/tmp/test_results.txt
          cat <<'FAIL_EOF' > "$FAIL_TO_PASS_PATH"
          [
            "A callable that returns default_storage is not omitted when"
          ]
          FAIL_EOF
          cat <<'PASS_EOF' > "$PASS_TO_PASS_PATH"
          [
            "test_deconstruction (file_storage.tests.FileSystemStorageTests.test_deconstruction)",
            "FileSystemStorage.__init__() shouldn't evaluate base_url.",
            "test_deprecation_warning (file_storage.tests.GetStorageClassTests.test_deprecation_warning)",
            "get_storage_class returns the class for a storage backend name/path.",
