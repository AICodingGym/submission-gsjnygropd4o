name: SWE-bench Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-22.04
    timeout-minutes: 240
    env:
      INSTANCE_ID: "scikit-learn__scikit-learn-12682"
      REPO: "scikit-learn/scikit-learn"
      VERSION: "0.22"
      BASE_COMMIT: "d360ffa7c5896a91ae498b3fb9cf464464ce8f34"
      ENV_SETUP_COMMIT: "7e85a6d1f038bbb932b36f18d75df6be937ed00d"
      TEST_CMD: 'pytest -rA'
      TEST_FILES: 'sklearn/decomposition/tests/test_dict_learning.py'
      CONDA_ENV: "testbed"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          fetch-tags: false

      - name: Setup Miniconda
        uses: conda-incubator/setup-miniconda@v3
        with:
          auto-activate-base: false
          miniforge-variant: Miniforge3
          python-version: "3.6"

      - name: Git Safe Directory
        shell: "bash -l {0}"
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Create Conda Environment
        shell: "bash -l {0}"
        run: |
          set -euo pipefail
          source "$(conda info --base)/etc/profile.d/conda.sh"
          if [ "$ENV_SETUP_COMMIT" != "$BASE_COMMIT" ]; then
            if ! git cat-file -e "$ENV_SETUP_COMMIT^{commit}" 2>/dev/null; then
              echo "ENV_SETUP_COMMIT not found locally, fetching from upstream..."
              git fetch --depth=1 "https://github.com/$REPO.git" "$ENV_SETUP_COMMIT" || true
            fi
            if git cat-file -e "$ENV_SETUP_COMMIT^{commit}" 2>/dev/null; then
              git checkout "$ENV_SETUP_COMMIT"
            else
              echo "ENV_SETUP_COMMIT still missing; skipping checkout"
            fi
          fi
          cat <<'ENV_EOF' > /tmp/environment.yml
          name: testbed
          channels:
            - defaults
            - conda-forge
          dependencies:
            - _libgcc_mutex=0.1=main
            - _openmp_mutex=5.1=1_gnu
            - attrs=21.4.0=pyhd3eb1b0_0
            - blas=1.0=openblas
            - ca-certificates=2024.9.24=h06a4308_0
            - certifi=2021.5.30=py36h06a4308_0
            - cycler=0.11.0=pyhd3eb1b0_0
            - cython=0.29.24=py36h295c915_0
            - dbus=1.13.18=hb2f20db_0
            - expat=2.6.3=h6a678d5_0
            - fontconfig=2.14.1=h52c9d5c_1
            - freetype=2.12.1=h4a9f257_0
            - giflib=5.2.1=h5eee18b_3
            - glib=2.69.1=h4ff587b_1
            - gst-plugins-base=1.14.1=h6a678d5_1
            - gstreamer=1.14.1=h5eee18b_1
            - icu=58.2=he6710b0_3
            - importlib-metadata=4.8.1=py36h06a4308_0
            - importlib_metadata=4.8.1=hd3eb1b0_0
            - iniconfig=1.1.1=pyhd3eb1b0_0
            - jpeg=9e=h5eee18b_3
            - kiwisolver=1.3.1=py36h2531618_0
            - lcms2=2.12=h3be6417_0
            - ld_impl_linux-64=2.40=h12ee557_0
            - lerc=3.0=h295c915_0
            - libdeflate=1.17=h5eee18b_1
            - libffi=3.3=he6710b0_2
            - libgcc-ng=11.2.0=h1234567_1
            - libgfortran-ng=7.5.0=ha8ba4b0_17
            - libgfortran4=7.5.0=ha8ba4b0_17
            - libgomp=11.2.0=h1234567_1
            - libopenblas=0.3.18=hf726d26_0
            - libpng=1.6.39=h5eee18b_0
            - libstdcxx-ng=11.2.0=h1234567_1
            - libtiff=4.5.1=h6a678d5_0
            - libuuid=1.41.5=h5eee18b_0
            - libwebp=1.2.4=h11a3e52_1
            - libwebp-base=1.2.4=h5eee18b_1
            - libxcb=1.15=h7f8727e_0
            - libxml2=2.9.14=h74e7548_0
            - lz4-c=1.9.4=h6a678d5_1
            - matplotlib=3.3.4=py36h06a4308_0
            - matplotlib-base=3.3.4=py36h62a2d02_0
            - more-itertools=8.12.0=pyhd3eb1b0_0
            - ncurses=6.4=h6a678d5_0
            - numpy=1.19.2=py36h6163131_0
            - numpy-base=1.19.2=py36h75fe3a5_0
            - olefile=0.46=pyhd3eb1b0_0
            - openssl=1.1.1w=h7f8727e_0
            - packaging=21.3=pyhd3eb1b0_0
            - pandas=1.1.5=py36ha9443f7_0
            - pcre=8.45=h295c915_0
            - pillow=8.3.1=py36h5aabda8_0
            - pip=21.2.2=py36h06a4308_0
            - pluggy=0.13.1=py36h06a4308_0
            - py=1.11.0=pyhd3eb1b0_0
            - pyparsing=3.0.4=pyhd3eb1b0_0
            - pyqt=5.9.2=py36h05f1152_2
            - pytest=6.2.4=py36h06a4308_2
            - python=3.6.13=h12debd9_1
            - python-dateutil=2.8.2=pyhd3eb1b0_0
            - pytz=2021.3=pyhd3eb1b0_0
            - qt=5.9.7=h5867ecd_1
            - readline=8.2=h5eee18b_0
            - scipy=1.5.2=py36habc2bb6_0
            - setuptools=58.0.4=py36h06a4308_0
            - sip=4.19.8=py36hf484d3e_0
            - six=1.16.0=pyhd3eb1b0_1
            - sqlite=3.45.3=h5eee18b_0
            - tk=8.6.14=h39e8969_0
            - toml=0.10.2=pyhd3eb1b0_0
            - tornado=6.1=py36h27cfd23_0
            - typing_extensions=4.1.1=pyh06a4308_0
            - wheel=0.37.1=pyhd3eb1b0_0
            - xz=5.4.6=h5eee18b_1
            - zipp=3.6.0=pyhd3eb1b0_0
            - zlib=1.2.13=h5eee18b_1
            - zstd=1.5.6=hc292b87_0
            - pip:
                - joblib==1.1.1
          ENV_EOF
          conda env create --file /tmp/environment.yml
          conda activate "$CONDA_ENV"
          rm /tmp/environment.yml
          python -m pip install cython numpy==1.19.2 setuptools scipy==1.5.2

      - name: Checkout Trigger Commit
        shell: "bash -l {0}"
        run: |
          set -euo pipefail
          if ! git cat-file -e "$BASE_COMMIT^{commit}" 2>/dev/null; then
            git fetch --depth=1 "https://github.com/$REPO.git" "$BASE_COMMIT" || true
          fi
          if ! git cat-file -e "$GITHUB_SHA^{commit}" 2>/dev/null; then
            git fetch --depth=1 "https://github.com/$REPO.git" "$GITHUB_SHA" || true
          fi
          git checkout "$GITHUB_SHA"

      - name: Install Repo
        shell: "bash -l {0}"
        run: |
          set -euo pipefail
          source "$(conda info --base)/etc/profile.d/conda.sh"
          conda activate "$CONDA_ENV"
          git fetch --tags "https://github.com/$REPO.git" || true
          TARGET_TIMESTAMP=$(git show -s --format=%ci "$BASE_COMMIT")
          git tag -l | while read tag; do TAG_COMMIT=$(git rev-list -n 1 "$tag"); TAG_TIME=$(git show -s --format=%ci "$TAG_COMMIT"); if [[ "$TAG_TIME" > "$TARGET_TIMESTAMP" ]]; then git tag -d "$tag"; fi; done
          python -m pip install -v --no-use-pep517 --no-build-isolation -e .

      - name: Apply Test Patch
        shell: "bash -l {0}"
        run: |
          set -euo pipefail
          git apply --verbose --reject - <<'PATCH_EOF'
          diff --git a/sklearn/decomposition/tests/test_dict_learning.py b/sklearn/decomposition/tests/test_dict_learning.py
          --- a/sklearn/decomposition/tests/test_dict_learning.py
          +++ b/sklearn/decomposition/tests/test_dict_learning.py
          @@ -57,6 +57,54 @@ def test_dict_learning_overcomplete():
               assert dico.components_.shape == (n_components, n_features)
           
           
          +def test_max_iter():
          +    def ricker_function(resolution, center, width):
          +        """Discrete sub-sampled Ricker (Mexican hat) wavelet"""
          +        x = np.linspace(0, resolution - 1, resolution)
          +        x = ((2 / (np.sqrt(3 * width) * np.pi ** .25))
          +             * (1 - (x - center) ** 2 / width ** 2)
          +             * np.exp(-(x - center) ** 2 / (2 * width ** 2)))
          +        return x
          +
          +    def ricker_matrix(width, resolution, n_components):
          +        """Dictionary of Ricker (Mexican hat) wavelets"""
          +        centers = np.linspace(0, resolution - 1, n_components)
          +        D = np.empty((n_components, resolution))
          +        for i, center in enumerate(centers):
          +            D[i] = ricker_function(resolution, center, width)
          +        D /= np.sqrt(np.sum(D ** 2, axis=1))[:, np.newaxis]
          +        return D
          +
          +    transform_algorithm = 'lasso_cd'
          +    resolution = 1024
          +    subsampling = 3  # subsampling factor
          +    n_components = resolution // subsampling
          +
          +    # Compute a wavelet dictionary
          +    D_multi = np.r_[tuple(ricker_matrix(width=w, resolution=resolution,
          +                          n_components=n_components // 5)
          +                          for w in (10, 50, 100, 500, 1000))]
          +
          +    X = np.linspace(0, resolution - 1, resolution)
          +    first_quarter = X < resolution / 4
          +    X[first_quarter] = 3.
          +    X[np.logical_not(first_quarter)] = -1.
          +    X = X.reshape(1, -1)
          +
          +    # check that the underlying model fails to converge
          +    with pytest.warns(ConvergenceWarning):
          +        model = SparseCoder(D_multi, transform_algorithm=transform_algorithm,
          +                            transform_max_iter=1)
          +        model.fit_transform(X)
          +
          +    # check that the underlying model converges w/o warnings
          +    with pytest.warns(None) as record:
          +        model = SparseCoder(D_multi, transform_algorithm=transform_algorithm,
          +                            transform_max_iter=2000)
          +        model.fit_transform(X)
          +    assert not record.list
          +
          +
           def test_dict_learning_lars_positive_parameter():
               n_components = 5
               alpha = 1
          PATCH_EOF

      - name: Run Tests
        shell: "bash -l {0}"
        run: |
          set -euo pipefail
          source "$(conda info --base)/etc/profile.d/conda.sh"
          conda activate "$CONDA_ENV"
          FAIL_TO_PASS_PATH=/tmp/fail_to_pass.json
          PASS_TO_PASS_PATH=/tmp/pass_to_pass.json
          TEST_DIRECTIVES_PATH=/tmp/test_directives.json
          TEST_RESULTS_PATH=/tmp/test_results.txt
          cat <<'FAIL_EOF' > "$FAIL_TO_PASS_PATH"
          ["sklearn/decomposition/tests/test_dict_learning.py::test_max_iter"]
          FAIL_EOF
          cat <<'PASS_EOF' > "$PASS_TO_PASS_PATH"
          ["sklearn/decomposition/tests/test_dict_learning.py::test_sparse_encode_shapes_omp", "sklearn/decomposition/tests/test_dict_learning.py::test_dict_learning_shapes", "sklearn/decomposition/tests/test_dict_learning.py::test_dict_learning_overcomplete", "sklearn/decomposition/tests/test_dict_learning.py::test_dict_learning_lars_positive_parameter", "sklearn/decomposition/tests/test_dict_learning.py::test_dict_learning_positivity[False-False-lasso_lars]", "sklearn/decomposition/tests/test_dict_learning.py::test_dict_learning_positivity[False-False-lasso_cd]", "sklearn/decomposition/tests/test_dict_learning.py::test_dict_learning_positivity[False-False-threshold]", "sklearn/decomposition/tests/test_dict_learning.py::test_dict_learning_positivity[False-True-lasso_lars]", "sklearn/decomposition/tests/test_dict_learning.py::test_dict_learning_positivity[False-True-lasso_cd]", "sklearn/decomposition/tests/test_dict_learning.py::test_dict_learning_positivity[False-True-threshold]", "sklearn/decomposition/tests/test_dict_learning.py::test_dict_learning_positivity[True-False-lasso_lars]", "sklearn/decomposition/tests/test_dict_learning.py::test_dict_learning_positivity[True-False-lasso_cd]", "sklearn/decomposition/tests/test_dict_learning.py::test_dict_learning_positivity[True-False-threshold]", "sklearn/decomposition/tests/test_dict_learning.py::test_dict_learning_positivity[True-True-lasso_lars]", "sklearn/decomposition/tests/test_dict_learning.py::test_dict_learning_positivity[True-True-lasso_cd]", "sklearn/decomposition/tests/test_dict_learning.py::test_dict_learning_positivity[True-True-threshold]", "sklearn/decomposition/tests/test_dict_learning.py::test_dict_learning_lars_dict_positivity[False]", "sklearn/decomposition/tests/test_dict_learning.py::test_dict_learning_lars_dict_positivity[True]", "sklearn/decomposition/tests/test_dict_learning.py::test_dict_learning_lars_code_positivity", "sklearn/decomposition/tests/test_dict_learning.py::test_dict_learning_reconstruction", "sklearn/decomposition/tests/test_dict_learning.py::test_dict_learning_reconstruction_parallel", "sklearn/decomposition/tests/test_dict_learning.py::test_dict_learning_lassocd_readonly_data", "sklearn/decomposition/tests/test_dict_learning.py::test_dict_learning_nonzero_coefs", "sklearn/decomposition/tests/test_dict_learning.py::test_dict_learning_unknown_fit_algorithm", "sklearn/decomposition/tests/test_dict_learning.py::test_dict_learning_split", "sklearn/decomposition/tests/test_dict_learning.py::test_dict_learning_online_shapes", "sklearn/decomposition/tests/test_dict_learning.py::test_dict_learning_online_lars_positive_parameter", "sklearn/decomposition/tests/test_dict_learning.py::test_minibatch_dictionary_learning_positivity[False-False-lasso_lars]", "sklearn/decomposition/tests/test_dict_learning.py::test_minibatch_dictionary_learning_positivity[False-False-lasso_cd]", "sklearn/decomposition/tests/test_dict_learning.py::test_minibatch_dictionary_learning_positivity[False-False-threshold]", "sklearn/decomposition/tests/test_dict_learning.py::test_minibatch_dictionary_learning_positivity[False-True-lasso_lars]", "sklearn/decomposition/tests/test_dict_learning.py::test_minibatch_dictionary_learning_positivity[False-True-lasso_cd]", "sklearn/decomposition/tests/test_dict_learning.py::test_minibatch_dictionary_learning_positivity[False-True-threshold]", "sklearn/decomposition/tests/test_dict_learning.py::test_minibatch_dictionary_learning_positivity[True-False-lasso_lars]", "sklearn/decomposition/tests/test_dict_learning.py::test_minibatch_dictionary_learning_positivity[True-False-lasso_cd]", "sklearn/decomposition/tests/test_dict_learning.py::test_minibatch_dictionary_learning_positivity[True-False-threshold]", "sklearn/decomposition/tests/test_dict_learning.py::test_minibatch_dictionary_learning_positivity[True-True-lasso_lars]", "sklearn/decomposition/tests/test_dict_learning.py::test_minibatch_dictionary_learning_positivity[True-True-lasso_cd]", "sklearn/decomposition/tests/test_dict_learning.py::test_minibatch_dictionary_learning_positivity[True-True-threshold]", "sklearn/decomposition/tests/test_dict_learning.py::test_minibatch_dictionary_learning_lars[False]", "sklearn/decomposition/tests/test_dict_learning.py::test_minibatch_dictionary_learning_lars[True]", "sklearn/decomposition/tests/test_dict_learning.py::test_dict_learning_online_positivity[False-False]", "sklearn/decomposition/tests/test_dict_learning.py::test_dict_learning_online_positivity[False-True]", "sklearn/decomposition/tests/test_dict_learning.py::test_dict_learning_online_positivity[True-False]", "sklearn/decomposition/tests/test_dict_learning.py::test_dict_learning_online_positivity[True-True]", "sklearn/decomposition/tests/test_dict_learning.py::test_dict_learning_online_verbosity", "sklearn/decomposition/tests/test_dict_learning.py::test_dict_learning_online_estimator_shapes", "sklearn/decomposition/tests/test_dict_learning.py::test_dict_learning_online_overcomplete", "sklearn/decomposition/tests/test_dict_learning.py::test_dict_learning_online_initialization", "sklearn/decomposition/tests/test_dict_learning.py::test_dict_learning_online_readonly_initialization", "sklearn/decomposition/tests/test_dict_learning.py::test_dict_learning_online_partial_fit", "sklearn/decomposition/tests/test_dict_learning.py::test_sparse_encode_shapes", "sklearn/decomposition/tests/test_dict_learning.py::test_sparse_encode_positivity[False-lasso_lars]", "sklearn/decomposition/tests/test_dict_learning.py::test_sparse_encode_positivity[False-lasso_cd]", "sklearn/decomposition/tests/test_dict_learning.py::test_sparse_encode_positivity[False-threshold]", "sklearn/decomposition/tests/test_dict_learning.py::test_sparse_encode_positivity[True-lasso_lars]", "sklearn/decomposition/tests/test_dict_learning.py::test_sparse_encode_positivity[True-lasso_cd]", "sklearn/decomposition/tests/test_dict_learning.py::test_sparse_encode_positivity[True-threshold]", "sklearn/decomposition/tests/test_dict_learning.py::test_sparse_encode_unavailable_positivity[lars]", "sklearn/decomposition/tests/test_dict_learning.py::test_sparse_encode_unavailable_positivity[omp]", "sklearn/decomposition/tests/test_dict_learning.py::test_sparse_encode_input", "sklearn/decomposition/tests/test_dict_learning.py::test_sparse_encode_error", "sklearn/decomposition/tests/test_dict_learning.py::test_sparse_encode_error_default_sparsity", "sklearn/decomposition/tests/test_dict_learning.py::test_unknown_method", "sklearn/decomposition/tests/test_dict_learning.py::test_sparse_coder_estimator", "sklearn/decomposition/tests/test_dict_learning.py::test_sparse_coder_parallel_mmap"]
          PASS_EOF
          cat <<'DIR_EOF' > "$TEST_DIRECTIVES_PATH"
          ["sklearn/decomposition/tests/test_dict_learning.py"]
          DIR_EOF
          export FAIL_TO_PASS_PATH PASS_TO_PASS_PATH TEST_DIRECTIVES_PATH TEST_RESULTS_PATH
          set +e
          python -c 'import textwrap; code = "import json\nimport os\nimport re\nimport shlex\nimport subprocess\nimport sys\n\ndef _load(key):\n    path = os.environ.get(\"{}_PATH\".format(key))\n    if path and os.path.exists(path):\n        with open(path, \"r\", encoding=\"utf-8\") as handle:\n            raw = handle.read()\n    else:\n        raw = os.environ.get(key, \"[]\")\n    try:\n        return json.loads(raw)\n    except Exception:\n        return []\n\ntest_cmd = os.environ[\"TEST_CMD\"]\nresults_path = os.environ.get(\"TEST_RESULTS_PATH\", \"/tmp/test_results.txt\")\nlog_parts = []\n\ndef log(message):\n    print(message, flush=True)\n    log_parts.append(message + \"\\n\")\n\ndef run_tests(label, tests):\n    if not tests:\n        print(\"No tests for {}\".format(label))\n        return True\n    cmd = \" \".join([test_cmd] + [shlex.quote(t) for t in tests])\n    print(\"Running {}: {}\".format(label, cmd), flush=True)\n    result = subprocess.run(\n        cmd,\n        shell=True,\n        stdout=subprocess.PIPE,\n        stderr=subprocess.PIPE,\n        universal_newlines=True,\n    )\n    stdout = result.stdout or \"\"\n    stderr = result.stderr or \"\"\n    if stdout:\n        print(stdout, end=\"\" if stdout.endswith(\"\\n\") else \"\\n\")\n    if stderr:\n        print(stderr, end=\"\" if stderr.endswith(\"\\n\") else \"\\n\", file=sys.stderr)\n    if stdout:\n        log_parts.append(stdout)\n    if stderr:\n        log_parts.append(stderr)\n    return result.returncode == 0\n\ndef _as_list(value):\n    if isinstance(value, list):\n        return value\n    if isinstance(value, str):\n        return [value]\n    return []\n\ndef _has_unbalanced_brackets(value):\n    depth = 0\n    escaped = False\n    for ch in value:\n        if escaped:\n            escaped = False\n            continue\n        if ch == \"\\\\\":\n            escaped = True\n            continue\n        if ch == \"[\":\n            depth += 1\n        elif ch == \"]\":\n            depth -= 1\n            if depth < 0:\n                return True\n    return depth != 0\n\ndef _has_space_outside_brackets(value):\n    depth = 0\n    for ch in value:\n        if ch == \"[\":\n            depth += 1\n        elif ch == \"]\":\n            depth = max(depth - 1, 0)\n        elif ch.isspace() and depth == 0:\n            return True\n    return False\n\ndef _looks_like_test_id(value):\n    return any(x in value for x in (\"::\", \"/\", \".py\"))\n\ndef _merge_bracket_fragments(labels):\n    merged = []\n    buffer = None\n    for raw in labels:\n        if not isinstance(raw, str):\n            continue\n        value = raw.strip()\n        if not value:\n            continue\n        if buffer is not None:\n            if _looks_like_test_id(value):\n                log(\"Deferring bracket-fragmented test for repair: {}\".format(repr(buffer)))\n                merged.append(buffer)\n                buffer = None\n                # Treat current value as a new candidate.\n            else:\n                buffer = buffer + \" \" + value\n                if not _has_unbalanced_brackets(buffer):\n                    merged.append(buffer)\n                    buffer = None\n                continue\n        if _has_unbalanced_brackets(value):\n            buffer = value\n            continue\n        merged.append(value)\n    if buffer is not None:\n        log(\"Deferring bracket-fragmented test for repair: {}\".format(repr(buffer)))\n        merged.append(buffer)\n    return merged\n\ndef normalize_labels(labels):\n    labels = _as_list(labels)\n    normalized = []\n    for label in labels:\n        if not isinstance(label, str):\n            continue\n        value = label.strip()\n        if not value:\n            continue\n        m = re.match(r\"^([^\\s]+)\\s+\\(([^)]+)\\)$\", value)\n        if m:\n            test_name, path = m.group(1), m.group(2).strip()\n            if re.search(r\"[\\\\/]\", path) or path.endswith(\".py\"):\n                normalized.append(\"{}::{}\".format(path, test_name))\n            else:\n                normalized.append(\"{}.{}\".format(path, test_name))\n        else:\n            normalized.append(value)\n    return normalized\n\ndef prefilter_tests(label, tests):\n    tests = _merge_bracket_fragments(_as_list(tests))\n    valid = []\n    skipped = []\n    for test in tests:\n        if not isinstance(test, str):\n            continue\n        value = test.strip()\n        if not value:\n            continue\n        if _has_unbalanced_brackets(value):\n            repaired = value + \"]\"\n            if not _has_unbalanced_brackets(repaired) and not _has_space_outside_brackets(repaired):\n                log(\"Repairing unbalanced brackets for {}: {} -> {}\".format(label, repr(value), repr(repaired)))\n                value = repaired\n            else:\n                fallback = value.split(\"[\", 1)[0].strip() if \"[\" in value else \"\"\n                if fallback and not _has_space_outside_brackets(fallback):\n                    log(\"Falling back to parent test for {}: {} -> {}\".format(label, repr(value), repr(fallback)))\n                    value = fallback\n                else:\n                    skipped.append(value)\n                    continue\n        if _has_space_outside_brackets(value):\n            skipped.append(value)\n            continue\n        valid.append(value)\n    if skipped:\n        skipped_str = \", \".join(repr(x) for x in skipped)\n        log(\"Skipping {} non-test entries: {}\".format(label, skipped_str))\n    return valid\n\ndef looks_qualified(labels):\n    return any(isinstance(l, str) and any(x in l for x in (\"::\", \"/\", \".\")) for l in labels)\n\nfail_to_pass = prefilter_tests(\n    \"FAIL_TO_PASS\",\n    normalize_labels(_load(\"FAIL_TO_PASS\")),\n)\npass_to_pass = prefilter_tests(\n    \"PASS_TO_PASS\",\n    normalize_labels(_load(\"PASS_TO_PASS\")),\n)\ntest_directives = prefilter_tests(\"TEST_DIRECTIVES\", _load(\"TEST_DIRECTIVES\"))\n\nuse_fail_pass = (fail_to_pass or pass_to_pass) and (\n    \"pytest\" in test_cmd or \"py.test\" in test_cmd or looks_qualified(fail_to_pass + pass_to_pass)\n)\n\nexit_code = 0\ntry:\n    if use_fail_pass:\n        if not run_tests(\"FAIL_TO_PASS\", fail_to_pass):\n            exit_code = 1\n        elif not run_tests(\"PASS_TO_PASS\", pass_to_pass):\n            exit_code = 1\n    else:\n        if not run_tests(\"TEST_DIRECTIVES\", test_directives):\n            exit_code = 1\nfinally:\n    try:\n        with open(results_path, \"w\", encoding=\"utf-8\") as handle:\n            handle.write(\"\".join(log_parts))\n    except Exception as exc:\n        print(\"Failed to write test results:\", exc)\nsys.exit(exit_code)"; exec(textwrap.dedent(code))'
          TEST_EXIT=$?
