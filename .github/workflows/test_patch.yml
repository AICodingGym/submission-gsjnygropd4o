name: SWE-bench Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-22.04
    timeout-minutes: 240
    env:
      INSTANCE_ID: "django__django-15916"
      REPO: "django/django"
      VERSION: "4.2"
      BASE_COMMIT: "88e67a54b7ed0210c11523a337b498aadb2f5187"
      ENV_SETUP_COMMIT: "0fbdb9784da915fce5dcc1fe82bac9b4785749e5"
      TEST_CMD: './tests/runtests.py --verbosity 2 --settings=test_sqlite --parallel 1'
      TEST_FILES: 'tests/model_forms/tests.py'
      CONDA_ENV: "testbed"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          fetch-tags: false

      - name: Setup Miniconda
        uses: conda-incubator/setup-miniconda@v3
        with:
          auto-activate-base: false
          miniforge-variant: Miniforge3
          python-version: "3.9"

      - name: Git Safe Directory
        shell: "bash -l {0}"
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Create Conda Environment
        shell: "bash -l {0}"
        run: |
          set -euo pipefail
          source "$(conda info --base)/etc/profile.d/conda.sh"
          if [ "$ENV_SETUP_COMMIT" != "$BASE_COMMIT" ]; then
            if ! git cat-file -e "$ENV_SETUP_COMMIT^{commit}" 2>/dev/null; then
              echo "ENV_SETUP_COMMIT not found locally, fetching from upstream..."
              git fetch --depth=1 "https://github.com/$REPO.git" "$ENV_SETUP_COMMIT" || true
            fi
            if git cat-file -e "$ENV_SETUP_COMMIT^{commit}" 2>/dev/null; then
              git checkout "$ENV_SETUP_COMMIT"
            else
              echo "ENV_SETUP_COMMIT still missing; skipping checkout"
            fi
          fi
          cat <<'ENV_EOF' > /tmp/environment.yml
          name: testbed
          channels:
            - defaults
            - conda-forge
          dependencies:
            - _libgcc_mutex=0.1=main
            - _openmp_mutex=5.1=1_gnu
            - ca-certificates=2024.9.24=h06a4308_0
            - ld_impl_linux-64=2.40=h12ee557_0
            - libffi=3.4.4=h6a678d5_1
            - libgcc-ng=11.2.0=h1234567_1
            - libgomp=11.2.0=h1234567_1
            - libstdcxx-ng=11.2.0=h1234567_1
            - ncurses=6.4=h6a678d5_0
            - openssl=3.0.15=h5eee18b_0
            - pip=24.2=py39h06a4308_0
            - python=3.9.20=he870216_1
            - readline=8.2=h5eee18b_0
            - setuptools=75.1.0=py39h06a4308_0
            - sqlite=3.45.3=h5eee18b_0
            - tk=8.6.14=h39e8969_0
            - wheel=0.44.0=py39h06a4308_0
            - xz=5.4.6=h5eee18b_1
            - zlib=1.2.13=h5eee18b_1
            - pip:
                - aiohappyeyeballs==2.4.3
                - aiohttp==3.10.9
                - aiosignal==1.3.1
                - aiosmtpd==1.4.6
                - argon2-cffi==23.1.0
                - argon2-cffi-bindings==21.2.0
                - asgiref==3.8.1
                - async-timeout==4.0.3
                - atpublic==5.0
                - attrs==24.2.0
                - bcrypt==4.2.0
                - black==24.10.0
                - certifi==2024.8.30
                - cffi==1.17.1
                - charset-normalizer==3.4.0
                - click==8.1.7
                - docutils==0.21.2
                - exceptiongroup==1.2.2
                - frozenlist==1.4.1
                - geoip2==4.8.0
                - h11==0.14.0
                - idna==3.10
                - jinja2==3.1.4
                - markupsafe==3.0.1
                - maxminddb==2.6.2
                - multidict==6.1.0
                - mypy-extensions==1.0.0
                - numpy==2.0.2
                - outcome==1.3.0.post0
                - packaging==24.1
                - pathspec==0.12.1
                - pillow==10.4.0
                - platformdirs==4.3.6
                - propcache==0.2.0
                - pycparser==2.22
                - pylibmc==1.6.3
                - pymemcache==4.0.0
                - pysocks==1.7.1
                - pytz==2024.2
                - pywatchman==2.0.0
                - pyyaml==6.0.2
                - redis==5.1.1
                - requests==2.32.3
                - selenium==4.25.0
                - sniffio==1.3.1
                - sortedcontainers==2.4.0
                - sqlparse==0.5.1
                - tblib==3.0.0
                - tomli==2.0.2
                - trio==0.26.2
                - trio-websocket==0.11.1
                - typing-extensions==4.12.2
                - tzdata==2024.2
                - urllib3==2.2.3
                - websocket-client==1.8.0
                - wsproto==1.2.0
                - yarl==1.14.0
          ENV_EOF
          conda env create --file /tmp/environment.yml
          conda activate "$CONDA_ENV"
          rm /tmp/environment.yml

      - name: Checkout Trigger Commit
        shell: "bash -l {0}"
        run: |
          set -euo pipefail
          if ! git cat-file -e "$BASE_COMMIT^{commit}" 2>/dev/null; then
            git fetch --depth=1 "https://github.com/$REPO.git" "$BASE_COMMIT" || true
          fi
          if ! git cat-file -e "$GITHUB_SHA^{commit}" 2>/dev/null; then
            git fetch --depth=1 "https://github.com/$REPO.git" "$GITHUB_SHA" || true
          fi
          git checkout "$GITHUB_SHA"

      - name: Install Repo
        shell: "bash -l {0}"
        run: |
          set -euo pipefail
          source "$(conda info --base)/etc/profile.d/conda.sh"
          conda activate "$CONDA_ENV"
          git fetch --tags "https://github.com/$REPO.git" || true
          TARGET_TIMESTAMP=$(git show -s --format=%ci "$BASE_COMMIT")
          git tag -l | while read tag; do TAG_COMMIT=$(git rev-list -n 1 "$tag"); TAG_TIME=$(git show -s --format=%ci "$TAG_COMMIT"); if [[ "$TAG_TIME" > "$TARGET_TIMESTAMP" ]]; then git tag -d "$tag"; fi; done
          python -m pip install -e .

      - name: Apply Test Patch
        shell: "bash -l {0}"
        run: |
          set -euo pipefail
          git apply --verbose --reject - <<'PATCH_EOF'
          diff --git a/tests/model_forms/tests.py b/tests/model_forms/tests.py
          --- a/tests/model_forms/tests.py
          +++ b/tests/model_forms/tests.py
          @@ -3496,6 +3496,41 @@ class InheritedForm(NewForm):
                           type(NewForm.base_fields[name].widget),
                       )
           
          +    def test_custom_callback_in_meta(self):
          +        def callback(db_field, **kwargs):
          +            return forms.CharField(widget=forms.Textarea)
          +
          +        class NewForm(forms.ModelForm):
          +            class Meta:
          +                model = Person
          +                fields = ["id", "name"]
          +                formfield_callback = callback
          +
          +        for field in NewForm.base_fields.values():
          +            self.assertEqual(type(field.widget), forms.Textarea)
          +
          +    def test_custom_callback_from_base_form_meta(self):
          +        def callback(db_field, **kwargs):
          +            return forms.CharField(widget=forms.Textarea)
          +
          +        class BaseForm(forms.ModelForm):
          +            class Meta:
          +                model = Person
          +                fields = "__all__"
          +                formfield_callback = callback
          +
          +        NewForm = modelform_factory(model=Person, form=BaseForm)
          +
          +        class InheritedForm(NewForm):
          +            pass
          +
          +        for name, field in NewForm.base_fields.items():
          +            self.assertEqual(type(field.widget), forms.Textarea)
          +            self.assertEqual(
          +                type(field.widget),
          +                type(InheritedForm.base_fields[name].widget),
          +            )
          +
           
           class LocalizedModelFormTest(TestCase):
               def test_model_form_applies_localize_to_some_fields(self):
          PATCH_EOF

      - name: Run Tests
        shell: "bash -l {0}"
        run: |
          set -euo pipefail
          source "$(conda info --base)/etc/profile.d/conda.sh"
          conda activate "$CONDA_ENV"
          FAIL_TO_PASS_PATH=/tmp/fail_to_pass.json
          PASS_TO_PASS_PATH=/tmp/pass_to_pass.json
          TEST_DIRECTIVES_PATH=/tmp/test_directives.json
          TEST_RESULTS_PATH=/tmp/test_results.txt
          cat <<'FAIL_EOF' > "$FAIL_TO_PASS_PATH"
          ["test_custom_callback_from_base_form_meta (model_forms.tests.FormFieldCallbackTests)", "test_custom_callback_in_meta (model_forms.tests.FormFieldCallbackTests)"]
          FAIL_EOF
          cat <<'PASS_EOF' > "$PASS_TO_PASS_PATH"
          ["test_modelform_factory_metaclass (model_forms.tests.CustomMetaclassTestCase)", "Regression test for #12960. Make sure the cleaned_data returned from", "Regression for #12596: Calling super from ModelForm.clean() should be", "test_bad_callback (model_forms.tests.FormFieldCallbackTests)", "Using base forms with widgets defined in Meta should not raise errors.", "A custom formfield_callback is used if provided", "Regression for #15315: modelform_factory should accept widgets", "test_inherit_after_custom_callback (model_forms.tests.FormFieldCallbackTests)", "Regression for #19733", "A model ValidationError using the dict form should put the error", "A model ValidationError not using the dict form should put the error", "test_notrequired_overrides_notblank (model_forms.tests.ValidationTest)", "test_validates_with_replaced_field_excluded (model_forms.tests.ValidationTest)", "test_validates_with_replaced_field_not_specified (model_forms.tests.ValidationTest)", "test_field_removal (model_forms.tests.ModelFormInheritanceTests)", "Form fields can be removed in subclasses by setting them to None", "test_form_subclass_inheritance (model_forms.tests.ModelFormInheritanceTests)", "Data for a ManyToManyField is a list rather than a lazy QuerySet.", "test_model_form_applies_localize_to_all_fields (model_forms.tests.LocalizedModelFormTest)", "test_model_form_applies_localize_to_some_fields (model_forms.tests.LocalizedModelFormTest)", "test_model_form_refuses_arbitrary_string (model_forms.tests.LocalizedModelFormTest)", "test_callable_called_each_time_form_is_instantiated (model_forms.tests.LimitChoicesToTests)", "A custom field with a `queryset` attribute but no `limit_choices_to`", "test_fields_for_model_applies_limit_choices_to (model_forms.tests.LimitChoicesToTests)", "A ForeignKey can use limit_choices_to as a callable (#2554).", "A ManyToManyField can use limit_choices_to as a callable (#2554).", "test_limit_choices_to_m2m_through (model_forms.tests.LimitChoicesToTes