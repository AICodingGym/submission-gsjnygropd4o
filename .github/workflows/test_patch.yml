           }
           
           
          @@ -228,7 +229,9 @@ def _module_match_label(module_label, label):
                   )
           
                   if module_name in CONTRIB_TESTS_TO_APPS and module_found_in_labels:
          -            settings.INSTALLED_APPS.append(CONTRIB_TESTS_TO_APPS[module_name])
          +            for contrib_app in CONTRIB_TESTS_TO_APPS[module_name]:
          +                if contrib_app not in settings.INSTALLED_APPS:
          +                    settings.INSTALLED_APPS.append(contrib_app)
           
                   if module_found_in_labels and module_label not in installed_app_names:
                       if verbosity >= 2:
          PATCH_EOF

      - name: Run Tests
        shell: "bash -l {0}"
        run: |
          set -euo pipefail
          source "$(conda info --base)/etc/profile.d/conda.sh"
          conda activate "$CONDA_ENV"
          sed -i '/en_US.UTF-8/s/^# //g' /etc/locale.gen && locale-gen
          export LANG=en_US.UTF-8
          export LANGUAGE=en_US:en
          export LC_ALL=en_US.UTF-8
          FAIL_TO_PASS_PATH=/tmp/fail_to_pass.json
          PASS_TO_PASS_PATH=/tmp/pass_to_pass.json
          TEST_DIRECTIVES_PATH=/tmp/test_directives.json
          TEST_RESULTS_PATH=/tmp/test_results.txt
