name: SWE-bench Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-22.04
    timeout-minutes: 240
    env:
      INSTANCE_ID: "django__django-13809"
      REPO: "django/django"
      VERSION: "4.0"
      BASE_COMMIT: "bef6f7584280f1cc80e5e2d80b7ad073a93d26ec"
      ENV_SETUP_COMMIT: "475cffd1d64c690cdad16ede4d5e81985738ceb4"
      TEST_CMD: './tests/runtests.py --verbosity 2 --settings=test_sqlite --parallel 1'
      TEST_FILES: 'tests/admin_scripts/tests.py tests/utils_tests/test_autoreload.py'
      CONDA_ENV: "testbed"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          fetch-tags: false

      - name: Setup Miniconda
        uses: conda-incubator/setup-miniconda@v3
        with:
          auto-activate-base: false
          miniforge-variant: Miniforge3
          python-version: "3.8"

      - name: Git Safe Directory
        shell: "bash -l {0}"
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Create Conda Environment
        shell: "bash -l {0}"
        run: |
          set -euo pipefail
          source "$(conda info --base)/etc/profile.d/conda.sh"
          if [ "$ENV_SETUP_COMMIT" != "$BASE_COMMIT" ]; then
            if ! git cat-file -e "$ENV_SETUP_COMMIT^{commit}" 2>/dev/null; then
              echo "ENV_SETUP_COMMIT not found locally, fetching from upstream..."
              git fetch --depth=1 "https://github.com/$REPO.git" "$ENV_SETUP_COMMIT" || true
            fi
            if git cat-file -e "$ENV_SETUP_COMMIT^{commit}" 2>/dev/null; then
              git checkout "$ENV_SETUP_COMMIT"
            else
              echo "ENV_SETUP_COMMIT still missing; skipping checkout"
            fi
          fi
          cat <<'ENV_EOF' > /tmp/environment.yml
          name: testbed
          channels:
            - defaults
            - conda-forge
          dependencies:
            - _libgcc_mutex=0.1=main
            - _openmp_mutex=5.1=1_gnu
            - ca-certificates=2024.9.24=h06a4308_0
            - ld_impl_linux-64=2.40=h12ee557_0
            - libffi=3.4.4=h6a678d5_1
            - libgcc-ng=11.2.0=h1234567_1
            - libgomp=11.2.0=h1234567_1
            - libstdcxx-ng=11.2.0=h1234567_1
            - ncurses=6.4=h6a678d5_0
            - openssl=3.0.15=h5eee18b_0
            - pip=24.2=py38h06a4308_0
            - python=3.8.20=he870216_0
            - readline=8.2=h5eee18b_0
            - setuptools=75.1.0=py38h06a4308_0
            - sqlite=3.45.3=h5eee18b_0
            - tk=8.6.14=h39e8969_0
            - wheel=0.44.0=py38h06a4308_0
            - xz=5.4.6=h5eee18b_1
            - zlib=1.2.13=h5eee18b_1
            - pip:
                - aiohappyeyeballs==2.4.3
                - aiohttp==3.10.9
                - aiosignal==1.3.1
                - argon2-cffi==23.1.0
                - argon2-cffi-bindings==21.2.0
                - asgiref==3.8.1
                - async-timeout==4.0.3
                - attrs==24.2.0
                - backports-zoneinfo==0.2.1
                - bcrypt==4.2.0
                - certifi==2024.8.30
                - cffi==1.17.1
                - charset-normalizer==3.4.0
                - docutils==0.20.1
                - exceptiongroup==1.2.2
                - frozenlist==1.4.1
                - geoip2==4.8.0
                - h11==0.14.0
                - idna==3.10
                - jinja2==3.1.4
                - markupsafe==2.1.5
                - maxminddb==2.6.2
                - multidict==6.1.0
                - numpy==1.24.4
                - outcome==1.3.0.post0
                - pillow==10.4.0
                - propcache==0.2.0
                - pycparser==2.22
                - pylibmc==1.6.3
                - pymemcache==4.0.0
                - pysocks==1.7.1
                - python-memcached==1.62
                - pytz==2024.2
                - pywatchman==2.0.0
                - pyyaml==6.0.2
                - redis==5.1.1
                - requests==2.32.3
                - selenium==4.25.0
                - sniffio==1.3.1
                - sortedcontainers==2.4.0
                - sqlparse==0.5.1
                - tblib==3.0.0
                - trio==0.26.2
                - trio-websocket==0.11.1
                - typing-extensions==4.12.2
                - tzdata==2024.2
                - urllib3==2.2.3
                - websocket-client==1.8.0
                - wsproto==1.2.0
                - yarl==1.14.0
          ENV_EOF
          conda env create --file /tmp/environment.yml
          conda activate "$CONDA_ENV"
          rm /tmp/environment.yml

      - name: Checkout Trigger Commit
        shell: "bash -l {0}"
        run: |
          set -euo pipefail
          if ! git cat-file -e "$BASE_COMMIT^{commit}" 2>/dev/null; then
            git fetch --depth=1 "https://github.com/$REPO.git" "$BASE_COMMIT" || true
          fi
          if ! git cat-file -e "$GITHUB_SHA^{commit}" 2>/dev/null; then
            git fetch --depth=1 "https://github.com/$REPO.git" "$GITHUB_SHA" || true
          fi
          git checkout "$GITHUB_SHA"

      - name: Install Repo
        shell: "bash -l {0}"
        run: |
          set -euo pipefail
          source "$(conda info --base)/etc/profile.d/conda.sh"
          conda activate "$CONDA_ENV"
          git fetch --tags "https://github.com/$REPO.git" || true
          TARGET_TIMESTAMP=$(git show -s --format=%ci "$BASE_COMMIT")
          git tag -l | while read tag; do TAG_COMMIT=$(git rev-list -n 1 "$tag"); TAG_TIME=$(git show -s --format=%ci "$TAG_COMMIT"); if [[ "$TAG_TIME" > "$TARGET_TIMESTAMP" ]]; then git tag -d "$tag"; fi; done
          python -m pip install -e .

      - name: Apply Test Patch
        shell: "bash -l {0}"
        run: |
          set -euo pipefail
          git apply --verbose --reject - <<'PATCH_EOF'
          diff --git a/tests/admin_scripts/tests.py b/tests/admin_scripts/tests.py
          --- a/tests/admin_scripts/tests.py
          +++ b/tests/admin_scripts/tests.py
          @@ -1313,6 +1313,29 @@ def test_readonly_database(self):
                   # You have # ...
                   self.assertIn('unapplied migration(s)', self.output.getvalue())
           
          +    @mock.patch('django.core.management.commands.runserver.run')
          +    @mock.patch('django.core.management.base.BaseCommand.check_migrations')
          +    @mock.patch('django.core.management.base.BaseCommand.check')
          +    def test_skip_checks(self, mocked_check, *mocked_objects):
          +        call_command(
          +            'runserver',
          +            use_reloader=False,
          +            skip_checks=True,
          +            stdout=self.output,
          +        )
          +        self.assertNotIn('Performing system checks...', self.output.getvalue())
          +        mocked_check.assert_not_called()
          +
          +        self.output.truncate(0)
          +        call_command(
          +            'runserver',
          +            use_reloader=False,
          +            skip_checks=False,
          +            stdout=self.output,
          +        )
          +        self.assertIn('Performing system checks...', self.output.getvalue())
          +        mocked_check.assert_called()
          +
           
           class ManageRunserverMigrationWarning(TestCase):
           
          diff --git a/tests/utils_tests/test_autoreload.py b/tests/utils_tests/test_autoreload.py
          --- a/tests/utils_tests/test_autoreload.py
          +++ b/tests/utils_tests/test_autoreload.py
          @@ -98,8 +98,11 @@ def test_check_errors_catches_all_exceptions(self):
                   filename = self.temporary_file('test_exception.py')
                   filename.write_text('raise Exception')
                   with extend_sys_path(str(filename.parent)):
          -            with self.assertRaises(Exception):
          -                autoreload.check_errors(import_module)('test_exception')
          +            try:
          +                with self.assertRaises(Exception):
          +                    autoreload.check_errors(import_module)('test_exception')
          +            finally:
          +                autoreload._exception = None
                   self.assertFileFound(filename)
           
               def test_zip_reload(self):
          PATCH_EOF

      - name: Run Tests
        shell: "bash -l {0}"
        run: |
          set -euo pipefail
          source "$(conda info --base)/etc/profile.d/conda.sh"
          conda activate "$CONDA_ENV"
          FAIL_TO_PASS_PATH=/tmp/fail_to_pass.json
          PASS_TO_PASS_PATH=/tmp/pass_to_pass.json
          TEST_DIRECTIVES_PATH=/tmp/test_directives.json
          TEST_RESULTS_PATH=/tmp/test_results.txt
          cat <<'FAIL_EOF' > "$FAIL_TO_PASS_PATH"
          ["test_skip_checks (admin_scripts.tests.ManageRunserver)"]
          FAIL_EOF
          cat <<'PASS_EOF' > "$PASS_TO_PASS_PATH"
          ["test_common_roots (utils_tests.test_autoreload.TestCommonRoots)", "test_no_exception (utils_tests.test_autoreload.TestRaiseLastException)", "test_raises_custom_exception (utils_tests.test_autoreload.TestRaiseLastException)", "test_raises_exception (utils_tests.test_autoreload.TestRaiseLastException)", "test_raises_exception_with_context (utils_tests.test_autoreload.TestRaiseLastException)", "test_watchman_available (utils_tests.test_autoreload.GetReloaderTests)", "test_watchman_unavailable (utils_tests.test_autoreload.GetReloaderTests)", "test_sys_paths_absolute (utils_tests.test_autoreload.TestSysPathDirectories)", "test_sys_paths_directories (utils_tests.test_autoreload.TestSysPathDirectories)", "test_sys_paths_non_existing (utils_tests.test_autoreload.TestSysPathDirectories)", "test_sys_paths_with_directories (utils_tests.test_autoreload.TestSysPathDirectories)", "test_is_django_module (utils_tests.test_autoreload.TestUtilities)", "test_is_django_path (utils_tests.test_autoreload.TestUtilities)", "test_entrypoint_fallback (utils_tests.test_autoreload.TestChildArguments)", "test_exe_fallback (utils_tests.test_autoreload.TestChildArguments)", "test_raises_runtimeerror (utils_tests.test_autoreload.TestChildArguments)", "test_run_as_module (utils_tests.test_autoreload.TestChildArguments)", "test_run_as_non_django_module (utils_tests.test_autoreload.TestChildArguments)", "test_warnoptions (utils_tests.test_autoreload.TestChildArguments)", "test_manage_py (utils_tests.test_autoreload.RestartWithReloaderTests)", "test_python_m_django (utils_tests.test_autoreload.RestartWithReloaderTests)", "test_calls_start_django (utils_tests.test_autoreload.RunWithReloaderTests)", "test_calls_sys_exit (utils_tests.test_autoreload.RunWithReloaderTests)", "test_swallows_keyboard_interrupt (utils_tests.test_autoreload.RunWithReloaderTests)", "test_mutates_error_files (utils_tests.test_autoreload.TestCheckErrors)", "Program name is computed from the execute_from_command_line()