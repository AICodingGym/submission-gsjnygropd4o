name: SWE-bench Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-22.04
    timeout-minutes: 240
    env:
      INSTANCE_ID: "django__django-12325"
      REPO: "django/django"
      VERSION: "3.1"
      BASE_COMMIT: "29c126bb349526b5f1cd78facbe9f25906f18563"
      ENV_SETUP_COMMIT: "0668164b4ac93a5be79f5b87fae83c657124d9ab"
      TEST_CMD: './tests/runtests.py --verbosity 2 --settings=test_sqlite --parallel 1'
      TEST_FILES: 'tests/invalid_models_tests/test_models.py tests/invalid_models_tests/test_relative_fields.py tests/migrations/test_state.py'
      CONDA_ENV: "testbed"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          fetch-tags: false

      - name: Setup Miniconda
        uses: conda-incubator/setup-miniconda@v3
        with:
          auto-activate-base: false
          miniforge-variant: Miniforge3
          python-version: "3.6"

      - name: Git Safe Directory
        shell: "bash -l {0}"
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Create Conda Environment
        shell: "bash -l {0}"
        run: |
          set -euo pipefail
          source "$(conda info --base)/etc/profile.d/conda.sh"
          if [ "$ENV_SETUP_COMMIT" != "$BASE_COMMIT" ]; then
            if ! git cat-file -e "$ENV_SETUP_COMMIT^{commit}" 2>/dev/null; then
              echo "ENV_SETUP_COMMIT not found locally, fetching from upstream..."
              git fetch --depth=1 "https://github.com/$REPO.git" "$ENV_SETUP_COMMIT" || true
            fi
            if git cat-file -e "$ENV_SETUP_COMMIT^{commit}" 2>/dev/null; then
              git checkout "$ENV_SETUP_COMMIT"
            else
              echo "ENV_SETUP_COMMIT still missing; skipping checkout"
            fi
          fi
          cat <<'ENV_EOF' > /tmp/environment.yml
          name: testbed
          channels:
            - defaults
            - conda-forge
          dependencies:
            - _libgcc_mutex=0.1=main
            - _openmp_mutex=5.1=1_gnu
            - ca-certificates=2024.9.24=h06a4308_0
            - certifi=2021.5.30=py36h06a4308_0
            - ld_impl_linux-64=2.40=h12ee557_0
            - libffi=3.3=he6710b0_2
            - libgcc-ng=11.2.0=h1234567_1
            - libgomp=11.2.0=h1234567_1
            - libstdcxx-ng=11.2.0=h1234567_1
            - ncurses=6.4=h6a678d5_0
            - openssl=1.1.1w=h7f8727e_0
            - pip=21.2.2=py36h06a4308_0
            - python=3.6.13=h12debd9_1
            - readline=8.2=h5eee18b_0
            - setuptools=58.0.4=py36h06a4308_0
            - sqlite=3.45.3=h5eee18b_0
            - tk=8.6.14=h39e8969_0
            - wheel=0.37.1=pyhd3eb1b0_0
            - xz=5.4.6=h5eee18b_1
            - zlib=1.2.13=h5eee18b_1
            - pip:
                - aiohttp==3.8.6
                - aiosignal==1.2.0
                - argon2-cffi==21.3.0
                - argon2-cffi-bindings==21.2.0
                - asgiref==3.4.1
                - async-timeout==4.0.2
                - asynctest==0.13.0
                - attrs==22.2.0
                - bcrypt==4.0.1
                - cffi==1.15.1
                - charset-normalizer==2.0.12
                - dataclasses==0.8
                - docutils==0.18.1
                - frozenlist==1.2.0
                - geoip2==4.6.0
                - idna==3.10
                - idna-ssl==1.1.0
                - jinja2==3.0.3
                - markupsafe==2.0.1
                - maxminddb==2.2.0
                - multidict==5.2.0
                - numpy==1.19.5
                - pillow==8.4.0
                - pycparser==2.21
                - pylibmc==1.6.3
                - python-memcached==1.62
                - pytz==2024.2
                - pywatchman==1.4.1
                - pyyaml==6.0.1
                - requests==2.27.1
                - selenium==3.141.0
                - sqlparse==0.4.4
                - tblib==1.7.0
                - typing-extensions==4.1.1
                - urllib3==1.26.20
                - yarl==1.7.2
          ENV_EOF
          conda env create --file /tmp/environment.yml
          conda activate "$CONDA_ENV"
          rm /tmp/environment.yml

      - name: Checkout Trigger Commit
        shell: "bash -l {0}"
        run: |
          set -euo pipefail
          if ! git cat-file -e "$BASE_COMMIT^{commit}" 2>/dev/null; then
            git fetch --depth=1 "https://github.com/$REPO.git" "$BASE_COMMIT" || true
          fi
          if ! git cat-file -e "$GITHUB_SHA^{commit}" 2>/dev/null; then
            git fetch --depth=1 "https://github.com/$REPO.git" "$GITHUB_SHA" || true
          fi
          git checkout "$GITHUB_SHA"

      - name: Install Repo
        shell: "bash -l {0}"
        run: |
          set -euo pipefail
          source "$(conda info --base)/etc/profile.d/conda.sh"
          conda activate "$CONDA_ENV"
          git fetch --tags "https://github.com/$REPO.git" || true
          TARGET_TIMESTAMP=$(git show -s --format=%ci "$BASE_COMMIT")
          git tag -l | while read tag; do TAG_COMMIT=$(git rev-list -n 1 "$tag"); TAG_TIME=$(git show -s --format=%ci "$TAG_COMMIT"); if [[ "$TAG_TIME" > "$TARGET_TIMESTAMP" ]]; then git tag -d "$tag"; fi; done
          python -m pip install -e .

      - name: Apply Test Patch
        shell: "bash -l {0}"
        run: |
          set -euo pipefail
          git apply --verbose --reject - <<'PATCH_EOF'
          diff --git a/tests/invalid_models_tests/test_models.py b/tests/invalid_models_tests/test_models.py
          --- a/tests/invalid_models_tests/test_models.py
          +++ b/tests/invalid_models_tests/test_models.py
          @@ -3,7 +3,6 @@
           from django.conf import settings
           from django.core.checks import Error, Warning
           from django.core.checks.model_checks import _check_lazy_references
          -from django.core.exceptions import ImproperlyConfigured
           from django.db import connection, connections, models
           from django.db.models.functions import Lower
           from django.db.models.signals import post_init
          @@ -1006,14 +1005,24 @@ class ShippingMethodPrice(models.Model):
           
                   self.assertEqual(ShippingMethod.check(), [])
           
          -    def test_missing_parent_link(self):
          -        msg = 'Add parent_link=True to invalid_models_tests.ParkingLot.parent.'
          -        with self.assertRaisesMessage(ImproperlyConfigured, msg):
          -            class Place(models.Model):
          -                pass
          +    def test_onetoone_with_parent_model(self):
          +        class Place(models.Model):
          +            pass
          +
          +        class ParkingLot(Place):
          +            other_place = models.OneToOneField(Place, models.CASCADE, related_name='other_parking')
          +
          +        self.assertEqual(ParkingLot.check(), [])
          +
          +    def test_onetoone_with_explicit_parent_link_parent_model(self):
          +        class Place(models.Model):
          +            pass
          +
          +        class ParkingLot(Place):
          +            place = models.OneToOneField(Place, models.CASCADE, parent_link=True, primary_key=True)
          +            other_place = models.OneToOneField(Place, models.CASCADE, related_name='other_parking')
           
          -            class ParkingLot(Place):
          -                parent = models.OneToOneField(Place, models.CASCADE)
          +        self.assertEqual(ParkingLot.check(), [])
           
               def test_m2m_table_name_clash(self):
                   class Foo(models.Model):
          diff --git a/tests/invalid_models_tests/test_relative_fields.py b/tests/invalid_models_tests/test_relative_fields.py
          --- a/tests/invalid_models_tests/test_relative_fields.py
          +++ b/tests/invalid_models_tests/test_relative_fields.py
          @@ -1291,6 +1291,33 @@ class Model(models.Model):
                       ),
                   ])
           
          +    def test_clash_parent_link(self):
          +        class Parent(models.Model):
          +            pass
          +
          +        class Child(Parent):
          +            other_parent = models.OneToOneField(Parent, models.CASCADE)
          +
          +        errors = [
          +            ('fields.E304', 'accessor', 'parent_ptr', 'other_parent'),
          +            ('fields.E305', 'query name', 'parent_ptr', 'other_parent'),
          +            ('fields.E304', 'accessor', 'other_parent', 'parent_ptr'),
          +            ('fields.E305', 'query name', 'other_parent', 'parent_ptr'),
          +        ]
          +        self.assertEqual(Child.check(), [
          +            Error(
          +                "Reverse %s for 'Child.%s' clashes with reverse %s for "
          +                "'Child.%s'." % (attr, field_name, attr, clash_name),
          +                hint=(
          +                    "Add or change a related_name argument to the definition "
          +                    "for 'Child.%s' or 'Child.%s'." % (field_name, clash_name)
          +                ),
          +                obj=Child._meta.get_field(field_name),
          +                id=error_id,
          +            )
          +            for error_id, attr, field_name, clash_name in errors
          +        ])
          +
           
           @isolate_apps('invalid_models_tests')
           class M2mThroughFieldsTests(SimpleTestCase):
          diff --git a/tests/migrations/test_state.py b/tests/migrations/test_state.py
          --- a/tests/migrations/test_state.py
          +++ b/tests/migrations/test_state.py
          @@ -345,6 +345,7 @@ def test_render(self):
                               'migrations.Tag',
                               models.CASCADE,
                               auto_created=True,
          +                    parent_link=True,
                               primary_key=True,
                               to_field='id',
                               serialize=False,
          PATCH_EOF

      - name: Run Tests
        shell: "bash -l {0}"
        run: |
          set -euo pipefail
          source "$(conda info --base)/etc/profile.d/conda.sh"
          conda activate "$CONDA_ENV"
          sed -i '/en_US.UTF-8/s/^# //g' /etc/locale.gen && locale-gen
          export LANG=en_US.UTF-8
          export LANGUAGE=en_US:en
          export LC_ALL=en_US.UTF-8
          FAIL_TO_PASS_PATH=/tmp/fail_to_pass.json
          PASS_TO_PASS_PATH=/tmp/pass_to_pass.json
          TEST_DIRECTIVES_PATH=/tmp/test_directives.json
          TEST_RESULTS_PATH=/tmp/test_results.txt
          cat <<'FAIL_EOF' > "$FAIL_TO_PASS_PATH"
          ["test_clash_parent_link (invalid_models_tests.test_relative_fields.ComplexClashTests)", "test_onetoone_with_parent_model (invalid_models_tests.test_models.OtherModelTests)"]
