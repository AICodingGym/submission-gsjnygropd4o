name: SWE-bench Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-22.04
    timeout-minutes: 240
    env:
      INSTANCE_ID: "django__django-15569"
      REPO: "django/django"
      VERSION: "4.1"
      BASE_COMMIT: "884b4c27f506b3c29d58509fc83a35c30ea10d94"
      ENV_SETUP_COMMIT: "647480166bfe7532e8c471fef0146e3a17e6c0c9"
      TEST_CMD: './tests/runtests.py --verbosity 2 --settings=test_sqlite --parallel 1'
      TEST_FILES: 'tests/custom_lookups/tests.py tests/model_fields/test_jsonfield.py tests/schema/tests.py'
      CONDA_ENV: "testbed"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          fetch-tags: false

      - name: Setup Miniconda
        uses: conda-incubator/setup-miniconda@v3
        with:
          auto-activate-base: false
          miniforge-variant: Miniforge3
          python-version: "3.9"

      - name: Git Safe Directory
        shell: "bash -l {0}"
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Create Conda Environment
        shell: "bash -l {0}"
        run: |
          set -euo pipefail
          source "$(conda info --base)/etc/profile.d/conda.sh"
          if [ "$ENV_SETUP_COMMIT" != "$BASE_COMMIT" ]; then
            if ! git cat-file -e "$ENV_SETUP_COMMIT^{commit}" 2>/dev/null; then
              echo "ENV_SETUP_COMMIT not found locally, fetching from upstream..."
              git fetch --depth=1 "https://github.com/$REPO.git" "$ENV_SETUP_COMMIT" || true
            fi
            if git cat-file -e "$ENV_SETUP_COMMIT^{commit}" 2>/dev/null; then
              git checkout "$ENV_SETUP_COMMIT"
            else
              echo "ENV_SETUP_COMMIT still missing; skipping checkout"
            fi
          fi
          cat <<'ENV_EOF' > /tmp/environment.yml
          name: testbed
          channels:
            - defaults
            - conda-forge
          dependencies:
            - _libgcc_mutex=0.1=main
            - _openmp_mutex=5.1=1_gnu
            - ca-certificates=2024.9.24=h06a4308_0
            - ld_impl_linux-64=2.40=h12ee557_0
            - libffi=3.4.4=h6a678d5_1
            - libgcc-ng=11.2.0=h1234567_1
            - libgomp=11.2.0=h1234567_1
            - libstdcxx-ng=11.2.0=h1234567_1
            - ncurses=6.4=h6a678d5_0
            - openssl=3.0.15=h5eee18b_0
            - pip=24.2=py39h06a4308_0
            - python=3.9.20=he870216_1
            - readline=8.2=h5eee18b_0
            - setuptools=75.1.0=py39h06a4308_0
            - sqlite=3.45.3=h5eee18b_0
            - tk=8.6.14=h39e8969_0
            - wheel=0.44.0=py39h06a4308_0
            - xz=5.4.6=h5eee18b_1
            - zlib=1.2.13=h5eee18b_1
            - pip:
                - aiohappyeyeballs==2.4.3
                - aiohttp==3.10.9
                - aiosignal==1.3.1
                - aiosmtpd==1.4.6
                - argon2-cffi==23.1.0
                - argon2-cffi-bindings==21.2.0
                - asgiref==3.8.1
                - async-timeout==4.0.3
                - atpublic==5.0
                - attrs==24.2.0
                - bcrypt==4.2.0
                - black==24.10.0
                - certifi==2024.8.30
                - cffi==1.17.1
                - charset-normalizer==3.4.0
                - click==8.1.7
                - docutils==0.21.2
                - exceptiongroup==1.2.2
                - frozenlist==1.4.1
                - geoip2==4.8.0
                - h11==0.14.0
                - idna==3.10
                - jinja2==3.1.4
                - markupsafe==3.0.1
                - maxminddb==2.6.2
                - multidict==6.1.0
                - mypy-extensions==1.0.0
                - numpy==2.0.2
                - outcome==1.3.0.post0
                - packaging==24.1
                - pathspec==0.12.1
                - pillow==10.4.0
                - platformdirs==4.3.6
                - propcache==0.2.0
                - pycparser==2.22
                - pylibmc==1.6.3
                - pymemcache==4.0.0
                - pysocks==1.7.1
                - pytz==2024.2
                - pywatchman==2.0.0
                - pyyaml==6.0.2
                - redis==5.1.1
                - requests==2.32.3
                - selenium==4.25.0
                - sniffio==1.3.1
                - sortedcontainers==2.4.0
                - sqlparse==0.5.1
                - tblib==3.0.0
                - tomli==2.0.2
                - trio==0.26.2
                - trio-websocket==0.11.1
                - typing-extensions==4.12.2
                - tzdata==2024.2
                - urllib3==2.2.3
                - websocket-client==1.8.0
                - wsproto==1.2.0
                - yarl==1.14.0
          ENV_EOF
          conda env create --file /tmp/environment.yml
          conda activate "$CONDA_ENV"
          rm /tmp/environment.yml

      - name: Checkout Trigger Commit
        shell: "bash -l {0}"
        run: |
          set -euo pipefail
          if ! git cat-file -e "$BASE_COMMIT^{commit}" 2>/dev/null; then
            git fetch --depth=1 "https://github.com/$REPO.git" "$BASE_COMMIT" || true
          fi
          if ! git cat-file -e "$GITHUB_SHA^{commit}" 2>/dev/null; then
            git fetch --depth=1 "https://github.com/$REPO.git" "$GITHUB_SHA" || true
          fi
          git checkout "$GITHUB_SHA"

      - name: Install Repo
        shell: "bash -l {0}"
        run: |
          set -euo pipefail
          source "$(conda info --base)/etc/profile.d/conda.sh"
          conda activate "$CONDA_ENV"
          git fetch --tags "https://github.com/$REPO.git" || true
          TARGET_TIMESTAMP=$(git show -s --format=%ci "$BASE_COMMIT")
          git tag -l | while read tag; do TAG_COMMIT=$(git rev-list -n 1 "$tag"); TAG_TIME=$(git show -s --format=%ci "$TAG_COMMIT"); if [[ "$TAG_TIME" > "$TARGET_TIMESTAMP" ]]; then git tag -d "$tag"; fi; done
          python -m pip install -e .

      - name: Apply Test Patch
        shell: "bash -l {0}"
        run: |
          set -euo pipefail
          git apply --verbose --reject - <<'PATCH_EOF'
          diff --git a/tests/custom_lookups/tests.py b/tests/custom_lookups/tests.py
          --- a/tests/custom_lookups/tests.py
          +++ b/tests/custom_lookups/tests.py
          @@ -323,6 +323,8 @@ def test_lookups_caching(self):
                   with register_lookup(models.ForeignObject, Exactly):
                       # getting the lookups again should re-cache
                       self.assertIn("exactly", field.get_lookups())
          +        # Unregistration should bust the cache.
          +        self.assertNotIn("exactly", field.get_lookups())
           
           
           class BilateralTransformTests(TestCase):
          diff --git a/tests/model_fields/test_jsonfield.py b/tests/model_fields/test_jsonfield.py
          --- a/tests/model_fields/test_jsonfield.py
          +++ b/tests/model_fields/test_jsonfield.py
          @@ -88,7 +88,6 @@ class MyTransform(Transform):
                   transform = field.get_transform("my_transform")
                   self.assertIs(transform, MyTransform)
                   models.JSONField._unregister_lookup(MyTransform)
          -        models.JSONField._clear_cached_lookups()
                   transform = field.get_transform("my_transform")
                   self.assertIsInstance(transform, KeyTransformFactory)
           
          diff --git a/tests/schema/tests.py b/tests/schema/tests.py
          --- a/tests/schema/tests.py
          +++ b/tests/schema/tests.py
          @@ -2770,16 +2770,16 @@ def test_func_unique_constraint_lookups(self):
                       with connection.schema_editor() as editor:
                           editor.add_constraint(Author, constraint)
                           sql = constraint.create_sql(Author, editor)
          -        table = Author._meta.db_table
          -        constraints = self.get_constraints(table)
          -        self.assertIn(constraint.name, constraints)
          -        self.assertIs(constraints[constraint.name]["unique"], True)
          -        # SQL contains columns.
          -        self.assertIs(sql.references_column(table, "name"), True)
          -        self.assertIs(sql.references_column(table, "weight"), True)
          -        # Remove constraint.
          -        with connection.schema_editor() as editor:
          -            editor.remove_constraint(Author, constraint)
          +            table = Author._meta.db_table
          +            constraints = self.get_constraints(table)
          +            self.assertIn(constraint.name, constraints)
          +            self.assertIs(constraints[constraint.name]["unique"], True)
          +            # SQL contains columns.
          +            self.assertIs(sql.references_column(table, "name"), True)
          +            self.assertIs(sql.references_column(table, "weight"), True)
          +            # Remove constraint.
          +            with connection.schema_editor() as editor:
          +                editor.remove_constraint(Author, constraint)
                   self.assertNotIn(constraint.name, self.get_constraints(table))
           
               @skipUnlessDBFeature("supports_expression_indexes")
          PATCH_EOF

      - name: Run Tests
        shell: "bash -l {0}"
        run: |
          set -euo pipefail
          source "$(conda info --base)/etc/profile.d/conda.sh"
          conda activate "$CONDA_ENV"
          FAIL_TO_PASS_PATH=/tmp/fail_to_pass.json
          PASS_TO_PASS_PATH=/tmp/pass_to_pass.json
          TEST_DIRECTIVES_PATH=/tmp/test_directives.json
          TEST_RESULTS_PATH=/tmp/test_results.txt
          cat <<'FAIL_EOF' > "$FAIL_TO_PASS_PATH"
          ["test_get_transforms (model_fields.test_jsonfield.TestMethods)", "test_lookups_caching (custom_lookups.tests.LookupTests)"]
          FAIL_EOF
          cat <<'PASS_EOF' > "$PASS_TO_PASS_PATH"
          ["test_formfield (model_fields.test_jsonfield.TestFormField)", "test_formfield_custom_encoder_decoder (model_fields.test_jsonfield.TestFormField)", "test_subquery_usage (custom_lookups.tests.SubqueryTransformTests)", "test_call_order (custom_lookups.tests.LookupTransformCallOrderTests)", "test_overridden_get_lookup (custom_lookups.tests.CustomisedMethodsTests)", "test_overridden_get_lookup_chain (custom_lookups.tests.CustomisedMethodsTests)", "test_overridden_get_transform (custom_lookups.tests.CustomisedMethodsTests)", "test_overridden_get_transform_chain (custom_lookups.tests.CustomisedMethodsTests)", "test_custom_implementation_year_exact (custom_lookups.tests.YearLteTests)", "test_postgres_year_exact (custom_lookups.tests.YearLteTests)", "test_year_lte_sql (custom_lookups.tests.YearLteTests)", "test_deconstruct (model_fields.test_jsonfield.TestMethods)", "test_deconstruct_custom_encoder_decoder (model_fields.test_jsonfield.TestMethods)", "test_key_transform_text_lookup_mixin_non_key_transform (model_fields.test_jsonfield.TestMethods)", "test_custom_encoder (model_fields.test_jsonfield.TestValidation)", "test_invalid_decoder (model_fields.test_jsonfield.TestValidation)", "test_invalid_encoder (model_fields.test_jsonfield.TestValidation)", "test_validation_error (model_fields.test_jsonfield.TestValidation)", "test_custom_encoder_decoder (model_fields.test_jsonfield.JSONFieldTests)", "test_db_check_constraints (model_fields.test_jsonfield.JSONFieldTests)", "test_invalid_value (model_fields.test_jsonfield.JSONFieldTests)", "test_basic_lookup (custom_lookups.tests.LookupTests)", "__exact=None is transformed to __isnull=True if a custom lookup class", "test_custom_name_lookup (custom_lookups.tests.LookupTests)", "test_div3_extract (custom_lookups.tests.LookupTests)", "test_foreignobject_lookup_registration (custom_lookups.tests.LookupTests)", "test_bilateral_fexpr (custom_lookups.tests.BilateralTransformTests)", "test_bilateral_inner_qs (custom_lookups.tests