                - jsonschema-specifications==2023.12.1
                - jupyter-client==8.6.3
                - jupyter-core==5.7.2
                - jupyterlab-pygments==0.3.0
                - jupyterlab-widgets==3.0.13
                - kiwisolver==1.4.7
                - lxml==5.3.1
                - markupsafe==2.1.5
                - mccabe==0.7.0
                - mistune==3.1.2
                - mpl-sphinx-theme==3.9.0
                - nbclient==0.10.1
                - nbconvert==7.16.6
                - nbformat==5.10.4
                - nest-asyncio==1.6.0
                - numpy==1.24.4
                - numpydoc==1.5.0
                - packaging==24.2
                - pandas==2.0.3
                - pandocfilters==1.5.1
                - parso==0.8.4
                - pexpect==4.9.0
                - pickleshare==0.7.5
                - pikepdf==9.2.1
