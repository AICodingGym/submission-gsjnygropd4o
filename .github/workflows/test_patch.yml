          conda env create --file /tmp/environment.yml
          conda activate "$CONDA_ENV"
          rm /tmp/environment.yml
          python -m pip install cython setuptools numpy scipy

      - name: Checkout Trigger Commit
        shell: "bash -l {0}"
        run: |
          set -euo pipefail
          if ! git cat-file -e "$BASE_COMMIT^{commit}" 2>/dev/null; then
            git fetch --depth=1 "https://github.com/$REPO.git" "$BASE_COMMIT" || true
          fi
          if ! git cat-file -e "$GITHUB_SHA^{commit}" 2>/dev/null; then
            git fetch --depth=1 "https://github.com/$REPO.git" "$GITHUB_SHA" || true
          fi
          git checkout "$GITHUB_SHA"

      - name: Install Repo
        shell: "bash -l {0}"
        run: |
          set -euo pipefail
          source "$(conda info --base)/etc/profile.d/conda.sh"
          conda activate "$CONDA_ENV"
          git fetch --tags "https://github.com/$REPO.git" || true
          TARGET_TIMESTAMP=$(git show -s --format=%ci "$BASE_COMMIT")
          git tag -l | while read tag; do TAG_COMMIT=$(git rev-list -n 1 "$tag"); TAG_TIME=$(git show -s --format=%ci "$TAG_COMMIT"); if [[ "$TAG_TIME" > "$TARGET_TIMESTAMP" ]]; then git tag -d "$tag"; fi; done
          python -m pip install -v --no-use-pep517 --no-build-isolation -e .

      - name: Apply Test Patch
        shell: "bash -l {0}"
        run: |
          set -euo pipefail
          git apply --verbose --reject - <<'PATCH_EOF'
          diff --git a/sklearn/impute/tests/test_impute.py b/sklearn/impute/tests/test_impute.py
          --- a/sklearn/impute/tests/test_impute.py
          +++ b/sklearn/impute/tests/test_impute.py
          @@ -1524,6 +1524,21 @@ def test_iterative_imputer_keep_empty_features(initial_strategy):
               assert_allclose(X_imputed[:, 1], 0)
           
           
          +def test_iterative_imputer_constant_fill_value():
          +    """Check that we propagate properly the parameter `fill_value`."""
          +    X = np.array([[-1, 2, 3, -1], [4, -1, 5, -1], [6, 7, -1, -1], [8, 9, 0, -1]])
          +
          +    fill_value = 100
          +    imputer = IterativeImputer(
          +        missing_values=-1,
          +        initial_strategy="constant",
          +        fill_value=fill_value,
          +        max_iter=0,
          +    )
          +    imputer.fit_transform(X)
          +    assert_array_equal(imputer.initial_imputer_.statistics_, fill_value)
          +
          +
           @pytest.mark.parametrize("keep_empty_features", [True, False])
           def test_knn_imputer_keep_empty_features(keep_empty_features):
               """Check the behaviour of `keep_empty_features` for `KNNImputer`."""
          PATCH_EOF

      - name: Run Tests
        shell: "bash -l {0}"
        run: |
          set -euo pipefail
          source "$(conda info --base)/etc/profile.d/conda.sh"
          conda activate "$CONDA_ENV"
