name: SWE-bench Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-22.04
    timeout-minutes: 240
    env:
      INSTANCE_ID: "django__django-13028"
      REPO: "django/django"
      VERSION: "3.2"
      BASE_COMMIT: "78ad4b4b0201003792bfdbf1a7781cbc9ee03539"
      ENV_SETUP_COMMIT: "65dfb06a1ab56c238cc80f5e1c31f61210c4577d"
      TEST_CMD: './tests/runtests.py --verbosity 2 --settings=test_sqlite --parallel 1'
      TEST_FILES: 'tests/queries/models.py tests/queries/tests.py'
      CONDA_ENV: "testbed"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          fetch-tags: false

      - name: Setup Miniconda
        uses: conda-incubator/setup-miniconda@v3
        with:
          auto-activate-base: false
          miniforge-variant: Miniforge3
          python-version: "3.6"

      - name: Git Safe Directory
        shell: "bash -l {0}"
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Create Conda Environment
        shell: "bash -l {0}"
        run: |
          set -euo pipefail
          source "$(conda info --base)/etc/profile.d/conda.sh"
          if [ "$ENV_SETUP_COMMIT" != "$BASE_COMMIT" ]; then
            if ! git cat-file -e "$ENV_SETUP_COMMIT^{commit}" 2>/dev/null; then
              echo "ENV_SETUP_COMMIT not found locally, fetching from upstream..."
              git fetch --depth=1 "https://github.com/$REPO.git" "$ENV_SETUP_COMMIT" || true
            fi
            if git cat-file -e "$ENV_SETUP_COMMIT^{commit}" 2>/dev/null; then
              git checkout "$ENV_SETUP_COMMIT"
            else
              echo "ENV_SETUP_COMMIT still missing; skipping checkout"
            fi
          fi
          cat <<'ENV_EOF' > /tmp/environment.yml
          name: testbed
          channels:
            - defaults
            - conda-forge
          dependencies:
            - _libgcc_mutex=0.1=main
            - _openmp_mutex=5.1=1_gnu
            - ca-certificates=2024.9.24=h06a4308_0
            - certifi=2021.5.30=py36h06a4308_0
            - ld_impl_linux-64=2.40=h12ee557_0
            - libffi=3.3=he6710b0_2
            - libgcc-ng=11.2.0=h1234567_1
            - libgomp=11.2.0=h1234567_1
            - libstdcxx-ng=11.2.0=h1234567_1
            - ncurses=6.4=h6a678d5_0
            - openssl=1.1.1w=h7f8727e_0
            - pip=21.2.2=py36h06a4308_0
            - python=3.6.13=h12debd9_1
            - readline=8.2=h5eee18b_0
            - setuptools=58.0.4=py36h06a4308_0
            - sqlite=3.45.3=h5eee18b_0
            - tk=8.6.14=h39e8969_0
            - wheel=0.37.1=pyhd3eb1b0_0
            - xz=5.4.6=h5eee18b_1
            - zlib=1.2.13=h5eee18b_1
            - pip:
                - aiohttp==3.8.6
                - aiosignal==1.2.0
                - argon2-cffi==21.3.0
                - argon2-cffi-bindings==21.2.0
                - asgiref==3.4.1
                - async-timeout==4.0.2
                - asynctest==0.13.0
                - attrs==22.2.0
                - backports-zoneinfo==0.2.1
                - bcrypt==4.0.1
                - cffi==1.15.1
                - charset-normalizer==2.0.12
                - dataclasses==0.8
                - docutils==0.18.1
                - frozenlist==1.2.0
                - geoip2==4.6.0
                - idna==3.10
                - idna-ssl==1.1.0
                - importlib-resources==5.4.0
                - jinja2==3.0.3
                - markupsafe==2.0.1
                - maxminddb==2.2.0
                - multidict==5.2.0
                - numpy==1.19.5
                - pillow==8.4.0
                - pycparser==2.21
                - pylibmc==1.6.3
                - pymemcache==3.5.2
                - python-memcached==1.62
                - pytz==2024.2
                - pywatchman==1.4.1
                - pyyaml==6.0.1
                - requests==2.27.1
                - selenium==3.141.0
                - six==1.16.0
                - sqlparse==0.4.4
                - tblib==1.7.0
                - typing-extensions==4.1.1
                - tzdata==2024.2
                - urllib3==1.26.20
                - yarl==1.7.2
                - zipp==3.6.0
          ENV_EOF
          conda env create --file /tmp/environment.yml
          conda activate "$CONDA_ENV"
          rm /tmp/environment.yml

      - name: Checkout Trigger Commit
        shell: "bash -l {0}"
        run: |
          set -euo pipefail
          if ! git cat-file -e "$BASE_COMMIT^{commit}" 2>/dev/null; then
            git fetch --depth=1 "https://github.com/$REPO.git" "$BASE_COMMIT" || true
          fi
          if ! git cat-file -e "$GITHUB_SHA^{commit}" 2>/dev/null; then
            git fetch --depth=1 "https://github.com/$REPO.git" "$GITHUB_SHA" || true
          fi
          git checkout "$GITHUB_SHA"

      - name: Install Repo
        shell: "bash -l {0}"
        run: |
          set -euo pipefail
          source "$(conda info --base)/etc/profile.d/conda.sh"
          conda activate "$CONDA_ENV"
          git fetch --tags "https://github.com/$REPO.git" || true
          TARGET_TIMESTAMP=$(git show -s --format=%ci "$BASE_COMMIT")
          git tag -l | while read tag; do TAG_COMMIT=$(git rev-list -n 1 "$tag"); TAG_TIME=$(git show -s --format=%ci "$TAG_COMMIT"); if [[ "$TAG_TIME" > "$TARGET_TIMESTAMP" ]]; then git tag -d "$tag"; fi; done
          python -m pip install -e .

      - name: Apply Test Patch
        shell: "bash -l {0}"
        run: |
          set -euo pipefail
          git apply --verbose --reject - <<'PATCH_EOF'
          diff --git a/tests/queries/models.py b/tests/queries/models.py
          --- a/tests/queries/models.py
          +++ b/tests/queries/models.py
          @@ -68,6 +68,7 @@ class ExtraInfo(models.Model):
               note = models.ForeignKey(Note, models.CASCADE, null=True)
               value = models.IntegerField(null=True)
               date = models.ForeignKey(DateTimePK, models.SET_NULL, null=True)
          +    filterable = models.BooleanField(default=True)
           
               class Meta:
                   ordering = ['info']
          diff --git a/tests/queries/tests.py b/tests/queries/tests.py
          --- a/tests/queries/tests.py
          +++ b/tests/queries/tests.py
          @@ -56,12 +56,12 @@ def setUpTestData(cls):
           
                   # Create these out of order so that sorting by 'id' will be different to sorting
                   # by 'info'. Helps detect some problems later.
          -        cls.e2 = ExtraInfo.objects.create(info='e2', note=cls.n2, value=41)
          +        cls.e2 = ExtraInfo.objects.create(info='e2', note=cls.n2, value=41, filterable=False)
                   e1 = ExtraInfo.objects.create(info='e1', note=cls.n1, value=42)
           
                   cls.a1 = Author.objects.create(name='a1', num=1001, extra=e1)
                   cls.a2 = Author.objects.create(name='a2', num=2002, extra=e1)
          -        a3 = Author.objects.create(name='a3', num=3003, extra=cls.e2)
          +        cls.a3 = Author.objects.create(name='a3', num=3003, extra=cls.e2)
                   cls.a4 = Author.objects.create(name='a4', num=4004, extra=cls.e2)
           
                   cls.time1 = datetime.datetime(2007, 12, 19, 22, 25, 0)
          @@ -77,7 +77,7 @@ def setUpTestData(cls):
                   i4.tags.set([t4])
           
                   cls.r1 = Report.objects.create(name='r1', creator=cls.a1)
          -        Report.objects.create(name='r2', creator=a3)
          +        Report.objects.create(name='r2', creator=cls.a3)
                   Report.objects.create(name='r3')
           
                   # Ordering by 'rank' gives us rank2, rank1, rank3. Ordering by the Meta.ordering
          @@ -1210,6 +1210,12 @@ def test_excluded_intermediary_m2m_table_joined(self):
                       [],
                   )
           
          +    def test_field_with_filterable(self):
          +        self.assertSequenceEqual(
          +            Author.objects.filter(extra=self.e2),
          +            [self.a3, self.a4],
          +        )
          +
           
           class Queries2Tests(TestCase):
               @classmethod
          PATCH_EOF

      - name: Run Tests
        shell: "bash -l {0}"
        run: |
          set -euo pipefail
          source "$(conda info --base)/etc/profile.d/conda.sh"
          conda activate "$CONDA_ENV"
          sed -i '/en_US.UTF-8/s/^# //g' /etc/locale.gen && locale-gen
          export LANG=en_US.UTF-8
          export LANGUAGE=en_US:en
          export LC_ALL=en_US.UTF-8
          FAIL_TO_PASS_PATH=/tmp/fail_to_pass.json
          PASS_TO_PASS_PATH=/tmp/pass_to_pass.json
          TEST_DIRECTIVES_PATH=/tmp/test_directives.json
          TEST_RESULTS_PATH=/tmp/test_results.txt
          cat <<'FAIL_EOF' > "$FAIL_TO_PASS_PATH"
          ["test_field_with_filterable (queries.tests.Queries1Tests)", "test_ticket8439 (queries.tests.Queries1Tests)"]
          FAIL_EOF
