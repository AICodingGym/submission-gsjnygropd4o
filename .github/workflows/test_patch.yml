name: SWE-bench Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-22.04
    timeout-minutes: 240
    env:
      INSTANCE_ID: "django__django-13195"
      REPO: "django/django"
      VERSION: "3.2"
      BASE_COMMIT: "156a2138db20abc89933121e4ff2ee2ce56a173a"
      ENV_SETUP_COMMIT: "65dfb06a1ab56c238cc80f5e1c31f61210c4577d"
      TEST_CMD: './tests/runtests.py --verbosity 2 --settings=test_sqlite --parallel 1'
      TEST_FILES: 'tests/messages_tests/test_cookie.py tests/responses/test_cookie.py tests/sessions_tests/tests.py'
      CONDA_ENV: "testbed"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          fetch-tags: false

      - name: Setup Miniconda
        uses: conda-incubator/setup-miniconda@v3
        with:
          auto-activate-base: false
          miniforge-variant: Miniforge3
          python-version: "3.6"

      - name: Git Safe Directory
        shell: "bash -l {0}"
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Create Conda Environment
        shell: "bash -l {0}"
        run: |
          set -euo pipefail
          source "$(conda info --base)/etc/profile.d/conda.sh"
          if [ "$ENV_SETUP_COMMIT" != "$BASE_COMMIT" ]; then
            if ! git cat-file -e "$ENV_SETUP_COMMIT^{commit}" 2>/dev/null; then
              echo "ENV_SETUP_COMMIT not found locally, fetching from upstream..."
              git fetch --depth=1 "https://github.com/$REPO.git" "$ENV_SETUP_COMMIT" || true
            fi
            if git cat-file -e "$ENV_SETUP_COMMIT^{commit}" 2>/dev/null; then
              git checkout "$ENV_SETUP_COMMIT"
            else
              echo "ENV_SETUP_COMMIT still missing; skipping checkout"
            fi
          fi
          cat <<'ENV_EOF' > /tmp/environment.yml
          name: testbed
          channels:
            - defaults
            - conda-forge
          dependencies:
            - _libgcc_mutex=0.1=main
            - _openmp_mutex=5.1=1_gnu
            - ca-certificates=2024.9.24=h06a4308_0
            - certifi=2021.5.30=py36h06a4308_0
            - ld_impl_linux-64=2.40=h12ee557_0
            - libffi=3.3=he6710b0_2
            - libgcc-ng=11.2.0=h1234567_1
            - libgomp=11.2.0=h1234567_1
            - libstdcxx-ng=11.2.0=h1234567_1
            - ncurses=6.4=h6a678d5_0
            - openssl=1.1.1w=h7f8727e_0
            - pip=21.2.2=py36h06a4308_0
            - python=3.6.13=h12debd9_1
            - readline=8.2=h5eee18b_0
            - setuptools=58.0.4=py36h06a4308_0
            - sqlite=3.45.3=h5eee18b_0
            - tk=8.6.14=h39e8969_0
            - wheel=0.37.1=pyhd3eb1b0_0
            - xz=5.4.6=h5eee18b_1
            - zlib=1.2.13=h5eee18b_1
            - pip:
                - aiohttp==3.8.6
                - aiosignal==1.2.0
                - argon2-cffi==21.3.0
                - argon2-cffi-bindings==21.2.0
                - asgiref==3.4.1
                - async-timeout==4.0.2
                - asynctest==0.13.0
                - attrs==22.2.0
                - backports-zoneinfo==0.2.1
                - bcrypt==4.0.1
                - cffi==1.15.1
                - charset-normalizer==2.0.12
                - dataclasses==0.8
                - docutils==0.18.1
                - frozenlist==1.2.0
                - geoip2==4.6.0
                - idna==3.10
                - idna-ssl==1.1.0
                - importlib-resources==5.4.0
                - jinja2==3.0.3
                - markupsafe==2.0.1
                - maxminddb==2.2.0
                - multidict==5.2.0
                - numpy==1.19.5
                - pillow==8.4.0
                - pycparser==2.21
                - pylibmc==1.6.3
                - pymemcache==3.5.2
                - python-memcached==1.62
                - pytz==2024.2
                - pywatchman==1.4.1
                - pyyaml==6.0.1
                - requests==2.27.1
                - selenium==3.141.0
                - six==1.16.0
                - sqlparse==0.4.4
                - tblib==1.7.0
                - typing-extensions==4.1.1
                - tzdata==2024.2
                - urllib3==1.26.20
                - yarl==1.7.2
                - zipp==3.6.0
          ENV_EOF
          conda env create --file /tmp/environment.yml
          conda activate "$CONDA_ENV"
          rm /tmp/environment.yml

      - name: Checkout Trigger Commit
        shell: "bash -l {0}"
        run: |
          set -euo pipefail
          if ! git cat-file -e "$BASE_COMMIT^{commit}" 2>/dev/null; then
            git fetch --depth=1 "https://github.com/$REPO.git" "$BASE_COMMIT" || true
          fi
          if ! git cat-file -e "$GITHUB_SHA^{commit}" 2>/dev/null; then
            git fetch --depth=1 "https://github.com/$REPO.git" "$GITHUB_SHA" || true
          fi
          git checkout "$GITHUB_SHA"

      - name: Install Repo
        shell: "bash -l {0}"
        run: |
          set -euo pipefail
          source "$(conda info --base)/etc/profile.d/conda.sh"
          conda activate "$CONDA_ENV"
          git fetch --tags "https://github.com/$REPO.git" || true
          TARGET_TIMESTAMP=$(git show -s --format=%ci "$BASE_COMMIT")
          git tag -l | while read tag; do TAG_COMMIT=$(git rev-list -n 1 "$tag"); TAG_TIME=$(git show -s --format=%ci "$TAG_COMMIT"); if [[ "$TAG_TIME" > "$TARGET_TIMESTAMP" ]]; then git tag -d "$tag"; fi; done
          python -m pip install -e .

      - name: Apply Test Patch
        shell: "bash -l {0}"
        run: |
          set -euo pipefail
          git apply --verbose --reject - <<'PATCH_EOF'
          diff --git a/tests/messages_tests/test_cookie.py b/tests/messages_tests/test_cookie.py
          --- a/tests/messages_tests/test_cookie.py
          +++ b/tests/messages_tests/test_cookie.py
          @@ -1,5 +1,6 @@
           import json
           
          +from django.conf import settings
           from django.contrib.messages import constants
           from django.contrib.messages.storage.base import Message
           from django.contrib.messages.storage.cookie import (
          @@ -85,6 +86,10 @@ def test_cookie_setings(self):
                   self.assertEqual(response.cookies['messages'].value, '')
                   self.assertEqual(response.cookies['messages']['domain'], '.example.com')
                   self.assertEqual(response.cookies['messages']['expires'], 'Thu, 01 Jan 1970 00:00:00 GMT')
          +        self.assertEqual(
          +            response.cookies['messages']['samesite'],
          +            settings.SESSION_COOKIE_SAMESITE,
          +        )
           
               def test_get_bad_cookie(self):
                   request = self.get_request()
          diff --git a/tests/responses/test_cookie.py b/tests/responses/test_cookie.py
          --- a/tests/responses/test_cookie.py
          +++ b/tests/responses/test_cookie.py
          @@ -105,6 +105,7 @@ def test_default(self):
                   self.assertEqual(cookie['path'], '/')
                   self.assertEqual(cookie['secure'], '')
                   self.assertEqual(cookie['domain'], '')
          +        self.assertEqual(cookie['samesite'], '')
           
               def test_delete_cookie_secure_prefix(self):
                   """
          @@ -118,3 +119,14 @@ def test_delete_cookie_secure_prefix(self):
                           cookie_name = '__%s-c' % prefix
                           response.delete_cookie(cookie_name)
                           self.assertIs(response.cookies[cookie_name]['secure'], True)
          +
          +    def test_delete_cookie_secure_samesite_none(self):
          +        # delete_cookie() sets the secure flag if samesite='none'.
          +        response = HttpResponse()
          +        response.delete_cookie('c', samesite='none')
          +        self.assertIs(response.cookies['c']['secure'], True)
          +
          +    def test_delete_cookie_samesite(self):
          +        response = HttpResponse()
          +        response.delete_cookie('c', samesite='lax')
          +        self.assertEqual(response.cookies['c']['samesite'], 'lax')
          diff --git a/tests/sessions_tests/tests.py b/tests/sessions_tests/tests.py
          --- a/tests/sessions_tests/tests.py
          +++ b/tests/sessions_tests/tests.py
          @@ -758,8 +758,9 @@ def response_ending_session(request):
                   #  Set-Cookie: sessionid=; expires=Thu, 01 Jan 1970 00:00:00 GMT; Max-Age=0; Path=/
                   self.assertEqual(
                       'Set-Cookie: {}=""; expires=Thu, 01 Jan 1970 00:00:00 GMT; '
          -            'Max-Age=0; Path=/'.format(
          +            'Max-Age=0; Path=/; SameSite={}'.format(
                           settings.SESSION_COOKIE_NAME,
          +                settings.SESSION_COOKIE_SAMESITE,
                       ),
                       str(response.cookies[settings.SESSION_COOKIE_NAME])
                   )
          @@ -789,8 +790,9 @@ def response_ending_session(request):
                   #              Path=/example/
                   self.assertEqual(
                       'Set-Cookie: {}=""; Domain=.example.local; expires=Thu, '
          -            '01 Jan 1970 00:00:00 GMT; Max-Age=0; Path=/example/'.format(
          +            '01 Jan 1970 00:00:00 GMT; Max-Age=0; Path=/example/; SameSite={}'.format(
                           settings.SESSION_COOKIE_NAME,
          +                settings.SESSION_COOKIE_SAMESITE,
                       ),
                       str(response.cookies[settings.SESSION_COOKIE_NAME])
                   )
          PATCH_EOF

      - name: Run Tests
        shell: "bash -l {0}"
        run: |
          set -euo pipefail
          source "$(conda info --base)/etc/profile.d/conda.sh"
          conda activate "$CONDA_ENV"
          sed -i '/en_US.UTF-8/s/^# //g' /etc/locale.gen && locale-gen
          export LANG=en_US.UTF-8
          export LANGUAGE=en_US:en
          export LC_ALL=en_US.UTF-8
          FAIL_TO_PASS_PATH=/tmp/fail_to_pass.json
          PASS_TO_PASS_PATH=/tmp/pass_to_pass.json
          TEST_DIRECTIVES_PATH=/tmp/test_directives.json
          TEST_RESULTS_PATH=/tmp/test_results.txt
          cat <<'FAIL_EOF' > "$FAIL_TO_PASS_PATH"
          ["test_delete_cookie_samesite (responses.test_cookie.DeleteCookieTests)", "test_delete_cookie_secure_samesite_none (responses.test_cookie.DeleteCookieTests)", "test_session_delete_on_end (sessions_tests.tests.SessionMiddlewareTests)", "test_session_delete_on_end_with_custom_domain_and_path (sessions_tests.tests.SessionMiddlewareTests)", "test_cookie_setings (messages_tests.test_cookie.CookieTests)"]
          FAIL_EOF
          cat <<'PASS_EOF' > "$PASS_TO_PASS_PATH"
