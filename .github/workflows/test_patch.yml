name: SWE-bench Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-22.04
    timeout-minutes: 240
    env:
      INSTANCE_ID: "matplotlib__matplotlib-13989"
      REPO: "matplotlib/matplotlib"
      VERSION: "3.0"
      BASE_COMMIT: "a3e2897bfaf9eaac1d6649da535c4e721c89fa69"
      ENV_SETUP_COMMIT: "d0628598f8d9ec7b0da6b60e7b29be2067b6ea17"
      TEST_CMD: 'pytest -rA'
      TEST_FILES: 'lib/matplotlib/tests/test_axes.py'
      CONDA_ENV: "testbed"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          fetch-tags: false

      - name: Setup Miniconda
        uses: conda-incubator/setup-miniconda@v3
        with:
          auto-activate-base: false
          miniforge-variant: Miniforge3
          python-version: "3.7"

      - name: Git Safe Directory
        shell: "bash -l {0}"
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Create Conda Environment
        shell: "bash -l {0}"
        run: |
          set -euo pipefail
          source "$(conda info --base)/etc/profile.d/conda.sh"
          if [ "$ENV_SETUP_COMMIT" != "$BASE_COMMIT" ]; then
            if ! git cat-file -e "$ENV_SETUP_COMMIT^{commit}" 2>/dev/null; then
              echo "ENV_SETUP_COMMIT not found locally, fetching from upstream..."
              git fetch --depth=1 "https://github.com/$REPO.git" "$ENV_SETUP_COMMIT" || true
            fi
            if git cat-file -e "$ENV_SETUP_COMMIT^{commit}" 2>/dev/null; then
              git checkout "$ENV_SETUP_COMMIT"
            else
              echo "ENV_SETUP_COMMIT still missing; skipping checkout"
            fi
          fi
          cat <<'ENV_EOF' > /tmp/environment.yml
          name: testbed
          channels:
            - defaults
            - conda-forge
          dependencies:
            - _libgcc_mutex=0.1=main
            - _openmp_mutex=5.1=1_gnu
            - ca-certificates=2025.2.25=h06a4308_0
            - certifi=2022.12.7=py37h06a4308_0
            - ld_impl_linux-64=2.40=h12ee557_0
            - libffi=3.4.4=h6a678d5_1
            - libgcc-ng=11.2.0=h1234567_1
            - libgomp=11.2.0=h1234567_1
            - libstdcxx-ng=11.2.0=h1234567_1
            - ncurses=6.4=h6a678d5_0
            - openssl=1.1.1w=h7f8727e_0
            - pip=22.3.1=py37h06a4308_0
            - python=3.7.16=h7a1cb2a_0
            - readline=8.2=h5eee18b_0
            - setuptools=65.6.3=py37h06a4308_0
            - sqlite=3.45.3=h5eee18b_0
            - tk=8.6.14=h39e8969_0
            - wheel=0.38.4=py37h06a4308_0
            - xz=5.6.4=h5eee18b_1
            - zlib=1.2.13=h5eee18b_1
            - pip:
                - cachetools==5.5.2
                - chardet==5.2.0
                - charset-normalizer==3.4.1
                - codecov==2.1.13
                - colorama==0.4.6
                - coverage==7.2.7
                - cycler==0.11.0
                - distlib==0.3.9
                - exceptiongroup==1.2.2
                - execnet==2.0.2
                - filelock==3.12.2
                - idna==3.10
                - importlib-metadata==6.7.0
                - iniconfig==2.0.0
                - kiwisolver==1.4.5
                - numpy==1.21.6
                - packaging==24.0
                - pillow==9.5.0
                - platformdirs==4.0.0
                - pluggy==1.2.0
                - pyparsing==3.1.4
                - pyproject-api==1.5.3
                - pytest==7.4.4
                - pytest-cov==4.1.0
                - pytest-faulthandler==2.0.1
                - pytest-rerunfailures==13.0
                - pytest-timeout==2.3.1
                - pytest-xdist==3.5.0
                - python-dateutil==2.9.0.post0
                - requests==2.31.0
                - six==1.17.0
                - tomli==2.0.1
                - tornado==6.2
                - tox==4.8.0
                - typing-extensions==4.7.1
                - urllib3==2.0.7
                - virtualenv==20.26.6
                - zipp==3.15.0
          ENV_EOF
          conda env create --file /tmp/environment.yml
          conda activate "$CONDA_ENV"
          rm /tmp/environment.yml
          python -m pip install pytest

      - name: Checkout Trigger Commit
        shell: "bash -l {0}"
        run: |
          set -euo pipefail
          if ! git cat-file -e "$BASE_COMMIT^{commit}" 2>/dev/null; then
            git fetch --depth=1 "https://github.com/$REPO.git" "$BASE_COMMIT" || true
          fi
          if ! git cat-file -e "$GITHUB_SHA^{commit}" 2>/dev/null; then
            git fetch --depth=1 "https://github.com/$REPO.git" "$GITHUB_SHA" || true
          fi
          git checkout "$GITHUB_SHA"

      - name: Install Repo
        shell: "bash -l {0}"
        run: |
          set -euo pipefail
          source "$(conda info --base)/etc/profile.d/conda.sh"
          conda activate "$CONDA_ENV"
          git fetch --tags "https://github.com/$REPO.git" || true
          TARGET_TIMESTAMP=$(git show -s --format=%ci "$BASE_COMMIT")
          git tag -l | while read tag; do TAG_COMMIT=$(git rev-list -n 1 "$tag"); TAG_TIME=$(git show -s --format=%ci "$TAG_COMMIT"); if [[ "$TAG_TIME" > "$TARGET_TIMESTAMP" ]]; then git tag -d "$tag"; fi; done
          sudo apt-get -y update && sudo apt-get -y upgrade && sudo apt-get install -y imagemagick ffmpeg libfreetype6-dev pkg-config
          QHULL_URL="http://www.qhull.org/download/qhull-2020-src-8.0.2.tgz"
          QHULL_TAR="/tmp/qhull-2020-src-8.0.2.tgz"
          QHULL_BUILD_DIR="$GITHUB_WORKSPACE/build"
          wget -O "$QHULL_TAR" "$QHULL_URL"
          mkdir -p "$QHULL_BUILD_DIR"
          tar -xvzf "$QHULL_TAR" -C "$QHULL_BUILD_DIR"
          python -m pip install -e .

      - name: Apply Test Patch
        shell: "bash -l {0}"
        run: |
          set -euo pipefail
          git apply --verbose --reject - <<'PATCH_EOF'
          diff --git a/lib/matplotlib/tests/test_axes.py b/lib/matplotlib/tests/test_axes.py
          --- a/lib/matplotlib/tests/test_axes.py
          +++ b/lib/matplotlib/tests/test_axes.py
          @@ -6369,3 +6369,10 @@ def test_hist_nan_data():
           
               assert np.allclose(bins, nanbins)
               assert np.allclose(edges, nanedges)
          +
          +
          +def test_hist_range_and_density():
          +    _, bins, _ = plt.hist(np.random.rand(10), "auto",
          +                          range=(0, 1), density=True)
          +    assert bins[0] == 0
          +    assert bins[-1] == 1
          PATCH_EOF

      - name: Run Tests
        shell: "bash -l {0}"
        run: |
          set -euo pipefail
          source "$(conda info --base)/etc/profile.d/conda.sh"
          conda activate "$CONDA_ENV"
          FAIL_TO_PASS_PATH=/tmp/fail_to_pass.json
          PASS_TO_PASS_PATH=/tmp/pass_to_pass.json
          TEST_DIRECTIVES_PATH=/tmp/test_directives.json
          TEST_RESULTS_PATH=/tmp/test_results.txt
          cat <<'FAIL_EOF' > "$FAIL_TO_PASS_PATH"
          [
            "lib/matplotlib/tests/test_axes.py::test_hist_range_and_density"
          ]
          FAIL_EOF
