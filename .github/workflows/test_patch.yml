name: SWE-bench Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-22.04
    timeout-minutes: 240
    env:
      INSTANCE_ID: "astropy__astropy-13977"
      REPO: "astropy/astropy"
      VERSION: "5.1"
      BASE_COMMIT: "5250b2442501e6c671c6b380536f1edb352602d1"
      ENV_SETUP_COMMIT: "5f74eacbcc7fff707a44d8eb58adaa514cb7dcb5"
      TEST_CMD: 'pytest -rA'
      TEST_FILES: 'astropy/units/tests/test_quantity.py astropy/units/tests/test_quantity_ufuncs.py'
      CONDA_ENV: "testbed"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          fetch-tags: false

      - name: Setup Miniconda
        uses: conda-incubator/setup-miniconda@v3
        with:
          auto-activate-base: false
          miniforge-variant: Miniforge3
          python-version: "3.9"

      - name: Git Safe Directory
        shell: "bash -l {0}"
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Create Conda Environment
        shell: "bash -l {0}"
        run: |
          set -euo pipefail
          source "$(conda info --base)/etc/profile.d/conda.sh"
          if [ "$ENV_SETUP_COMMIT" != "$BASE_COMMIT" ]; then
            if ! git cat-file -e "$ENV_SETUP_COMMIT^{commit}" 2>/dev/null; then
              echo "ENV_SETUP_COMMIT not found locally, fetching from upstream..."
              git fetch --depth=1 "https://github.com/$REPO.git" "$ENV_SETUP_COMMIT" || true
            fi
            if git cat-file -e "$ENV_SETUP_COMMIT^{commit}" 2>/dev/null; then
              git checkout "$ENV_SETUP_COMMIT"
            else
              echo "ENV_SETUP_COMMIT still missing; skipping checkout"
            fi
          fi
          cat <<'ENV_EOF' > /tmp/environment.yml
          name: testbed
          channels:
            - defaults
            - conda-forge
          dependencies:
            - _libgcc_mutex=0.1=main
            - _openmp_mutex=5.1=1_gnu
            - ca-certificates=2024.9.24=h06a4308_0
            - ld_impl_linux-64=2.40=h12ee557_0
            - libffi=3.4.4=h6a678d5_1
            - libgcc-ng=11.2.0=h1234567_1
            - libgomp=11.2.0=h1234567_1
            - libstdcxx-ng=11.2.0=h1234567_1
            - ncurses=6.4=h6a678d5_0
            - openssl=3.0.15=h5eee18b_0
            - pip=24.2=py39h06a4308_0
            - python=3.9.20=he870216_1
            - readline=8.2=h5eee18b_0
            - sqlite=3.45.3=h5eee18b_0
            - tk=8.6.14=h39e8969_0
            - tzdata=2024b=h04d1e81_0
            - wheel=0.44.0=py39h06a4308_0
            - xz=5.4.6=h5eee18b_1
            - zlib=1.2.13=h5eee18b_1
            - pip:
                - attrs==23.1.0
                - coverage==7.6.2
                - exceptiongroup==1.1.3
                - execnet==2.0.2
                - hypothesis==6.82.6
                - iniconfig==2.0.0
                - numpy==1.25.2
                - packaging==23.1
                - pluggy==1.3.0
                - psutil==5.9.5
                - pyerfa==2.0.0.3
                - pytest==7.4.0
                - pytest-arraydiff==0.5.0
                - pytest-astropy==0.10.0
                - pytest-astropy-header==0.2.2
                - pytest-cov==4.1.0
                - pytest-doctestplus==1.0.0
                - pytest-filter-subpackage==0.1.2
                - pytest-mock==3.11.1
                - pytest-openfiles==0.5.0
                - pytest-remotedata==0.4.0
                - pytest-xdist==3.3.1
                - pyyaml==6.0.1
                - setuptools==68.0.0
                - sortedcontainers==2.4.0
                - tomli==2.0.1
          ENV_EOF
          conda env create --file /tmp/environment.yml
          conda activate "$CONDA_ENV"
          rm /tmp/environment.yml
          python -m pip install attrs==23.1.0 exceptiongroup==1.1.3 execnet==2.0.2 hypothesis==6.82.6 iniconfig==2.0.0 numpy==1.25.2 packaging==23.1 pluggy==1.3.0 psutil==5.9.5 pyerfa==2.0.0.3 pytest-arraydiff==0.5.0 pytest-astropy-header==0.2.2 pytest-astropy==0.10.0 pytest-cov==4.1.0 pytest-doctestplus==1.0.0 pytest-filter-subpackage==0.1.2 pytest-mock==3.11.1 pytest-openfiles==0.5.0 pytest-remotedata==0.4.0 pytest-xdist==3.3.1 pytest==7.4.0 PyYAML==6.0.1 setuptools==68.0.0 sortedcontainers==2.4.0 tomli==2.0.1

      - name: Checkout Trigger Commit
        shell: "bash -l {0}"
        run: |
          set -euo pipefail
          if ! git cat-file -e "$BASE_COMMIT^{commit}" 2>/dev/null; then
            git fetch --depth=1 "https://github.com/$REPO.git" "$BASE_COMMIT" || true
          fi
          if ! git cat-file -e "$GITHUB_SHA^{commit}" 2>/dev/null; then
            git fetch --depth=1 "https://github.com/$REPO.git" "$GITHUB_SHA" || true
          fi
          git checkout "$GITHUB_SHA"

      - name: Install Repo
        shell: "bash -l {0}"
        run: |
          set -euo pipefail
          source "$(conda info --base)/etc/profile.d/conda.sh"
          conda activate "$CONDA_ENV"
          git fetch --tags "https://github.com/$REPO.git" || true
          TARGET_TIMESTAMP=$(git show -s --format=%ci "$BASE_COMMIT")
          git tag -l | while read tag; do TAG_COMMIT=$(git rev-list -n 1 "$tag"); TAG_TIME=$(git show -s --format=%ci "$TAG_COMMIT"); if [[ "$TAG_TIME" > "$TARGET_TIMESTAMP" ]]; then git tag -d "$tag"; fi; done
          sed -i 's/requires = \["setuptools",/requires = \["setuptools==68.0.0",/' pyproject.toml
          python -m pip install -e .[test] --verbose

      - name: Apply Test Patch
        shell: "bash -l {0}"
        run: |
          set -euo pipefail
          git apply --verbose --reject - <<'PATCH_EOF'
          diff --git a/astropy/units/tests/test_quantity.py b/astropy/units/tests/test_quantity.py
          --- a/astropy/units/tests/test_quantity.py
          +++ b/astropy/units/tests/test_quantity.py
          @@ -505,11 +505,10 @@ def test_incompatible_units(self):
           
               def test_non_number_type(self):
                   q1 = u.Quantity(11.412, unit=u.meter)
          -        with pytest.raises(TypeError) as exc:
          +        with pytest.raises(
          +            TypeError, match=r"Unsupported operand type\(s\) for ufunc .*"
          +        ):
                       q1 + {"a": 1}
          -        assert exc.value.args[0].startswith(
          -            "Unsupported operand type(s) for ufunc add:"
          -        )
           
                   with pytest.raises(TypeError):
                       q1 + u.meter
          diff --git a/astropy/units/tests/test_quantity_ufuncs.py b/astropy/units/tests/test_quantity_ufuncs.py
          --- a/astropy/units/tests/test_quantity_ufuncs.py
          +++ b/astropy/units/tests/test_quantity_ufuncs.py
          @@ -2,6 +2,7 @@
           # returns quantities with the right units, or raises exceptions.
           
           import concurrent.futures
          +import dataclasses
           import warnings
           from collections import namedtuple
           
          @@ -1294,6 +1295,125 @@ def test_two_argument_ufunc_outer(self):
                   assert np.all(s13_greater_outer == check13_greater_outer)
           
           
          +@dataclasses.dataclass
          +class DuckQuantity1:
          +    data: u.Quantity
          +
          +
          +@dataclasses.dataclass
          +class DuckQuantity2(DuckQuantity1):
          +    @property
          +    def unit(self) -> u.UnitBase:
          +        return self.data.unit
          +
          +
          +@dataclasses.dataclass(eq=False)
          +class DuckQuantity3(DuckQuantity2):
          +    def __array_ufunc__(self, function, method, *inputs, **kwargs):
          +
          +        inputs = [inp.data if isinstance(inp, type(self)) else inp for inp in inputs]
          +
          +        if "out" in kwargs:
          +            out = kwargs["out"]
          +        else:
          +            out = None
          +
          +        kwargs_copy = {}
          +        for k in kwargs:
          +            kwarg = kwargs[k]
          +            if isinstance(kwarg, type(self)):
          +                kwargs_copy[k] = kwarg.data
          +            elif isinstance(kwarg, (list, tuple)):
          +                kwargs_copy[k] = type(kwarg)(
          +                    item.data if isinstance(item, type(self)) else item
          +                    for item in kwarg
          +                )
          +            else:
          +                kwargs_copy[k] = kwarg
          +        kwargs = kwargs_copy
          +
          +        for inp in inputs:
          +            if isinstance(inp, np.ndarray):
          +                result = inp.__array_ufunc__(function, method, *inputs, **kwargs)
          +                if result is not NotImplemented:
          +                    if out is None:
          +                        return type(self)(result)
          +                    else:
          +                        if function.nout == 1:
          +                            return out[0]
          +                        else:
          +                            return out
          +
          +        return NotImplemented
          +
          +
          +class TestUfuncReturnsNotImplemented:
          +    @pytest.mark.parametrize("ufunc", (np.negative, np.abs))
          +    class TestUnaryUfuncs:
          +        @pytest.mark.parametrize(
          +            "duck_quantity",
          +            [DuckQuantity1(1 * u.mm), DuckQuantity2(1 * u.mm)],
          +        )
          +        def test_basic(self, ufunc, duck_quantity):
          +            with pytest.raises(TypeError, match="bad operand type for .*"):
          +                ufunc(duck_quantity)
          +
          +        @pytest.mark.parametrize(
          +            "duck_quantity", [DuckQuantity3(1 * u.mm), DuckQuantity3([1, 2] * u.mm)]
          +        )
          +        @pytest.mark.parametrize("out", [None, "empty"])
          +        def test_full(self, ufunc, duck_quantity, out):
          +            out_expected = out
          +            if out == "empty":
          +                out = type(duck_quantity)(np.empty_like(ufunc(duck_quantity.data)))
          +                out_expected = np.empty_like(ufunc(duck_quantity.data))
          +
          +            result = ufunc(duck_quantity, out=out)
          +            if out is not None:
          +                assert result is out
          +
          +            result_expected = ufunc(duck_quantity.data, out=out_expected)
          +            assert np.all(result.data == result_expected)
          +
          +    @pytest.mark.parametrize("ufunc", (np.add, np.multiply, np.less))
          +    @pytest.mark.parametrize("quantity", (1 * u.m, [1, 2] * u.m))
          +    class TestBinaryUfuncs:
          +        @pytest.mark.parametrize(
          +            "duck_quantity",
          +            [DuckQuantity1(1 * u.mm), DuckQuantity2(1 * u.mm)],
          +        )
          +        def test_basic(self, ufunc, quantity, duck_quantity):
          +            with pytest.raises(
          +                (TypeError, ValueError),
          +                match=(
          +                    r"(Unsupported operand type\(s\) for ufunc .*)|"
          +                    r"(unsupported operand type\(s\) for .*)|"
          +                    r"(Value not scalar compatible or convertible to an int, float, or complex array)"
          +                ),
          +            ):
          +                ufunc(quantity, duck_quantity)
          +
          +        @pytest.mark.parametrize(
          +            "duck_quantity",
          +            [DuckQuantity3(1 * u.mm), DuckQuantity3([1, 2] * u.mm)],
          +        )
          +        @pytest.mark.parametrize("out", [None, "empty"])
          +        def test_full(self, ufunc, quantity, duck_quantity, out):
          +            out_expected = out
          +            if out == "empty":
          +                out = type(duck_quantity)(
          +                    np.empty_like(ufunc(quantity, duck_quantity.data))
          +                )
          +                out_expected = np.empty_like(ufunc(quantity, duck_quantity.data))
          +
          +            result = ufunc(quantity, duck_quantity, out=out)
          +            if out is not None:
          +                assert result is out
          +
          +            result_expected = ufunc(quantity, duck_quantity.data, out=out_expected)
          +            assert np.all(result.data == result_expected)
          +
          +
           if HAS_SCIPY:
               from scipy import special as sps
           
          PATCH_EOF

