name: SWE-bench Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-22.04
    timeout-minutes: 240
    env:
      INSTANCE_ID: "scikit-learn__scikit-learn-26323"
      REPO: "scikit-learn/scikit-learn"
      VERSION: "1.3"
      BASE_COMMIT: "586f4318ffcdfbd9a1093f35ad43e81983740b66"
      ENV_SETUP_COMMIT: "1e8a5b833d1b58f3ab84099c4582239af854b23a"
      TEST_CMD: 'pytest -rA'
      TEST_FILES: 'sklearn/compose/tests/test_column_transformer.py'
      CONDA_ENV: "testbed"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          fetch-tags: false

      - name: Setup Miniconda
        uses: conda-incubator/setup-miniconda@v3
        with:
          auto-activate-base: false
          miniforge-variant: Miniforge3
          python-version: "3.9"

      - name: Git Safe Directory
        shell: "bash -l {0}"
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Create Conda Environment
        shell: "bash -l {0}"
        run: |
          set -euo pipefail
          source "$(conda info --base)/etc/profile.d/conda.sh"
          if [ "$ENV_SETUP_COMMIT" != "$BASE_COMMIT" ]; then
            if ! git cat-file -e "$ENV_SETUP_COMMIT^{commit}" 2>/dev/null; then
              echo "ENV_SETUP_COMMIT not found locally, fetching from upstream..."
              git fetch --depth=1 "https://github.com/$REPO.git" "$ENV_SETUP_COMMIT" || true
            fi
            if git cat-file -e "$ENV_SETUP_COMMIT^{commit}" 2>/dev/null; then
              git checkout "$ENV_SETUP_COMMIT"
            else
              echo "ENV_SETUP_COMMIT still missing; skipping checkout"
            fi
          fi
          cat <<'ENV_EOF' > /tmp/environment.yml
          name: testbed
