                - pre-commit==2.21.0
                - py==1.11.0
                - py-cpuinfo==9.0.0
                - pycodestyle==2.9.1
                - pyflakes==2.5.0
                - pyproject-api==1.8.0
                - pytest==7.4.4
                - pytest-benchmark==4.0.0
                - pytest-cov==3.0.0
                - pytest-forked==1.6.0
                - pytest-profiling==1.7.0
                - pytest-timeout==2.3.1
                - pytest-xdist==2.5.0
                - pyyaml==6.0.2
                - requests==2.32.3
                - schema==0.7.7
                - six==1.16.0
                - tabulate==0.8.10
                - tbump==6.9.0
                - tomli==2.0.2
                - tomlkit==0.13.2
                - towncrier==22.12.0
                - tox==4.23.2
