           )
          +from sphinx.ext.intersphinx import load_mappings, normalize_intersphinx_mapping
           
           
           @pytest.mark.sphinx(buildername="html", testroot="inheritance")
          @@ -135,12 +137,33 @@ def new_run(self):
                   ]
           
           
