name: SWE-bench Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-22.04
    timeout-minutes: 240
    env:
      INSTANCE_ID: "django__django-14631"
      REPO: "django/django"
      VERSION: "4.0"
      BASE_COMMIT: "84400d2e9db7c51fee4e9bb04c028f665b8e7624"
      ENV_SETUP_COMMIT: "475cffd1d64c690cdad16ede4d5e81985738ceb4"
      TEST_CMD: './tests/runtests.py --verbosity 2 --settings=test_sqlite --parallel 1'
      TEST_FILES: 'tests/forms_tests/tests/test_forms.py'
      CONDA_ENV: "testbed"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          fetch-tags: false

      - name: Setup Miniconda
        uses: conda-incubator/setup-miniconda@v3
        with:
          auto-activate-base: false
          miniforge-variant: Miniforge3
          python-version: "3.8"

      - name: Git Safe Directory
        shell: "bash -l {0}"
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Create Conda Environment
        shell: "bash -l {0}"
        run: |
          set -euo pipefail
          source "$(conda info --base)/etc/profile.d/conda.sh"
          if [ "$ENV_SETUP_COMMIT" != "$BASE_COMMIT" ]; then
            if ! git cat-file -e "$ENV_SETUP_COMMIT^{commit}" 2>/dev/null; then
              echo "ENV_SETUP_COMMIT not found locally, fetching from upstream..."
              git fetch --depth=1 "https://github.com/$REPO.git" "$ENV_SETUP_COMMIT" || true
            fi
            if git cat-file -e "$ENV_SETUP_COMMIT^{commit}" 2>/dev/null; then
              git checkout "$ENV_SETUP_COMMIT"
            else
              echo "ENV_SETUP_COMMIT still missing; skipping checkout"
            fi
          fi
          cat <<'ENV_EOF' > /tmp/environment.yml
          name: testbed
          channels:
            - defaults
            - conda-forge
          dependencies:
            - _libgcc_mutex=0.1=main
            - _openmp_mutex=5.1=1_gnu
            - ca-certificates=2024.9.24=h06a4308_0
            - ld_impl_linux-64=2.40=h12ee557_0
            - libffi=3.4.4=h6a678d5_1
            - libgcc-ng=11.2.0=h1234567_1
            - libgomp=11.2.0=h1234567_1
            - libstdcxx-ng=11.2.0=h1234567_1
            - ncurses=6.4=h6a678d5_0
            - openssl=3.0.15=h5eee18b_0
            - pip=24.2=py38h06a4308_0
            - python=3.8.20=he870216_0
            - readline=8.2=h5eee18b_0
            - setuptools=75.1.0=py38h06a4308_0
            - sqlite=3.45.3=h5eee18b_0
            - tk=8.6.14=h39e8969_0
            - wheel=0.44.0=py38h06a4308_0
            - xz=5.4.6=h5eee18b_1
            - zlib=1.2.13=h5eee18b_1
            - pip:
                - aiohappyeyeballs==2.4.3
                - aiohttp==3.10.9
                - aiosignal==1.3.1
                - argon2-cffi==23.1.0
                - argon2-cffi-bindings==21.2.0
                - asgiref==3.8.1
                - async-timeout==4.0.3
                - attrs==24.2.0
                - backports-zoneinfo==0.2.1
                - bcrypt==4.2.0
                - certifi==2024.8.30
                - cffi==1.17.1
                - charset-normalizer==3.4.0
                - docutils==0.20.1
                - exceptiongroup==1.2.2
                - frozenlist==1.4.1
                - geoip2==4.8.0
                - h11==0.14.0
                - idna==3.10
                - jinja2==3.1.4
                - markupsafe==2.1.5
                - maxminddb==2.6.2
                - multidict==6.1.0
                - numpy==1.24.4
                - outcome==1.3.0.post0
                - pillow==10.4.0
                - propcache==0.2.0
                - pycparser==2.22
                - pylibmc==1.6.3
                - pymemcache==4.0.0
                - pysocks==1.7.1
                - python-memcached==1.62
                - pytz==2024.2
                - pywatchman==2.0.0
                - pyyaml==6.0.2
                - redis==5.1.1
                - requests==2.32.3
                - selenium==4.25.0
                - sniffio==1.3.1
                - sortedcontainers==2.4.0
                - sqlparse==0.5.1
                - tblib==3.0.0
                - trio==0.26.2
                - trio-websocket==0.11.1
                - typing-extensions==4.12.2
                - tzdata==2024.2
                - urllib3==2.2.3
                - websocket-client==1.8.0
                - wsproto==1.2.0
                - yarl==1.14.0
          ENV_EOF
          conda env create --file /tmp/environment.yml
          conda activate "$CONDA_ENV"
          rm /tmp/environment.yml

      - name: Checkout Trigger Commit
        shell: "bash -l {0}"
        run: |
          set -euo pipefail
          if ! git cat-file -e "$BASE_COMMIT^{commit}" 2>/dev/null; then
            git fetch --depth=1 "https://github.com/$REPO.git" "$BASE_COMMIT" || true
          fi
          if ! git cat-file -e "$GITHUB_SHA^{commit}" 2>/dev/null; then
            git fetch --depth=1 "https://github.com/$REPO.git" "$GITHUB_SHA" || true
          fi
          git checkout "$GITHUB_SHA"

      - name: Install Repo
        shell: "bash -l {0}"
        run: |
          set -euo pipefail
          source "$(conda info --base)/etc/profile.d/conda.sh"
          conda activate "$CONDA_ENV"
          git fetch --tags "https://github.com/$REPO.git" || true
          TARGET_TIMESTAMP=$(git show -s --format=%ci "$BASE_COMMIT")
          git tag -l | while read tag; do TAG_COMMIT=$(git rev-list -n 1 "$tag"); TAG_TIME=$(git show -s --format=%ci "$TAG_COMMIT"); if [[ "$TAG_TIME" > "$TARGET_TIMESTAMP" ]]; then git tag -d "$tag"; fi; done
          python -m pip install -e .

      - name: Apply Test Patch
        shell: "bash -l {0}"
        run: |
          set -euo pipefail
          git apply --verbose --reject - <<'PATCH_EOF'
          diff --git a/tests/forms_tests/tests/test_forms.py b/tests/forms_tests/tests/test_forms.py
          --- a/tests/forms_tests/tests/test_forms.py
          +++ b/tests/forms_tests/tests/test_forms.py
          @@ -2112,15 +2112,47 @@ class DateTimeForm(Form):
                   self.assertEqual(unbound['hi_without_microsec'].value(), now_no_ms)
                   self.assertEqual(unbound['ti_without_microsec'].value(), now_no_ms)
           
          -    def test_datetime_clean_initial_callable_disabled(self):
          -        now = datetime.datetime(2006, 10, 25, 14, 30, 45, 123456)
          +    def get_datetime_form_with_callable_initial(self, disabled, microseconds=0):
          +        class FakeTime:
          +            def __init__(self):
          +                self.elapsed_seconds = 0
          +
          +            def now(self):
          +                self.elapsed_seconds += 1
          +                return datetime.datetime(
          +                    2006, 10, 25, 14, 30, 45 + self.elapsed_seconds,
          +                    microseconds,
          +                )
           
                   class DateTimeForm(forms.Form):
          -            dt = DateTimeField(initial=lambda: now, disabled=True)
          +            dt = DateTimeField(initial=FakeTime().now, disabled=disabled)
          +
          +        return DateTimeForm({})
          +
          +    def test_datetime_clean_disabled_callable_initial_microseconds(self):
          +        """
          +        Cleaning a form with a disabled DateTimeField and callable initial
          +        removes microseconds.
          +        """
          +        form = self.get_datetime_form_with_callable_initial(
          +            disabled=True, microseconds=123456,
          +        )
          +        self.assertEqual(form.errors, {})
          +        self.assertEqual(form.cleaned_data, {
          +            'dt': datetime.datetime(2006, 10, 25, 14, 30, 46),
          +        })
           
          -        form = DateTimeForm({})
          +    def test_datetime_clean_disabled_callable_initial_bound_field(self):
          +        """
          +        The cleaned value for a form with a disabled DateTimeField and callable
          +        initial matches the bound field's cached initial value.
          +        """
          +        form = self.get_datetime_form_with_callable_initial(disabled=True)
                   self.assertEqual(form.errors, {})
          -        self.assertEqual(form.cleaned_data, {'dt': now})
          +        cleaned = form.cleaned_data['dt']
          +        self.assertEqual(cleaned, datetime.datetime(2006, 10, 25, 14, 30, 46))
          +        bf = form['dt']
          +        self.assertEqual(cleaned, bf.initial)
           
               def test_datetime_changed_data_callable_with_microseconds(self):
                   class DateTimeForm(forms.Form):
          PATCH_EOF

      - name: Run Tests
        shell: "bash -l {0}"
        run: |
          set -euo pipefail
          source "$(conda info --base)/etc/profile.d/conda.sh"
          conda activate "$CONDA_ENV"
          FAIL_TO_PASS_PATH=/tmp/fail_to_pass.json
          PASS_TO_PASS_PATH=/tmp/pass_to_pass.json
          TEST_DIRECTIVES_PATH=/tmp/test_directives.json
          TEST_RESULTS_PATH=/tmp/test_results.txt
          cat <<'FAIL_EOF' > "$FAIL_TO_PASS_PATH"
          ["The cleaned value for a form with a disabled DateTimeField and callable", "Cleaning a form with a disabled DateTimeField and callable initial"]
          FAIL_EOF
          cat <<'PASS_EOF' > "$PASS_TO_PASS_PATH"
