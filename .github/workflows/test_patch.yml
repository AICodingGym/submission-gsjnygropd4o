name: SWE-bench Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-22.04
    timeout-minutes: 240
    env:
      INSTANCE_ID: "django__django-14140"
      REPO: "django/django"
      VERSION: "4.0"
      BASE_COMMIT: "45814af6197cfd8f4dc72ee43b90ecde305a1d5a"
      ENV_SETUP_COMMIT: "475cffd1d64c690cdad16ede4d5e81985738ceb4"
      TEST_CMD: './tests/runtests.py --verbosity 2 --settings=test_sqlite --parallel 1'
      TEST_FILES: 'tests/expressions/tests.py tests/queries/test_q.py tests/queryset_pickle/tests.py'
      CONDA_ENV: "testbed"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          fetch-tags: false

      - name: Setup Miniconda
        uses: conda-incubator/setup-miniconda@v3
        with:
          auto-activate-base: false
          miniforge-variant: Miniforge3
          python-version: "3.8"

      - name: Git Safe Directory
        shell: "bash -l {0}"
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Create Conda Environment
        shell: "bash -l {0}"
        run: |
          set -euo pipefail
          source "$(conda info --base)/etc/profile.d/conda.sh"
          if [ "$ENV_SETUP_COMMIT" != "$BASE_COMMIT" ]; then
            if ! git cat-file -e "$ENV_SETUP_COMMIT^{commit}" 2>/dev/null; then
              echo "ENV_SETUP_COMMIT not found locally, fetching from upstream..."
              git fetch --depth=1 "https://github.com/$REPO.git" "$ENV_SETUP_COMMIT" || true
            fi
            if git cat-file -e "$ENV_SETUP_COMMIT^{commit}" 2>/dev/null; then
              git checkout "$ENV_SETUP_COMMIT"
            else
              echo "ENV_SETUP_COMMIT still missing; skipping checkout"
            fi
          fi
          cat <<'ENV_EOF' > /tmp/environment.yml
          name: testbed
          channels:
            - defaults
            - conda-forge
          dependencies:
            - _libgcc_mutex=0.1=main
            - _openmp_mutex=5.1=1_gnu
            - ca-certificates=2024.9.24=h06a4308_0
            - ld_impl_linux-64=2.40=h12ee557_0
            - libffi=3.4.4=h6a678d5_1
            - libgcc-ng=11.2.0=h1234567_1
            - libgomp=11.2.0=h1234567_1
            - libstdcxx-ng=11.2.0=h1234567_1
            - ncurses=6.4=h6a678d5_0
            - openssl=3.0.15=h5eee18b_0
            - pip=24.2=py38h06a4308_0
            - python=3.8.20=he870216_0
            - readline=8.2=h5eee18b_0
            - setuptools=75.1.0=py38h06a4308_0
            - sqlite=3.45.3=h5eee18b_0
            - tk=8.6.14=h39e8969_0
            - wheel=0.44.0=py38h06a4308_0
            - xz=5.4.6=h5eee18b_1
            - zlib=1.2.13=h5eee18b_1
            - pip:
                - aiohappyeyeballs==2.4.3
                - aiohttp==3.10.9
                - aiosignal==1.3.1
                - argon2-cffi==23.1.0
                - argon2-cffi-bindings==21.2.0
                - asgiref==3.8.1
                - async-timeout==4.0.3
                - attrs==24.2.0
                - backports-zoneinfo==0.2.1
                - bcrypt==4.2.0
                - certifi==2024.8.30
                - cffi==1.17.1
                - charset-normalizer==3.4.0
                - docutils==0.20.1
                - exceptiongroup==1.2.2
                - frozenlist==1.4.1
                - geoip2==4.8.0
                - h11==0.14.0
                - idna==3.10
                - jinja2==3.1.4
                - markupsafe==2.1.5
                - maxminddb==2.6.2
                - multidict==6.1.0
                - numpy==1.24.4
                - outcome==1.3.0.post0
                - pillow==10.4.0
                - propcache==0.2.0
                - pycparser==2.22
                - pylibmc==1.6.3
                - pymemcache==4.0.0
                - pysocks==1.7.1
                - python-memcached==1.62
                - pytz==2024.2
                - pywatchman==2.0.0
                - pyyaml==6.0.2
                - redis==5.1.1
                - requests==2.32.3
                - selenium==4.25.0
                - sniffio==1.3.1
                - sortedcontainers==2.4.0
                - sqlparse==0.5.1
                - tblib==3.0.0
                - trio==0.26.2
                - trio-websocket==0.11.1
                - typing-extensions==4.12.2
                - tzdata==2024.2
                - urllib3==2.2.3
                - websocket-client==1.8.0
                - wsproto==1.2.0
                - yarl==1.14.0
          ENV_EOF
          conda env create --file /tmp/environment.yml
          conda activate "$CONDA_ENV"
          rm /tmp/environment.yml

      - name: Checkout Trigger Commit
        shell: "bash -l {0}"
        run: |
          set -euo pipefail
          if ! git cat-file -e "$BASE_COMMIT^{commit}" 2>/dev/null; then
            git fetch --depth=1 "https://github.com/$REPO.git" "$BASE_COMMIT" || true
          fi
          if ! git cat-file -e "$GITHUB_SHA^{commit}" 2>/dev/null; then
            git fetch --depth=1 "https://github.com/$REPO.git" "$GITHUB_SHA" || true
          fi
          git checkout "$GITHUB_SHA"

      - name: Install Repo
        shell: "bash -l {0}"
        run: |
          set -euo pipefail
          source "$(conda info --base)/etc/profile.d/conda.sh"
          conda activate "$CONDA_ENV"
          git fetch --tags "https://github.com/$REPO.git" || true
          TARGET_TIMESTAMP=$(git show -s --format=%ci "$BASE_COMMIT")
          git tag -l | while read tag; do TAG_COMMIT=$(git rev-list -n 1 "$tag"); TAG_TIME=$(git show -s --format=%ci "$TAG_COMMIT"); if [[ "$TAG_TIME" > "$TARGET_TIMESTAMP" ]]; then git tag -d "$tag"; fi; done
          python -m pip install -e .

      - name: Apply Test Patch
        shell: "bash -l {0}"
        run: |
          set -euo pipefail
          git apply --verbose --reject - <<'PATCH_EOF'
          diff --git a/tests/expressions/tests.py b/tests/expressions/tests.py
          --- a/tests/expressions/tests.py
          +++ b/tests/expressions/tests.py
          @@ -833,11 +833,21 @@ def test_boolean_expression_combined_with_empty_Q(self):
                       Q() & Exists(is_poc),
                       Exists(is_poc) | Q(),
                       Q() | Exists(is_poc),
          +            Q(Exists(is_poc)) & Q(),
          +            Q() & Q(Exists(is_poc)),
          +            Q(Exists(is_poc)) | Q(),
          +            Q() | Q(Exists(is_poc)),
                   ]
                   for conditions in tests:
                       with self.subTest(conditions):
                           self.assertCountEqual(Employee.objects.filter(conditions), [self.max])
           
          +    def test_boolean_expression_in_Q(self):
          +        is_poc = Company.objects.filter(point_of_contact=OuterRef('pk'))
          +        self.gmbh.point_of_contact = self.max
          +        self.gmbh.save()
          +        self.assertCountEqual(Employee.objects.filter(Q(Exists(is_poc))), [self.max])
          +
           
           class IterableLookupInnerExpressionsTests(TestCase):
               @classmethod
          diff --git a/tests/queries/test_q.py b/tests/queries/test_q.py
          --- a/tests/queries/test_q.py
          +++ b/tests/queries/test_q.py
          @@ -1,6 +1,8 @@
          -from django.db.models import F, Q
          +from django.db.models import Exists, F, OuterRef, Q
           from django.test import SimpleTestCase
           
          +from .models import Tag
          +
           
           class QTests(SimpleTestCase):
               def test_combine_and_empty(self):
          @@ -39,17 +41,14 @@ def test_deconstruct(self):
                   q = Q(price__gt=F('discounted_price'))
                   path, args, kwargs = q.deconstruct()
                   self.assertEqual(path, 'django.db.models.Q')
          -        self.assertEqual(args, ())
          -        self.assertEqual(kwargs, {'price__gt': F('discounted_price')})
          +        self.assertEqual(args, (('price__gt', F('discounted_price')),))
          +        self.assertEqual(kwargs, {})
           
               def test_deconstruct_negated(self):
                   q = ~Q(price__gt=F('discounted_price'))
                   path, args, kwargs = q.deconstruct()
          -        self.assertEqual(args, ())
          -        self.assertEqual(kwargs, {
          -            'price__gt': F('discounted_price'),
          -            '_negated': True,
          -        })
          +        self.assertEqual(args, (('price__gt', F('discounted_price')),))
          +        self.assertEqual(kwargs, {'_negated': True})
           
               def test_deconstruct_or(self):
                   q1 = Q(price__gt=F('discounted_price'))
          @@ -88,6 +87,13 @@ def test_deconstruct_nested(self):
                   self.assertEqual(args, (Q(price__gt=F('discounted_price')),))
                   self.assertEqual(kwargs, {})
           
          +    def test_deconstruct_boolean_expression(self):
          +        tagged = Tag.objects.filter(category=OuterRef('pk'))
          +        q = Q(Exists(tagged))
          +        _, args, kwargs = q.deconstruct()
          +        self.assertEqual(args, (Exists(tagged),))
          +        self.assertEqual(kwargs, {})
          +
               def test_reconstruct(self):
                   q = Q(price__gt=F('discounted_price'))
                   path, args, kwargs = q.deconstruct()
          diff --git a/tests/queryset_pickle/tests.py b/tests/queryset_pickle/tests.py
          --- a/tests/queryset_pickle/tests.py
          +++ b/tests/queryset_pickle/tests.py
          @@ -172,6 +172,17 @@ def test_pickle_prefetch_related_with_m2m_and_objects_deletion(self):
                   m2ms = pickle.loads(pickle.dumps(m2ms))
                   self.assertSequenceEqual(m2ms, [m2m])
           
          +    def test_pickle_boolean_expression_in_Q__queryset(self):
          +        group = Group.objects.create(name='group')
          +        Event.objects.create(title='event', group=group)
          +        groups = Group.objects.filter(
          +            models.Q(models.Exists(
          +                Event.objects.filter(group_id=models.OuterRef('id')),
          +            )),
          +        )
          +        groups2 = pickle.loads(pickle.dumps(groups))
          +        self.assertSequenceEqual(groups2, [group])
          +
               def test_pickle_exists_queryset_still_usable(self):
                   group = Group.objects.create(name='group')
                   Event.objects.create(title='event', group=group)
          PATCH_EOF

      - name: Run Tests
        shell: "bash -l {0}"
        run: |
          set -euo pipefail
          source "$(conda info --base)/etc/profile.d/conda.sh"
          conda activate "$CONDA_ENV"
          FAIL_TO_PASS_PATH=/tmp/fail_to_pass.json
          PASS_TO_PASS_PATH=/tmp/pass_to_pass.json
          TEST_DIRECTIVES_PATH=/tmp/test_directives.json
          TEST_RESULTS_PATH=/tmp/test_results.txt
          cat <<'FAIL_EOF' > "$FAIL_TO_PASS_PATH"
          ["test_deconstruct (queries.test_q.QTests)", "test_deconstruct_boolean_expression (queries.test_q.QTests)", "test_deconstruct_negated (queries.test_q.QTests)", "test_boolean_expression_combined_with_empty_Q (expressions.tests.BasicExpressionsTests)"]
          FAIL_EOF
          cat <<'PASS_EOF' > "$PASS_TO_PASS_PATH"
