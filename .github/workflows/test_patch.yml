          conda env create --file /tmp/environment.yml
          conda activate "$CONDA_ENV"
          rm /tmp/environment.yml

      - name: Checkout Trigger Commit
        shell: "bash -l {0}"
        run: |
          set -euo pipefail
          if ! git cat-file -e "$BASE_COMMIT^{commit}" 2>/dev/null; then
            git fetch --depth=1 "https://github.com/$REPO.git" "$BASE_COMMIT" || true
          fi
          if ! git cat-file -e "$GITHUB_SHA^{commit}" 2>/dev/null; then
            git fetch --depth=1 "https://github.com/$REPO.git" "$GITHUB_SHA" || true
          fi
          git checkout "$GITHUB_SHA"

      - name: Install Repo
        shell: "bash -l {0}"
        run: |
          set -euo pipefail
          source "$(conda info --base)/etc/profile.d/conda.sh"
          conda activate "$CONDA_ENV"
          git fetch --tags "https://github.com/$REPO.git" || true
          TARGET_TIMESTAMP=$(git show -s --format=%ci "$BASE_COMMIT")
          git tag -l | while read tag; do TAG_COMMIT=$(git rev-list -n 1 "$tag"); TAG_TIME=$(git show -s --format=%ci "$TAG_COMMIT"); if [[ "$TAG_TIME" > "$TARGET_TIMESTAMP" ]]; then git tag -d "$tag"; fi; done
          python -m pip install -e .

      - name: Apply Test Patch
        shell: "bash -l {0}"
        run: |
          set -euo pipefail
          git apply --verbose --reject - <<'PATCH_EOF'
          diff --git a/tests/test_self.py b/tests/test_self.py
          --- a/tests/test_self.py
          +++ b/tests/test_self.py
          @@ -1330,6 +1330,27 @@ def test_recursive_current_dir(self):
                               code=0,
                           )
           
          +    def test_ignore_path_recursive_current_dir(self) -> None:
          +        """Tests that path is normalized before checked that is ignored. GitHub issue #6964"""
          +        with _test_sys_path():
          +            # pytest is including directory HERE/regrtest_data to sys.path which causes
          +            # astroid to believe that directory is a package.
          +            sys.path = [
          +                path
          +                for path in sys.path
          +                if not os.path.basename(path) == "regrtest_data"
          +            ]
          +            with _test_cwd():
          +                os.chdir(join(HERE, "regrtest_data", "directory"))
          +                self._runtest(
          +                    [
          +                        ".",
          +                        "--recursive=y",
          +                        "--ignore-paths=^ignored_subdirectory/.*",
          +                    ],
          +                    code=0,
          +                )
          +
               def test_regression_recursive_current_dir(self):
                   with _test_sys_path():
                       # pytest is including directory HERE/regrtest_data to sys.path which causes
          PATCH_EOF

      - name: Run Tests
        shell: "bash -l {0}"
        run: |
          set -euo pipefail
          source "$(conda info --base)/etc/profile.d/conda.sh"
          conda activate "$CONDA_ENV"
          FAIL_TO_PASS_PATH=/tmp/fail_to_pass.json
          PASS_TO_PASS_PATH=/tmp/pass_to_pass.json
          TEST_DIRECTIVES_PATH=/tmp/test_directives.json
          TEST_RESULTS_PATH=/tmp/test_results.txt
          cat <<'FAIL_EOF' > "$FAIL_TO_PASS_PATH"
          [
            "tests/test_self.py::TestRunTC::test_ignore_path_recursive_current_dir"
          ]
