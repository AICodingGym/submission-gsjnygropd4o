name: SWE-bench Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-22.04
    timeout-minutes: 240
    env:
      INSTANCE_ID: "django__django-16899"
      REPO: "django/django"
      VERSION: "5.0"
      BASE_COMMIT: "d3d173425fc0a1107836da5b4567f1c88253191b"
      ENV_SETUP_COMMIT: "4a72da71001f154ea60906a2f74898d32b7322a7"
      TEST_CMD: './tests/runtests.py --verbosity 2 --settings=test_sqlite --parallel 1'
      TEST_FILES: 'tests/admin_checks/tests.py'
      CONDA_ENV: "testbed"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          fetch-tags: false

      - name: Setup Miniconda
        uses: conda-incubator/setup-miniconda@v3
        with:
          auto-activate-base: false
          miniforge-variant: Miniforge3
          python-version: "3.11"

      - name: Git Safe Directory
        shell: "bash -l {0}"
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Create Conda Environment
        shell: "bash -l {0}"
        run: |
          set -euo pipefail
          source "$(conda info --base)/etc/profile.d/conda.sh"
          if [ "$ENV_SETUP_COMMIT" != "$BASE_COMMIT" ]; then
            if ! git cat-file -e "$ENV_SETUP_COMMIT^{commit}" 2>/dev/null; then
              echo "ENV_SETUP_COMMIT not found locally, fetching from upstream..."
              git fetch --depth=1 "https://github.com/$REPO.git" "$ENV_SETUP_COMMIT" || true
            fi
            if git cat-file -e "$ENV_SETUP_COMMIT^{commit}" 2>/dev/null; then
              git checkout "$ENV_SETUP_COMMIT"
            else
              echo "ENV_SETUP_COMMIT still missing; skipping checkout"
            fi
          fi
          cat <<'ENV_EOF' > /tmp/environment.yml
          name: testbed
          channels:
            - defaults
            - conda-forge
          dependencies:
            - _libgcc_mutex=0.1=main
            - _openmp_mutex=5.1=1_gnu
            - bzip2=1.0.8=h5eee18b_6
            - ca-certificates=2024.9.24=h06a4308_0
            - ld_impl_linux-64=2.40=h12ee557_0
            - libffi=3.4.4=h6a678d5_1
            - libgcc-ng=11.2.0=h1234567_1
            - libgomp=11.2.0=h1234567_1
            - libstdcxx-ng=11.2.0=h1234567_1
            - libuuid=1.41.5=h5eee18b_0
            - ncurses=6.4=h6a678d5_0
            - openssl=3.0.15=h5eee18b_0
            - pip=24.2=py311h06a4308_0
            - python=3.11.10=he870216_0
            - readline=8.2=h5eee18b_0
            - setuptools=75.1.0=py311h06a4308_0
            - sqlite=3.45.3=h5eee18b_0
            - tk=8.6.14=h39e8969_0
            - wheel=0.44.0=py311h06a4308_0
            - xz=5.4.6=h5eee18b_1
            - zlib=1.2.13=h5eee18b_1
            - pip:
                - aiohappyeyeballs==2.4.3
                - aiohttp==3.10.9
                - aiosignal==1.3.1
                - aiosmtpd==1.4.6
                - argon2-cffi==23.1.0
                - argon2-cffi-bindings==21.2.0
                - asgiref==3.8.1
                - atpublic==5.0
                - attrs==24.2.0
                - bcrypt==4.2.0
                - black==24.10.0
                - certifi==2024.8.30
                - cffi==1.17.1
                - charset-normalizer==3.4.0
                - click==8.1.7
                - docutils==0.21.2
                - frozenlist==1.4.1
                - geoip2==4.8.0
                - h11==0.14.0
                - idna==3.10
                - jinja2==3.1.4
                - markupsafe==3.0.1
                - maxminddb==2.6.2
                - multidict==6.1.0
                - mypy-extensions==1.0.0
                - numpy==2.1.2
                - outcome==1.3.0.post0
                - packaging==24.1
                - pathspec==0.12.1
                - pillow==10.4.0
                - platformdirs==4.3.6
                - propcache==0.2.0
                - pycparser==2.22
                - pylibmc==1.6.3
                - pymemcache==4.0.0
                - pysocks==1.7.1
                - pywatchman==2.0.0
                - pyyaml==6.0.2
                - redis==5.1.1
                - requests==2.32.3
                - selenium==4.25.0
                - sniffio==1.3.1
                - sortedcontainers==2.4.0
                - sqlparse==0.5.1
                - tblib==3.0.0
                - trio==0.26.2
                - trio-websocket==0.11.1
                - typing-extensions==4.12.2
                - tzdata==2024.2
                - urllib3==2.2.3
                - websocket-client==1.8.0
                - wsproto==1.2.0
                - yarl==1.14.0
          ENV_EOF
          conda env create --file /tmp/environment.yml
          conda activate "$CONDA_ENV"
          rm /tmp/environment.yml

      - name: Checkout Trigger Commit
        shell: "bash -l {0}"
        run: |
          set -euo pipefail
          if ! git cat-file -e "$BASE_COMMIT^{commit}" 2>/dev/null; then
            git fetch --depth=1 "https://github.com/$REPO.git" "$BASE_COMMIT" || true
          fi
          if ! git cat-file -e "$GITHUB_SHA^{commit}" 2>/dev/null; then
            git fetch --depth=1 "https://github.com/$REPO.git" "$GITHUB_SHA" || true
          fi
          git checkout "$GITHUB_SHA"

      - name: Install Repo
        shell: "bash -l {0}"
        run: |
          set -euo pipefail
          source "$(conda info --base)/etc/profile.d/conda.sh"
          conda activate "$CONDA_ENV"
          git fetch --tags "https://github.com/$REPO.git" || true
          TARGET_TIMESTAMP=$(git show -s --format=%ci "$BASE_COMMIT")
          git tag -l | while read tag; do TAG_COMMIT=$(git rev-list -n 1 "$tag"); TAG_TIME=$(git show -s --format=%ci "$TAG_COMMIT"); if [[ "$TAG_TIME" > "$TARGET_TIMESTAMP" ]]; then git tag -d "$tag"; fi; done
          python -m pip install -e .

      - name: Apply Test Patch
        shell: "bash -l {0}"
        run: |
          set -euo pipefail
          git apply --verbose --reject - <<'PATCH_EOF'
          diff --git a/tests/admin_checks/tests.py b/tests/admin_checks/tests.py
          --- a/tests/admin_checks/tests.py
          +++ b/tests/admin_checks/tests.py
          @@ -798,8 +798,9 @@ class SongAdmin(admin.ModelAdmin):
                   errors = SongAdmin(Song, AdminSite()).check()
                   expected = [
                       checks.Error(
          -                "The value of 'readonly_fields[1]' is not a callable, an attribute "
          -                "of 'SongAdmin', or an attribute of 'admin_checks.Song'.",
          +                "The value of 'readonly_fields[1]' refers to 'nonexistent', which is "
          +                "not a callable, an attribute of 'SongAdmin', or an attribute of "
          +                "'admin_checks.Song'.",
                           obj=SongAdmin,
                           id="admin.E035",
                       )
          @@ -814,8 +815,9 @@ class CityInline(admin.TabularInline):
                   errors = CityInline(State, AdminSite()).check()
                   expected = [
                       checks.Error(
          -                "The value of 'readonly_fields[0]' is not a callable, an attribute "
          -                "of 'CityInline', or an attribute of 'admin_checks.City'.",
          +                "The value of 'readonly_fields[0]' refers to 'i_dont_exist', which is "
          +                "not a callable, an attribute of 'CityInline', or an attribute of "
          +                "'admin_checks.City'.",
                           obj=CityInline,
                           id="admin.E035",
                       )
          PATCH_EOF

      - name: Run Tests
        shell: "bash -l {0}"
        run: |
          set -euo pipefail
          source "$(conda info --base)/etc/profile.d/conda.sh"
          conda activate "$CONDA_ENV"
          FAIL_TO_PASS_PATH=/tmp/fail_to_pass.json
          PASS_TO_PASS_PATH=/tmp/pass_to_pass.json
          TEST_DIRECTIVES_PATH=/tmp/test_directives.json
          TEST_RESULTS_PATH=/tmp/test_results.txt
          cat <<'FAIL_EOF' > "$FAIL_TO_PASS_PATH"
          [
            "test_nonexistent_field (admin_checks.tests.SystemChecksTestCase.test_nonexistent_field)",
            "test_nonexistent_field_on_inline (admin_checks.tests.SystemChecksTestCase.test_nonexistent_field_on_inline)"
          ]
          FAIL_EOF
          cat <<'PASS_EOF' > "$PASS_TO_PASS_PATH"
          [
            "test_admin_check_ignores_import_error_in_middleware (admin_checks.tests.SystemChecksTestCase.test_admin_check_ignores_import_error_in_middleware)",
            "test_allows_checks_relying_on_other_modeladmins (admin_checks.tests.SystemChecksTestCase.test_allows_checks_relying_on_other_modeladmins)",
            "test_app_label_in_admin_checks (admin_checks.tests.SystemChecksTestCase.test_app_label_in_admin_checks)",
            "test_apps_dependencies (admin_checks.tests.SystemChecksTestCase.test_apps_dependencies)",
