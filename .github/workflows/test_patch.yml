            - openjpeg=2.5.2=he7f1fd0_0
            - openldap=2.6.4=h42fbc30_0
            - openssl=3.0.15=h5eee18b_0
            - packaging=24.2=py39h06a4308_0
            - pandas=2.2.3=py39h6a678d5_0
