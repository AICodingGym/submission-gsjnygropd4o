name: SWE-bench Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-22.04
    timeout-minutes: 240
    env:
      INSTANCE_ID: "django__django-11477"
      REPO: "django/django"
      VERSION: "3.0"
      BASE_COMMIT: "e28671187903e6aca2428374fdd504fca3032aee"
      ENV_SETUP_COMMIT: "419a78300f7cd27611196e1e464d50fd0385ff27"
      TEST_CMD: './tests/runtests.py --verbosity 2 --settings=test_sqlite --parallel 1'
      TEST_FILES: 'tests/i18n/patterns/tests.py tests/i18n/patterns/urls/default.py tests/urlpatterns/path_urls.py tests/urlpatterns/tests.py tests/urlpatterns_reverse/tests.py'
      CONDA_ENV: "testbed"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          fetch-tags: false

      - name: Setup Miniconda
        uses: conda-incubator/setup-miniconda@v3
        with:
          auto-activate-base: false
          miniforge-variant: Miniforge3
          python-version: "3.6"

      - name: Git Safe Directory
        shell: "bash -l {0}"
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Create Conda Environment
        shell: "bash -l {0}"
        run: |
          set -euo pipefail
          source "$(conda info --base)/etc/profile.d/conda.sh"
          if [ "$ENV_SETUP_COMMIT" != "$BASE_COMMIT" ]; then
            if ! git cat-file -e "$ENV_SETUP_COMMIT^{commit}" 2>/dev/null; then
              echo "ENV_SETUP_COMMIT not found locally, fetching from upstream..."
              git fetch --depth=1 "https://github.com/$REPO.git" "$ENV_SETUP_COMMIT" || true
            fi
            if git cat-file -e "$ENV_SETUP_COMMIT^{commit}" 2>/dev/null; then
              git checkout "$ENV_SETUP_COMMIT"
            else
              echo "ENV_SETUP_COMMIT still missing; skipping checkout"
            fi
          fi
          cat <<'ENV_EOF' > /tmp/environment.yml
          name: testbed
          channels:
            - defaults
            - conda-forge
          dependencies:
            - _libgcc_mutex=0.1=main
            - _openmp_mutex=5.1=1_gnu
            - ca-certificates=2024.9.24=h06a4308_0
            - certifi=2021.5.30=py36h06a4308_0
            - ld_impl_linux-64=2.40=h12ee557_0
            - libffi=3.3=he6710b0_2
            - libgcc-ng=11.2.0=h1234567_1
            - libgomp=11.2.0=h1234567_1
            - libstdcxx-ng=11.2.0=h1234567_1
            - ncurses=6.4=h6a678d5_0
            - openssl=1.1.1w=h7f8727e_0
            - pip=21.2.2=py36h06a4308_0
            - python=3.6.13=h12debd9_1
            - readline=8.2=h5eee18b_0
            - setuptools=58.0.4=py36h06a4308_0
            - sqlite=3.45.3=h5eee18b_0
            - tk=8.6.14=h39e8969_0
            - wheel=0.37.1=pyhd3eb1b0_0
            - xz=5.4.6=h5eee18b_1
            - zlib=1.2.13=h5eee18b_1
            - pip:
                - aiohttp==3.8.6
                - aiosignal==1.2.0
                - argon2-cffi==21.3.0
                - argon2-cffi-bindings==21.2.0
                - asgiref==3.4.1
                - async-timeout==4.0.2
                - asynctest==0.13.0
                - attrs==22.2.0
                - bcrypt==4.0.1
                - cffi==1.15.1
                - charset-normalizer==2.0.12
                - dataclasses==0.8
                - docutils==0.18.1
                - frozenlist==1.2.0
                - geoip2==4.6.0
                - idna==3.10
                - idna-ssl==1.1.0
                - jinja2==3.0.3
                - markupsafe==2.0.1
                - maxminddb==2.2.0
                - multidict==5.2.0
                - numpy==1.19.5
                - pillow==8.4.0
                - pycparser==2.21
                - pylibmc==1.6.3
                - python-memcached==1.62
                - pytz==2024.2
                - pywatchman==1.4.1
                - pyyaml==6.0.1
                - requests==2.27.1
                - selenium==3.141.0
                - sqlparse==0.4.4
                - tblib==1.7.0
                - typing-extensions==4.1.1
                - urllib3==1.26.20
                - yarl==1.7.2
          ENV_EOF
          conda env create --file /tmp/environment.yml
          conda activate "$CONDA_ENV"
          rm /tmp/environment.yml

      - name: Checkout Trigger Commit
        shell: "bash -l {0}"
        run: |
          set -euo pipefail
          if ! git cat-file -e "$BASE_COMMIT^{commit}" 2>/dev/null; then
            git fetch --depth=1 "https://github.com/$REPO.git" "$BASE_COMMIT" || true
          fi
          if ! git cat-file -e "$GITHUB_SHA^{commit}" 2>/dev/null; then
            git fetch --depth=1 "https://github.com/$REPO.git" "$GITHUB_SHA" || true
          fi
          git checkout "$GITHUB_SHA"

      - name: Install Repo
        shell: "bash -l {0}"
        run: |
          set -euo pipefail
          source "$(conda info --base)/etc/profile.d/conda.sh"
          conda activate "$CONDA_ENV"
          git fetch --tags "https://github.com/$REPO.git" || true
          TARGET_TIMESTAMP=$(git show -s --format=%ci "$BASE_COMMIT")
          git tag -l | while read tag; do TAG_COMMIT=$(git rev-list -n 1 "$tag"); TAG_TIME=$(git show -s --format=%ci "$TAG_COMMIT"); if [[ "$TAG_TIME" > "$TARGET_TIMESTAMP" ]]; then git tag -d "$tag"; fi; done
          python -m pip install -e .

      - name: Apply Test Patch
        shell: "bash -l {0}"
        run: |
          set -euo pipefail
          git apply --verbose --reject - <<'PATCH_EOF'
          diff --git a/tests/i18n/patterns/tests.py b/tests/i18n/patterns/tests.py
          --- a/tests/i18n/patterns/tests.py
          +++ b/tests/i18n/patterns/tests.py
          @@ -158,6 +158,15 @@ def test_translate_url_utility(self):
                       # path() URL pattern
                       self.assertEqual(translate_url('/en/account/register-as-path/', 'nl'), '/nl/profiel/registreren-als-pad/')
                       self.assertEqual(translation.get_language(), 'en')
          +            # URL with parameters.
          +            self.assertEqual(
          +                translate_url('/en/with-arguments/regular-argument/', 'nl'),
          +                '/nl/with-arguments/regular-argument/',
          +            )
          +            self.assertEqual(
          +                translate_url('/en/with-arguments/regular-argument/optional.html', 'nl'),
          +                '/nl/with-arguments/regular-argument/optional.html',
          +            )
           
                   with translation.override('nl'):
                       self.assertEqual(translate_url('/nl/gebruikers/', 'en'), '/en/users/')
          diff --git a/tests/i18n/patterns/urls/default.py b/tests/i18n/patterns/urls/default.py
          --- a/tests/i18n/patterns/urls/default.py
          +++ b/tests/i18n/patterns/urls/default.py
          @@ -15,6 +15,11 @@
           urlpatterns += i18n_patterns(
               path('prefixed/', view, name='prefixed'),
               path('prefixed.xml', view, name='prefixed_xml'),
          +    re_path(
          +        _(r'^with-arguments/(?P<argument>[\w-]+)/(?:(?P<optional>[\w-]+).html)?$'),
          +        view,
          +        name='with-arguments',
          +    ),
               re_path(_(r'^users/$'), view, name='users'),
               re_path(_(r'^account/'), include('i18n.patterns.urls.namespace', namespace='account')),
           )
          diff --git a/tests/urlpatterns/path_urls.py b/tests/urlpatterns/path_urls.py
          --- a/tests/urlpatterns/path_urls.py
          +++ b/tests/urlpatterns/path_urls.py
          @@ -11,6 +11,7 @@
               path('users/<id>/', views.empty_view, name='user-with-id'),
               path('included_urls/', include('urlpatterns.included_urls')),
               re_path(r'^regex/(?P<pk>[0-9]+)/$', views.empty_view, name='regex'),
          +    re_path(r'^regex_optional/(?P<arg1>\d+)/(?:(?P<arg2>\d+)/)?', views.empty_view, name='regex_optional'),
               path('', include('urlpatterns.more_urls')),
               path('<lang>/<path:url>/', views.empty_view, name='lang-and-path'),
           ]
          diff --git a/tests/urlpatterns/tests.py b/tests/urlpatterns/tests.py
          --- a/tests/urlpatterns/tests.py
          +++ b/tests/urlpatterns/tests.py
          @@ -54,6 +54,20 @@ def test_re_path(self):
                   self.assertEqual(match.kwargs, {'pk': '1'})
                   self.assertEqual(match.route, '^regex/(?P<pk>[0-9]+)/$')
           
          +    def test_re_path_with_optional_parameter(self):
          +        for url, kwargs in (
          +            ('/regex_optional/1/2/', {'arg1': '1', 'arg2': '2'}),
          +            ('/regex_optional/1/', {'arg1': '1'}),
          +        ):
          +            with self.subTest(url=url):
          +                match = resolve(url)
          +                self.assertEqual(match.url_name, 'regex_optional')
          +                self.assertEqual(match.kwargs, kwargs)
          +                self.assertEqual(
          +                    match.route,
          +                    r'^regex_optional/(?P<arg1>\d+)/(?:(?P<arg2>\d+)/)?',
          +                )
          +
               def test_path_lookup_with_inclusion(self):
                   match = resolve('/included_urls/extra/something/')
                   self.assertEqual(match.url_name, 'inner-extra')
          diff --git a/tests/urlpatterns_reverse/tests.py b/tests/urlpatterns_reverse/tests.py
          --- a/tests/urlpatterns_reverse/tests.py
          +++ b/tests/urlpatterns_reverse/tests.py
          @@ -180,6 +180,8 @@
               ('named_optional', '/optional/1/', [], {'arg1': 1}),
               ('named_optional', '/optional/1/2/', [1, 2], {}),
               ('named_optional', '/optional/1/2/', [], {'arg1': 1, 'arg2': 2}),
          +    ('named_optional_terminated', '/optional/1/', [1], {}),
          +    ('named_optional_terminated', '/optional/1/', [], {'arg1': 1}),
               ('named_optional_terminated', '/optional/1/2/', [1, 2], {}),
               ('named_optional_terminated', '/optional/1/2/', [], {'arg1': 1, 'arg2': 2}),
               ('hardcoded', '/hardcoded/', [], {}),
          PATCH_EOF

      - name: Run Tests
        shell: "bash -l {0}"
        run: |
          set -euo pipefail
          source "$(conda info --base)/etc/profile.d/conda.sh"
          conda activate "$CONDA_ENV"
          sed -i '/en_US.UTF-8/s/^# //g' /etc/locale.gen && locale-gen
          export LANG=en_US.UTF-8
          export LANGUAGE=en_US:en
          export LC_ALL=en_US.UTF-8
          FAIL_TO_PASS_PATH=/tmp/fail_to_pass.json
          PASS_TO_PASS_PATH=/tmp/pass_to_pass.json
          TEST_DIRECTIVES_PATH=/tmp/test_directives.json
          TEST_RESULTS_PATH=/tmp/test_results.txt
          cat <<'FAIL_EOF' > "$FAIL_TO_PASS_PATH"
          ["test_re_path_with_optional_parameter (urlpatterns.tests.SimplifiedURLTests)", "test_two_variable_at_start_of_path_pattern (urlpatterns.tests.SimplifiedURLTests)", "test_translate_url_utility (i18n.patterns.tests.URLTranslationTests)"]
          FAIL_EOF
          cat <<'PASS_EOF' > "$PASS_TO_PASS_PATH"
