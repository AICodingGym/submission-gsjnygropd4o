          python -m pip install contourpy==1.1.0 cycler==0.11.0 fonttools==4.42.1 ghostscript kiwisolver==1.4.5 numpy==1.25.2 packaging==23.1 pillow==10.0.0 pikepdf pyparsing==3.0.9 python-dateutil==2.8.2 six==1.16.0 setuptools==68.1.2 setuptools-scm==7.1.0 typing-extensions==4.7.1

      - name: Checkout Trigger Commit
        shell: "bash -l {0}"
        run: |
          set -euo pipefail
          if ! git cat-file -e "$BASE_COMMIT^{commit}" 2>/dev/null; then
            git fetch --depth=1 "https://github.com/$REPO.git" "$BASE_COMMIT" || true
          fi
          if ! git cat-file -e "$GITHUB_SHA^{commit}" 2>/dev/null; then
            git fetch --depth=1 "https://github.com/$REPO.git" "$GITHUB_SHA" || true
          fi
          git checkout "$GITHUB_SHA"

      - name: Install Repo
        shell: "bash -l {0}"
        run: |
          set -euo pipefail
          source "$(conda info --base)/etc/profile.d/conda.sh"
          conda activate "$CONDA_ENV"
          git fetch --tags "https://github.com/$REPO.git" || true
          TARGET_TIMESTAMP=$(git show -s --format=%ci "$BASE_COMMIT")
          git tag -l | while read tag; do TAG_COMMIT=$(git rev-list -n 1 "$tag"); TAG_TIME=$(git show -s --format=%ci "$TAG_COMMIT"); if [[ "$TAG_TIME" > "$TARGET_TIMESTAMP" ]]; then git tag -d "$tag"; fi; done
          sudo apt-get -y update && sudo apt-get -y upgrade && DEBIAN_FRONTEND=noninteractive sudo apt-get install -y imagemagick ffmpeg texlive texlive-latex-extra texlive-fonts-recommended texlive-xetex texlive-luatex cm-super dvipng
          QHULL_URL="http://www.qhull.org/download/qhull-2020-src-8.0.2.tgz"
          QHULL_TAR="/tmp/qhull-2020-src-8.0.2.tgz"
          QHULL_BUILD_DIR="$GITHUB_WORKSPACE/build"
          wget -O "$QHULL_TAR" "$QHULL_URL"
          mkdir -p "$QHULL_BUILD_DIR"
          tar -xvzf "$QHULL_TAR" -C "$QHULL_BUILD_DIR"
          python -m pip install -e .

      - name: Apply Test Patch
        shell: "bash -l {0}"
        run: |
          set -euo pipefail
          git apply --verbose --reject - <<'PATCH_EOF'
          diff --git a/lib/matplotlib/tests/test_axes.py b/lib/matplotlib/tests/test_axes.py
          --- a/lib/matplotlib/tests/test_axes.py
          +++ b/lib/matplotlib/tests/test_axes.py
          @@ -7811,6 +7811,28 @@ def test_ytickcolor_is_not_yticklabelcolor():
                   assert tick.label1.get_color() == 'blue'
           
           
          +def test_xaxis_offsetText_color():
          +    plt.rcParams['xtick.labelcolor'] = 'blue'
          +    ax = plt.axes()
          +    assert ax.xaxis.offsetText.get_color() == 'blue'
          +
          +    plt.rcParams['xtick.color'] = 'yellow'
          +    plt.rcParams['xtick.labelcolor'] = 'inherit'
          +    ax = plt.axes()
          +    assert ax.xaxis.offsetText.get_color() == 'yellow'
          +
          +
          +def test_yaxis_offsetText_color():
          +    plt.rcParams['ytick.labelcolor'] = 'green'
          +    ax = plt.axes()
          +    assert ax.yaxis.offsetText.get_color() == 'green'
          +
          +    plt.rcParams['ytick.color'] = 'red'
          +    plt.rcParams['ytick.labelcolor'] = 'inherit'
          +    ax = plt.axes()
          +    assert ax.yaxis.offsetText.get_color() == 'red'
          +
          +
           @pytest.mark.parametrize('size', [size for size in mfont_manager.font_scalings
                                             if size is not None] + [8, 10, 12])
           @mpl.style.context('default')
          PATCH_EOF

