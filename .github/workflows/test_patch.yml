name: SWE-bench Tests

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-22.04
    timeout-minutes: 240
    env:
      INSTANCE_ID: "django__django-13315"
      REPO: "django/django"
      VERSION: "3.2"
      BASE_COMMIT: "36bc47069ce071e80c8129500de3b8664d2058a7"
      ENV_SETUP_COMMIT: "65dfb06a1ab56c238cc80f5e1c31f61210c4577d"
      TEST_CMD: './tests/runtests.py --verbosity 2 --settings=test_sqlite --parallel 1'
      TEST_FILES: 'tests/model_forms/models.py tests/model_forms/tests.py'
      CONDA_ENV: "testbed"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          fetch-tags: false

      - name: Setup Miniconda
        uses: conda-incubator/setup-miniconda@v3
        with:
          auto-activate-base: false
          miniforge-variant: Miniforge3
          python-version: "3.6"

      - name: Git Safe Directory
        shell: "bash -l {0}"
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Create Conda Environment
        shell: "bash -l {0}"
        run: |
          set -euo pipefail
          source "$(conda info --base)/etc/profile.d/conda.sh"
          if [ "$ENV_SETUP_COMMIT" != "$BASE_COMMIT" ]; then
            if ! git cat-file -e "$ENV_SETUP_COMMIT^{commit}" 2>/dev/null; then
              echo "ENV_SETUP_COMMIT not found locally, fetching from upstream..."
              git fetch --depth=1 "https://github.com/$REPO.git" "$ENV_SETUP_COMMIT" || true
            fi
            if git cat-file -e "$ENV_SETUP_COMMIT^{commit}" 2>/dev/null; then
              git checkout "$ENV_SETUP_COMMIT"
            else
              echo "ENV_SETUP_COMMIT still missing; skipping checkout"
            fi
          fi
          cat <<'ENV_EOF' > /tmp/environment.yml
          name: testbed
          channels:
            - defaults
            - conda-forge
          dependencies:
            - _libgcc_mutex=0.1=main
            - _openmp_mutex=5.1=1_gnu
            - ca-certificates=2024.9.24=h06a4308_0
            - certifi=2021.5.30=py36h06a4308_0
            - ld_impl_linux-64=2.40=h12ee557_0
            - libffi=3.3=he6710b0_2
            - libgcc-ng=11.2.0=h1234567_1
            - libgomp=11.2.0=h1234567_1
            - libstdcxx-ng=11.2.0=h1234567_1
            - ncurses=6.4=h6a678d5_0
            - openssl=1.1.1w=h7f8727e_0
            - pip=21.2.2=py36h06a4308_0
            - python=3.6.13=h12debd9_1
            - readline=8.2=h5eee18b_0
            - setuptools=58.0.4=py36h06a4308_0
            - sqlite=3.45.3=h5eee18b_0
            - tk=8.6.14=h39e8969_0
            - wheel=0.37.1=pyhd3eb1b0_0
            - xz=5.4.6=h5eee18b_1
            - zlib=1.2.13=h5eee18b_1
            - pip:
                - aiohttp==3.8.6
                - aiosignal==1.2.0
                - argon2-cffi==21.3.0
                - argon2-cffi-bindings==21.2.0
                - asgiref==3.4.1
                - async-timeout==4.0.2
                - asynctest==0.13.0
                - attrs==22.2.0
                - backports-zoneinfo==0.2.1
                - bcrypt==4.0.1
                - cffi==1.15.1
                - charset-normalizer==2.0.12
                - dataclasses==0.8
                - docutils==0.18.1
                - frozenlist==1.2.0
                - geoip2==4.6.0
                - idna==3.10
                - idna-ssl==1.1.0
                - importlib-resources==5.4.0
                - jinja2==3.0.3
                - markupsafe==2.0.1
                - maxminddb==2.2.0
                - multidict==5.2.0
                - numpy==1.19.5
                - pillow==8.4.0
                - pycparser==2.21
                - pylibmc==1.6.3
                - pymemcache==3.5.2
                - python-memcached==1.62
                - pytz==2024.2
                - pywatchman==1.4.1
                - pyyaml==6.0.1
                - requests==2.27.1
                - selenium==3.141.0
                - six==1.16.0
                - sqlparse==0.4.4
                - tblib==1.7.0
                - typing-extensions==4.1.1
                - tzdata==2024.2
                - urllib3==1.26.20
                - yarl==1.7.2
                - zipp==3.6.0
          ENV_EOF
          conda env create --file /tmp/environment.yml
          conda activate "$CONDA_ENV"
          rm /tmp/environment.yml

      - name: Checkout Trigger Commit
        shell: "bash -l {0}"
        run: |
          set -euo pipefail
          if ! git cat-file -e "$BASE_COMMIT^{commit}" 2>/dev/null; then
            git fetch --depth=1 "https://github.com/$REPO.git" "$BASE_COMMIT" || true
          fi
          if ! git cat-file -e "$GITHUB_SHA^{commit}" 2>/dev/null; then
            git fetch --depth=1 "https://github.com/$REPO.git" "$GITHUB_SHA" || true
          fi
          git checkout "$GITHUB_SHA"

      - name: Install Repo
        shell: "bash -l {0}"
        run: |
          set -euo pipefail
          source "$(conda info --base)/etc/profile.d/conda.sh"
          conda activate "$CONDA_ENV"
          git fetch --tags "https://github.com/$REPO.git" || true
          TARGET_TIMESTAMP=$(git show -s --format=%ci "$BASE_COMMIT")
          git tag -l | while read tag; do TAG_COMMIT=$(git rev-list -n 1 "$tag"); TAG_TIME=$(git show -s --format=%ci "$TAG_COMMIT"); if [[ "$TAG_TIME" > "$TARGET_TIMESTAMP" ]]; then git tag -d "$tag"; fi; done
          python -m pip install -e .

      - name: Apply Test Patch
        shell: "bash -l {0}"
        run: |
          set -euo pipefail
          git apply --verbose --reject - <<'PATCH_EOF'
          diff --git a/tests/model_forms/models.py b/tests/model_forms/models.py
          --- a/tests/model_forms/models.py
          +++ b/tests/model_forms/models.py
          @@ -411,9 +411,14 @@ class StumpJoke(models.Model):
                   Character,
                   models.CASCADE,
                   limit_choices_to=today_callable_dict,
          -        related_name="+",
          +        related_name='jokes',
               )
          -    has_fooled_today = models.ManyToManyField(Character, limit_choices_to=today_callable_q, related_name="+")
          +    has_fooled_today = models.ManyToManyField(
          +        Character,
          +        limit_choices_to=today_callable_q,
          +        related_name='jokes_today',
          +    )
          +    funny = models.BooleanField(default=False)
           
           
           # Model for #13776
          diff --git a/tests/model_forms/tests.py b/tests/model_forms/tests.py
          --- a/tests/model_forms/tests.py
          +++ b/tests/model_forms/tests.py
          @@ -16,6 +16,7 @@
           )
           from django.template import Context, Template
           from django.test import SimpleTestCase, TestCase, skipUnlessDBFeature
          +from django.test.utils import isolate_apps
           
           from .models import (
               Article, ArticleStatus, Author, Author1, Award, BetterWriter, BigInt, Book,
          @@ -2829,6 +2830,72 @@ def test_callable_called_each_time_form_is_instantiated(self):
                       StumpJokeForm()
                       self.assertEqual(today_callable_dict.call_count, 3)
           
          +    @isolate_apps('model_forms')
          +    def test_limit_choices_to_no_duplicates(self):
          +        joke1 = StumpJoke.objects.create(
          +            funny=True,
          +            most_recently_fooled=self.threepwood,
          +        )
          +        joke2 = StumpJoke.objects.create(
          +            funny=True,
          +            most_recently_fooled=self.threepwood,
          +        )
          +        joke3 = StumpJoke.objects.create(
          +            funny=True,
          +            most_recently_fooled=self.marley,
          +        )
          +        StumpJoke.objects.create(funny=False, most_recently_fooled=self.marley)
          +        joke1.has_fooled_today.add(self.marley, self.threepwood)
          +        joke2.has_fooled_today.add(self.marley)
          +        joke3.has_fooled_today.add(self.marley, self.threepwood)
          +
          +        class CharacterDetails(models.Model):
          +            character1 = models.ForeignKey(
          +                Character,
          +                models.CASCADE,
          +                limit_choices_to=models.Q(
          +                    jokes__funny=True,
          +                    jokes_today__funny=True,
          +                ),
          +                related_name='details_fk_1',
          +            )
          +            character2 = models.ForeignKey(
          +                Character,
          +                models.CASCADE,
          +                limit_choices_to={
          +                    'jokes__funny': True,
          +                    'jokes_today__funny': True,
          +                },
          +                related_name='details_fk_2',
          +            )
          +            character3 = models.ManyToManyField(
          +                Character,
          +                limit_choices_to=models.Q(
          +                    jokes__funny=True,
          +                    jokes_today__funny=True,
          +                ),
          +                related_name='details_m2m_1',
          +            )
          +
          +        class CharacterDetailsForm(forms.ModelForm):
          +            class Meta:
          +                model = CharacterDetails
          +                fields = '__all__'
          +
          +        form = CharacterDetailsForm()
          +        self.assertCountEqual(
          +            form.fields['character1'].queryset,
          +            [self.marley, self.threepwood],
          +        )
          +        self.assertCountEqual(
          +            form.fields['character2'].queryset,
          +            [self.marley, self.threepwood],
          +        )
          +        self.assertCountEqual(
          +            form.fields['character3'].queryset,
          +            [self.marley, self.threepwood],
          +        )
          +
           
           class FormFieldCallbackTests(SimpleTestCase):
           
          PATCH_EOF

      - name: Run Tests
        shell: "bash -l {0}"
        run: |
          set -euo pipefail
          source "$(conda info --base)/etc/profile.d/conda.sh"
          conda activate "$CONDA_ENV"
          sed -i '/en_US.UTF-8/s/^# //g' /etc/locale.gen && locale-gen
          export LANG=en_US.UTF-8
          export LANGUAGE=en_US:en
          export LC_ALL=en_US.UTF-8
          FAIL_TO_PASS_PATH=/tmp/fail_to_pass.json
          PASS_TO_PASS_PATH=/tmp/pass_to_pass.json
          TEST_DIRECTIVES_PATH=/tmp/test_directives.json
          TEST_RESULTS_PATH=/tmp/test_results.txt
          cat <<'FAIL_EOF' > "$FAIL_TO_PASS_PATH"
          ["test_limit_choices_to_no_duplicates (model_forms.tests.LimitChoicesToTests)"]
          FAIL_EOF
